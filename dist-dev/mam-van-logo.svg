<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Mầm Văn Official Logo - Nền tảng học Ngữ văn 7 -->
  <defs>
    <!-- Background Soft Radial Glow -->
    <radialGradient id="bgGlow" cx="200" cy="200" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FAF9F5" />
      <stop offset="100%" stop-color="#F5F3EC" />
    </radialGradient>

    <!-- Gradient Bìa Sách Xanh Thẫm -->
    <linearGradient id="bookCoverGrad" x1="200" y1="230" x2="200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D6846" />
      <stop offset="100%" stop-color="#1A472E" />
    </linearGradient>

    <!-- Gradient Trang Sách Trái -->
    <linearGradient id="pageLeftGrad" x1="80" y1="200" x2="200" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCFAF4" />
      <stop offset="60%" stop-color="#F2E8D5" />
      <stop offset="100%" stop-color="#E4D5BC" />
    </linearGradient>

    <!-- Gradient Trang Sách Phải -->
    <linearGradient id="pageRightGrad" x1="200" y1="255" x2="320" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4D5BC" />
      <stop offset="40%" stop-color="#F2E8D5" />
      <stop offset="100%" stop-color="#FCFAF4" />
    </linearGradient>

    <!-- Gradient Lá Trái (Xanh tươi) -->
    <linearGradient id="leafLeftGrad" x1="120" y1="150" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6FAF79" />
      <stop offset="60%" stop-color="#4D8F5A" />
      <stop offset="100%" stop-color="#367345" />
    </linearGradient>

    <!-- Gradient Lá Phải Tích Hợp Ngòi Bút -->
    <linearGradient id="leafRightGrad" x1="200" y1="160" x2="295" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#255937" />
      <stop offset="50%" stop-color="#3B7D4E" />
      <stop offset="100%" stop-color="#5FA06E" />
    </linearGradient>

    <!-- Gradient Dải Lụa & Ánh Sao Vàng Hoàng Kim -->
    <linearGradient id="goldRibbonGrad" x1="170" y1="60" x2="290" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0CE7A" />
      <stop offset="45%" stop-color="#D4A346" />
      <stop offset="100%" stop-color="#B28229" />
    </linearGradient>

    <!-- Filter Bóng Đổ Thanh Thoát -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1A472E" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- NỀN TRẮNG KEM NHẸ NHÀNG -->
  <rect width="400" height="400" rx="40" fill="url(#bgGlow)" />

  <!-- ================= 1. CUỐN SÁCH ĐANG MỞ (BOOK BASE) ================= -->
  <g filter="url(#softShadow)">
    <!-- Bìa sách xanh thẫm bên dưới cùng -->
    <path
      d="M 68 248 C 105 238, 155 246, 200 258 C 245 246, 295 238, 332 248 C 322 262, 268 269, 200 274 C 132 269, 78 262, 68 248 Z"
      fill="url(#bookCoverGrad)"
    />

    <!-- Tầng trang sách số 3 (dưới cùng) -->
    <path
      d="M 72 242 C 108 233, 155 241, 200 252 C 245 241, 292 233, 328 242 C 314 251, 265 255, 200 260 C 135 255, 86 251, 72 242 Z"
      fill="#D4C1A2"
    />

    <!-- Tầng trang sách số 2 (ở giữa) -->
    <path
      d="M 78 232 C 112 221, 155 231, 200 244 C 245 231, 288 221, 322 232 C 308 241, 262 246, 200 251 C 138 246, 92 241, 78 232 Z"
      fill="#EBDDC4"
    />

    <!-- Tầng trang sách chính bên trái (uốn cong đón ánh sáng) -->
    <path
      d="M 200 242 C 165 221, 126 211, 95 218 C 91 208, 97 200, 104 196 C 136 193, 170 207, 200 234 Z"
      fill="url(#pageLeftGrad)"
      stroke="#27643E"
      stroke-width="1.6"
    />

    <!-- Tầng trang sách chính bên phải -->
    <path
      d="M 200 242 C 235 221, 274 211, 305 218 C 309 208, 303 200, 296 196 C 264 193, 230 207, 200 234 Z"
      fill="url(#pageRightGrad)"
      stroke="#27643E"
      stroke-width="1.6"
    />

    <!-- Nếp gấp gáy sách & khuy tròn vàng kết nối ở tâm đáy -->
    <ellipse cx="200" cy="254" rx="13" ry="7.5" fill="#C99738" stroke="#9E7120" stroke-width="1.2" />
    <ellipse cx="200" cy="254" rx="7" ry="3.5" fill="#F4D388" />
  </g>

  <!-- ================= 2. DẢI LỤA VÀNG UỐN LƯỢN (GOLDEN RIBBON SWIRL) ================= -->
  <path
    d="M 170 198 C 174 186, 190 190, 196 205 C 204 222, 214 206, 228 182 C 244 152, 268 138, 284 128"
    stroke="url(#goldRibbonGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- ================= 3. THÂN MẦM CÂY NON VƯƠN CAO ================= -->
  <path
    d="M 200 244 C 199 216, 201 184, 203 150 C 204 135, 206 120, 209 104"
    stroke="#27643E"
    stroke-width="6.5"
    stroke-linecap="round"
  />

  <!-- ================= 4. CHIẾC LÁ NHỎ BÊN TRÁI (LEFT LEAF) ================= -->
  <g filter="url(#softShadow)">
    <path
      d="M 200 148 C 180 138, 152 130, 128 138 C 110 144, 111 161, 127 172 C 154 185, 182 171, 200 148 Z"
      fill="url(#leafLeftGrad)"
    />
    <!-- Gân lá / vệt sáng nhẹ -->
    <path
      d="M 134 147 C 150 151, 172 158, 192 153"
      stroke="#A8D6AF"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity="0.6"
    />
  </g>

  <!-- ================= 5. CHIẾC LÁ LỚN TÍCH HỢP NGÒI BÚT MÁY (RIGHT LEAF + PEN NIB) ================= -->
  <g filter="url(#softShadow)">
    <!-- Dáng lá lớn xanh mướt vươn cao bên phải -->
    <path
      d="M 205 144 C 216 122, 232 88, 258 54 C 276 32, 286 38, 292 52 C 302 76, 298 116, 272 156 C 250 186, 222 188, 206 164 Z"
      fill="url(#leafRightGrad)"
    />

    <!-- NGÒI BÚT MÁY MÀU TRẮNG TINH KHÔI BÊN TRONG LÁ -->
    <path
      d="M 234 134 C 242 120, 254 104, 267 78 C 275 62, 280 52, 284 44 C 279 56, 281 70, 279 84 C 276 102, 264 118, 252 131 C 244 138, 236 138, 234 134 Z"
      fill="#FFFFFF"
    />

    <!-- Lỗ thở ngòi bút (Breather Hole) - chấm tròn xanh thẫm -->
    <circle cx="266" cy="88" r="3.5" fill="#255937" />

    <!-- Khe dẫn mực (Ink Slit) nối từ lỗ thở đến đầu ngòi bút -->
    <path
      d="M 266 84 L 284 44"
      stroke="#255937"
      stroke-width="2"
      stroke-linecap="round"
    />
  </g>

  <!-- ================= 6. BA NGÔI SAO LẤP LÁNH ÁNH VÀNG (3 GOLD SPARKLES) ================= -->
  <!-- 1. Ngôi sao ở đỉnh giữa 2 lá -->
  <g>
    <path
      d="M 193 64 Q 193 75 202 75 Q 193 75 193 86 Q 193 75 184 75 Q 193 75 193 64 Z"
      fill="#E5B757"
    />
    <circle cx="193" cy="75" r="1.8" fill="#FFFDF8" />
  </g>

  <!-- 2. Ngôi sao nhỏ bên trái phía dưới lá non -->
  <g>
    <path
      d="M 156 154 Q 156 161 161 161 Q 156 161 156 168 Q 156 161 151 161 Q 156 161 156 154 Z"
      fill="#E5B757"
    />
  </g>

  <!-- 3. Ngôi sao nhỏ bên phải phía trên trang sách -->
  <g>
    <path
      d="M 239 174 Q 239 179 244 179 Q 239 179 239 184 Q 239 179 234 179 Q 239 179 239 174 Z"
      fill="#E5B757"
    />
  </g>

  <!-- ================= 7. TYPOGRAPHY "MẦM VĂN" ĐẶC TRƯNG ================= -->
  <g id="typography">
    <!-- CHỮ "MẦM" (XANH LÁ ĐẬM #1E5238 VỚI CẶP LÁ MẦM NON TRÊN CHỮ Â) -->
    <!-- Chữ M -->
    <text
      x="80"
      y="336"
      font-family="'Lora', 'Be Vietnam Pro', Georgia, serif"
      font-size="64"
      font-weight="bold"
      fill="#1E5238"
      letter-spacing="-1"
    >M</text>

    <!-- Chữ â với mầm lá xanh làm dấu trên đầu -->
    <g transform="translate(136, 336)">
      <text
        x="0"
        y="0"
        font-family="'Lora', 'Be Vietnam Pro', Georgia, serif"
        font-size="64"
        font-weight="bold"
        fill="#1E5238"
        letter-spacing="-1"
      >a</text>

      <!-- DẤU MŨ CÁCH ĐIỆU BẰNG CẶP LÁ NON XANH MƯỚT (Sprout Accent) -->
      <g transform="translate(16, -56)">
        <!-- Lá trái vươn sang trái -->
        <path
          d="M 0 16 C -6 8, -18 6, -22 10 C -25 15, -20 20, -10 20 C -3 20, 0 18, 0 16 Z"
          fill="#4D8F5A"
        />
        <!-- Lá phải vươn sang phải -->
        <path
          d="M 0 16 C 6 6, 18 -1, 28 4 C 31 10, 26 17, 14 18 C 5 19, 1 18, 0 16 Z"
          fill="#6FAF79"
        />
        <!-- Điểm cuống mầm -->
        <circle cx="0" cy="17" r="1.5" fill="#367345" />
      </g>
    </g>

    <!-- Chữ m -->
    <text
      x="172"
      y="336"
      font-family="'Lora', 'Be Vietnam Pro', Georgia, serif"
      font-size="64"
      font-weight="bold"
      fill="#1E5238"
      letter-spacing="-1"
    >m</text>

    <!-- CHỮ "VĂN" (VÀNG HOÀNG KIM #C38F36) -->
    <!-- Chữ V -->
    <text
      x="224"
      y="336"
      font-family="'Lora', 'Be Vietnam Pro', Georgia, serif"
      font-size="64"
      font-weight="bold"
      fill="#C38F36"
      letter-spacing="-1"
    >V</text>

    <!-- Chữ ă (với dấu trăng khuyết ă) -->
    <text
      x="272"
      y="336"
      font-family="'Lora', 'Be Vietnam Pro', Georgia, serif"
      font-size="64"
      font-weight="bold"
      fill="#C38F36"
      letter-spacing="-1"
    >ă</text>

    <!-- Chữ n -->
    <text
      x="312"
      y="336"
      font-family="'Lora', 'Be Vietnam Pro', Georgia, serif"
      font-size="64"
      font-weight="bold"
      fill="#C38F36"
      letter-spacing="-1"
    >n</text>
  </g>
</svg>
