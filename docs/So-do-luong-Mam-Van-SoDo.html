<style>
  * { box-sizing: border-box; }

  svg { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }

  #world { will-change: transform; }
  .edge { fill:none; stroke:#B9A77F; stroke-width:1.5; }
  .branchlink { stroke:#8C7E6A; stroke-width:3; }
  .rel { fill:none; stroke:#D64545; stroke-width:2.1; stroke-dasharray:7 5; opacity:.8; marker-end:url(#arr); }

  .ttl { font-size:12.5px; text-anchor:middle; }
  .meta { font-size:10.5px; text-anchor:middle; }
  .roottitle { font-size:21px; font-weight:800; fill:#FFF7E8; text-anchor:middle; }
  .rootsub { font-size:12.5px; fill:#FFF7E8; opacity:.85; text-anchor:middle; }
  .node { cursor:pointer; transition: opacity .25s; }
  path.edge, .rel, .rellbl { transition: opacity .25s; }
  .dim { opacity: .07 !important; }
  .rel.hot { opacity: 1 !important; stroke-width: 3.4; }
  .node.lit rect { stroke-width: 3.2; }
  #fname { font-size:12.5px; font-weight:700; color:#FFD166; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>

["eba5a87c-0d5e-4745-84f3-80851b1b28d7", "f5c041a1-ef22-4c9f-82e4-e01ff0842c1f"], ["816b2f66-2997-4dc2-a455-199a795a1e6d", "8f4fc907-a405-4394-b276-e517ca3ea714"], ["27b53d0f-571a-4bab-bf9f-3e00c87e81a0", "a1279d08-832b-48be-979c-df39cea70b8e"], ["c5d828e2-3597-40af-8adf-61155d298615", "14467167-e6d7-4b3d-a14c-dfd4f719e6da"], ["78edaa7d-a49c-4943-b67a-691b24272f46", "0bc2f1b5-1c58-484c-b8c1-5d293187301d"], ["78b2dfa4-8cfc-4ea1-b44e-316221a426bd", "4cc62b38-06dd-4efe-86e7-6b7484d4f06b"], ["984e73ea-bc19-4bc1-b1f9-0ccbbfb7fb2f", "bb44cae7-5141-4f96-b5c3-280d88cfc958"], ["993de3a3-5209-4f26-9455-124291eecced", "cde4ff96-8423-4c41-a9be-f83e031f5d84"], ["18b55de0-b6a9-41c6-8832-ed96e27ee452", "3c7bbd27-52a5-42bf-814d-ef81d17a40dc"], ["ad7d07a6-c783-42e3-a729-27a7d03717ae", "cfb44695-86b8-4c22-a007-589f9fdb28eb"], ["a76a3472-765c-4f69-8408-5314c050b8f0", "582f22bb-bcd6-474b-a6cf-ce1f2e646af8"]]}</script>
<script>
  const svg = document.getElementById('svg');
  const world = document.getElementById('world');
  const FULL = { x: -3940.0, y: -5846.5, w: 5756.0, h: 11693.0 };
  const GVB = [-3890.0, -5796.5, 3600.0, 9510.0];
  const HSB = [290.0, -5234.0, 1476.0, 7012.0];
  let k = 1, tx = 0, ty = 0;
  function apply() { world.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`); }
  function stageSize() { const r = svg.getBoundingClientRect(); return { w: r.width, h: r.height }; }
  function fitAll() {
    const s = stageSize();
    k = Math.min(s.w / FULL.w, s.h / FULL.h);
    tx = (s.w - FULL.w * k) / 2 - FULL.x * k;
    ty = (s.h - FULL.h * k) / 2 - FULL.y * k;
    apply();
  }
  function jump(r) {
    const s = stageSize();
    k = Math.min(s.w / (r[2] + 60), s.h / (r[3] + 60));
    tx = s.w / 2 - (r[0] + r[2] / 2) * k;
    ty = s.h / 2 - (r[1] + r[3] / 2) * k;
    apply();
  }
  function zoomAt(mx, my, f) {
    const px = (mx - tx) / k, py = (my - ty) / k;
    const k2 = Math.min(4, Math.max(0.02, k * f));
    tx = mx - px * k2; ty = my - py * k2; k = k2;
    apply();
  }
  function zoomC(f) { const s = stageSize(); zoomAt(s.w / 2, s.h / 2, f); }
  function toggleRel() {
    const l = document.getElementById('rellayer');
    const off = l.style.display === 'none';
    l.style.display = off ? '' : 'none';
    document.getElementById('relbtn').textContent = off ? 'Ẩn đường quan hệ' : 'Hiện đường quan hệ';
  }
  const ptrs = new Map();
  let lastPinch = 0, lastMid = null, downMoved = 0, hitId = null, multi = false;
  svg.addEventListener('pointerdown', e => {
    if (ptrs.size >= 1) multi = true;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const g = e.target && e.target.closest ? e.target.closest('g.node') : null;
    hitId = g ? g.dataset.id : null;
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    lastPinch = 0; lastMid = null; downMoved = 0;
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) {
      downMoved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
      tx += e.clientX - prev.x; ty += e.clientY - prev.y;
      apply();
    } else if (ptrs.size === 2) {
      const p = [...ptrs.values()];
      const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const mid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
      const r = svg.getBoundingClientRect();
      if (lastPinch > 0) zoomAt(mid.x - r.left, mid.y - r.top, dist / lastPinch);
      if (lastMid) { tx += mid.x - lastMid.x; ty += mid.y - lastMid.y; apply(); }
      lastPinch = dist; lastMid = mid;
    }
  });
  const endPtr = e => { ptrs.delete(e.pointerId); lastPinch = 0; lastMid = null; };
  svg.addEventListener('pointerup', endPtr);
  svg.addEventListener('pointercancel', endPtr);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });

  // ===== Che do bam-chon: nut lien quan sang len, con lai mo di =====
  const G = JSON.parse(document.getElementById('graph').textContent);
  const edgeEls = [...document.querySelectorAll('path.edge')];
  const relEls = [...document.querySelectorAll('#rellayer .rel, #rellayer .rellbl')];
  function focusNode(id) {
    const S = new Set([id]);
    const stack = [id];
    while (stack.length) { const cur = stack.pop(); (G.children[cur] || []).forEach(c => { S.add(c); stack.push(c); }); }
    let p = G.parent[id];
    while (p) { S.add(p); p = G.parent[p]; }
    G.rels.forEach(([a, b]) => { if (a === id) S.add(b); if (b === id) S.add(a); });
    document.querySelectorAll('g.node').forEach(el => {
      el.classList.toggle('dim', !S.has(el.dataset.id));
      el.classList.toggle('lit', S.has(el.dataset.id));
    });
    edgeEls.forEach(el => el.classList.toggle('dim', !(S.has(el.dataset.a) && S.has(el.dataset.b))));
    relEls.forEach(el => {
      const on = (el.dataset.a === id && S.has(el.dataset.b)) || (el.dataset.b === id && S.has(el.dataset.a));
      el.classList.toggle('dim', !on);
      if (el.tagName === 'path') el.classList.toggle('hot', on);
    });
    document.getElementById('fname').textContent = '🎯 ' + (G.titles[id] || '');
  }
  function clearFocus() {
    document.querySelectorAll('.dim, .lit, .hot').forEach(el => el.classList.remove('dim', 'lit', 'hot'));
    document.getElementById('fname').textContent = '';
  }
  svg.addEventListener('pointerup', e => {
    const wasMulti = multi;
    if (ptrs.size === 0) multi = false;
    if (downMoved > 6 || wasMulti) return;
    let id = hitId;
    if (!id) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('g.node') : null;
      id = g ? g.dataset.id : null;
    }
    if (id) focusNode(id); else clearFocus();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') clearFocus(); });
  fitAll();
</script>
