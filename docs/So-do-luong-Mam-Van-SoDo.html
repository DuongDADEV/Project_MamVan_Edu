  .meta { font-size:10.5px; text-anchor:middle; }
  .roottitle { font-size:21px; font-weight:800; fill:#FFF7E8; text-anchor:middle; }
  .rootsub { font-size:12.5px; fill:#FFF7E8; opacity:.85; text-anchor:middle; }
  .node { cursor:pointer; transition: opacity .25s; }
  path.edge, .rel, .rellbl { transition: opacity .25s; }
  .dim { opacity: .07 !important; }
  .rel.hot { opacity: 1 !important; stroke-width: 3.4; }
  .node.lit rect { stroke-width: 3.2; }
  #fname { font-size:12.5px; font-weight:700; color:#FFD166; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

tự chủ đề, lưu ngay", "aab228c9-9781-414d-b8f8-715cedd132f2": "Khi mở trình soạn (video/lý thuyết/quiz/bài tập) thì cây trái thu gọn thành rail chỉ còn nút mở lại — vùng soạn chiếm toàn bộ khung phải; thoát soạn thì cây trở lại (24/10). Từ 24/10, tiêu đề panel còn có 1 nút thu gọn TOÀN BỘ cây thành rail (tái dùng đúng cơ chế rail; bấm mở lại thì cây trở lại đầy đủ); trạng thái thu gọn thủ công chỉ giữ trong phiên trang, không đổi hành vi đóng/mở từng chủ đề và persist theo giáo viên", "f4cd280e-6f28-408d-bce4-554386e41c82": "Trạng thái đóng/mở từng chủ đề lưu theo giáo viên (localStorage) — rời trang rồi quay lại vẫn giữ nguyên như lúc rời đi; lần đầu/chủ đề mới mặc định mở (24/10)", "6bcf6519-ade5-446f-b9d2-b3f07030de74": "Màu chủ đề tăng đậm (24/10): nền thẻ + viền dùng độ đậm cao hơn; 2 màu nhạt nhất trong bảng chọn (Xanh tre, Hổ phách) đổi sang tông đậm hơn", "fb3643ac-6102-42ca-b37e-cc1e9958899e": "Tạo chủ đề mới xong: chỉ tự chọn chủ đề — chủ đề TRỐNG, KHÔNG còn tự sinh nháp 'Bài giảng Video mới' (bỏ từ 22/10 theo yêu cầu chủ dự án)", "5ba7e403-7743-4d58-8f3e-e3aa0bd8ddb5": "Mỗi chủ đề chứa: Video / Lý thuyết / Bài luyện tập / Bài kiểm tra / Bài tập về nhà", "28c8befb-41e3-410c-9d2d-5dd835611c26": "Bài con trong cây hiển thị HỢP NHẤT theo thứ tự luồng học của chủ đề (không nhóm theo loại nữa); cuối danh sách bài luôn có dòng '+ Tạo mới' mở menu 3 loại", "b87f477a-941b-4922-90a8-d6bff2a41db8": "BÀI TẬP & ĐÁNH GIÁ LÀ MỤC RIÊNG NGANG HÀNG CHỦ ĐỀ (nâng cấp 22/10 theo yêu cầu chủ dự án — thay form bật lên AssignmentBuilderModal đã gỡ): nút 'Thêm bài tập & đánh giá' đứng NGANG HÀNG nút 'Thêm chủ đề' ở đầu cây → bấm là tạo ngay một mục NHÁP mới trong cây (thẻ riêng màu hổ phách — cột cây TÁCH 2 TAB riêng (tab Chủ đề / tab Bài tập & đánh giá, chủ dự án không muốn 2 loại chung một danh sách), thẻ ghi 'Bản nháp/Đã giao' + số câu/số học sinh/đã nộp) → mở MÀN SOẠN BÀI KIỂM TRA (AssignmentEditor) ở khung phải: tiêu đề, hạn nộp, giới hạn thời gian, chọn lớp + từng học sinh, chọn câu hỏi từ Ngân hàng vào đề (thêm/bớt/đổi thứ tự); 'Lưu nháp' chưa cho học sinh thấy (chưa published_at), 'Giao bài' mới chốt published_at + đồng bộ assignment_targets (học sinh đã có lượt làm thì không bị gỡ); xóa mục qua dialog xác nhận, xóa sạch cả attempts/answers/reviews con; tiến độ nộp và chấm theo dõi ở mục Phân tích + hàng đợi chấm (màn 'Tiến độ bài làm' đã XÓA hẳn 24/10 — file, nav, tab và nhánh render đều gỡ). Từ 24/10, màn soạn còn cho tạo câu hỏi mới THỦ CÔNG ngay trong màn (TN 1 đáp án / TN nhiều đáp án / Điền khuyết / Tự luận) — câu mới lưu vào ngân hàng riêng của giáo viên và đưa thẳng vào đề", "0db8e99f-ebeb-485a-8238-c09ca0322ce0": "Menu tạo bài HỢP NHẤT 3 loại (Bài giảng Video / Lý thuyết / Bài tập — loại bài tập cụ thể chọn trong Cài đặt bài của QuizBuilder) ở 3 vị trí cùng một theme gọn (mỗi loại 1 dòng icon + tên; tạo thủ công bấm vào dòng, Tạo với AI bấm icon ✦ cuối dòng): 'Thêm vào chủ đề' ở trang chi tiết chủ đề, dòng '+ Tạo mới' cuối cây, nút '+ Thêm bài' cuối dải luồng. Nút '+ Tạo mới' ở góc trên trang đã BỎ (chủ dự án yêu cầu 22/10). QUY TẮC VỊ TRÍ: bài mới tạo CHÈN NGAY SAU bài đang mở (đang ở vị trí nào, bài mới nằm ngay sau vị trí đó — kể cả bài liên kết tạo từ trình soạn video/lý thuyết); không mở bài nào thì vào cuối luồng", "9868ac10-84b7-408d-8972-e8c171358e2f": "Dải luồng học (TopicFlowStrip) — từ 25/10 nằm TRÊN CÙNG khung phải, TRÊN CẢ hàng công cụ của trình soạn (theo vạch đen chủ dự án vẽ ở mép trên; 24/10 dải nằm dưới trình soạn; đổi vị trí duy nhất, mọi chức năng dải không đổi): mỗi bài là một nút tròn có icon theo loại (Video ▶ / Lý thuyết 📖 / Bài tập ✎) nối nhau bằng gạch ngang, đúng thứ tự flowOrder; bấm nút tròn → mở đúng bài đó; kéo–thả trên dải để đổi thứ tự (lưu ngay); nút '+ Thêm bài' ở cuối dải mở menu 3 loại phủ lên trên nội dung bên dưới (menu z-50 phủ lên thanh công cụ sticky z-20; không bị vùng cuộn của dải cắt mất). Dải render một lần ở shell chung (TeacherContentScreen) nên mọi trình soạn (video/lý thuyết/quiz/bài tập) đều thấy cùng vị trí. Thứ tự lưu trong video_payload.flowOrder của chủ đề (khóa 'video:<id>' / 'theory:<id>' / 'quiz:<id>'); chủ đề cũ chưa có thì suy ra tạm video → lý thuyết → bài tập", "9bddee13-197c-425d-9449-4d2d01d82e39": "Trang chi tiết chủ đề có nút 'Cập nhật lên web học sinh' — XUẤT BẢN CHỦ ĐỀ qua PublishModal dùng chung (bổ sung 22/10; trước đó THIẾU HẲN nên chủ đề mới tạo kẹt ở Bản nháp và học sinh không bao giờ thấy; xuất bản Video/Lý thuyết con vẫn tự xuất bản chủ đề cha như cũ)", "c6d6307c-a62d-4069-b526-7920e5948fca": "Lớp lưu trữ siết chặt (sửa 22/10): tạo Video/Lý thuyết/Bài tập mà đẩy lên Supabase thất bại thì thử lại 1 lần rồi BÁO LỖI rõ ràng (pushOrThrow) — hết cảnh nuốt lỗi khiến bài tạo xong 'tự biến mất' (sự cố video trong chủ đề mới khi kiểm chứng luồng học). Vận hành: app tự đồng bộ bộ đệm trình duyệt lên máy chủ nên TUYỆT ĐỐI không xóa dữ liệu nội dung thẳng trong DB — bản đệm của trình duyệt sẽ đẩy hồi sinh; luôn xóa qua giao diện", "5b67cd10-4117-4a42-800c-abae869452a5": "Trình soạn Video", "1a23d0f9-cdc5-46e9-8c11-3e5581672f23": "Nguồn video: tải lên / liên kết; thời lượng", "28fcd289-3f97-4621-9b56-4b2db1ccc30b": "Đã bỏ hẳn ảnh bìa thumbnail (24/10): không còn ô tải lên/dán link ảnh trong trình soạn, xem trước không còn poster, danh sách không còn đọc thumbnailUrl; dữ liệu cũ trong DB giữ nguyên, không xóa", "79b1a0d5-beda-4443-82e1-23b75dfc1379": "Các ý trọng tâm (điểm tóm tắt) + tiểu mục", "903f35c4-d41e-440c-98d8-262603c0e9e7": "Gắn 3 bài liên kết: Luyện tập / Kiểm tra nhanh / Mastery Check — tạo mới ngay trong trình soạn, ID được ghi ngược vào bài gốc", "0c903a28-8a9e-4ef1-9e43-e72dd5ab82f5": "Quay lại về trang chủ đề · Xem trước · Lưu nháp · Cập nhật lên web (xuất bản)", "143ff411-ca98-4822-9f05-a0daf6b0ec8e": "Trình soạn Lý thuyết", "cd84c143-1bc6-4a8a-ae59-7c51502cbeb4": "Soạn theo khối nội dung (tiêu đề / đoạn văn…); thời gian đọc tối thiểu (giây)", "708e2aee-dee3-4cfa-9d88-ae1fb0e08368": "Gắn bài Luyện tập + bài g đáp án đúng — nhận cả 2 dạng lưu (chữ cái & toàn văn)", "20e3f80d-4375-453b-86c9-e03119445dde": "Đáp án điền khuyết được chuẩn hóa về dạng danh sách (gốc của lỗi không nộp được bài — đã vá)", "17b849c1-16a0-420e-958f-5a91e1cbfe1c": "Bộ lọc dạng DANH SÁCH 3 nhóm, gập/mở được, tiêu đề hiện lựa chọn đang áp dụng", "e4ddc4d1-df85-4a93-9087-618ec09de641": "1) Dạng học liệu", "0b0ce3bb-2965-4de8-b84e-0ec0d28132cb": "2) Năng lực: Nhận biết / Thông hiểu / Phân tích / Vận dụng", "4a45a635-5ce3-49d9-b58a-63d05d235d78": "3) Độ khó: Dễ / Trung bình / Khó", "d1eb0f9e-52b8-47a9-a518-afe56cd59cb6": "Thêm câu hỏi thủ công; xóa câu hỏi bằng hộp thoại xác nhận của app", "89770562-fc03-414d-8a4c-b1ba19eb3f8d": "Tab Bản nháp (huy hiệu đếm số chờ duyệt)", "3881f72a-6b57-4c8e-9593-86b8452f95ca": "Bộ câu hỏi & lý thuyết do AI tạo mà chưa duyệt đều nằm ở đây", "ceff5cf9-6960-442f-b31b-b2777e68b80a": "Mở xem từng câu → tích chọn câu đạt → 'Đưa vào Ngân hàng'; câu chưa chọn ở lại nháp; CHUYỂN HẲN (24/10): câu đã đẩy bị xóa khỏi nháp, hết nháp thì xóa luôn khóa nháp", "8e267711-0a3b-4b70-ad47-da82669d634b": "Nháp LÝ THUYẾT — nút 'Đưa vào học liệu' (24/10, chỉ người tạo được đẩy, theo đúng mẫu luồng câu hỏi): lý thuyết thành bài lý thuyết trong cây nội dung của chủ đề đó (lý thuyết là học liệu, KHÔNG vào ngân hàng câu hỏi); đẩy xong XÓA nháp. Đường duyệt từ Studio cũng xóa khóa nháp tường minh khi áp dụng (hết rớt nháp do hiệu ứng tự lưu chạy không kịp)", "61b653cc-e517-46f7-b758-5027c8934083": "Ngân hàng riêng từng giáo viên (24/10): nháp do AI tạo được đóng dấu người tạo — chỉ chính giáo viên tạo ra nháp mới thấy và mới được chuyển; nháp cũ chưa đóng dấu vẫn hiện cho người dùng trình duyệt đó (tương thích ngược); ngân hàng câu hỏi đã tách theo giáo viên ở tầng kho (chỉ lấy câu của chủ sở hữu theo phiên)", "1a1ca77e-da06-44f3-95c6-baf89822a84e": "Xóa nháp có hỏi xác nhận", "60e8cfaf-3611-4a8a-a1ab-cf254d6e65e5": "Nguyên tắc xuyên suốt: chưa duyệt thì chưa vào Ngân hàng", "63ee62c0-03f4-4a30-99b1-fad0adf588ce": "1.5 Mầm AI Studio", "1d65c96b-691c-4c71-8616-4bb9b8b1d42d": "3 panel kéo chỉnh độ rộng / thu thành thanh dọc 46px (lưu theo máy)", "30e69419-5921-496f-a502-1499681b3937": "Panel 1: Nguồn tài liệu", "0117d57a-725f-409d-9b6d-2ef830a19732": "Panel 2: Trò chuyện & tra cứu tài liệu", "e758c5e7-bcb6-4946-b02e-99332f5061b3": "Panel 3: Xưởng tạo đầu ra", "a43fb4db-eb03-4ea5-8ae6-5c7ba74116e4": "Trợ lý trò chuyện 'Tôi là trợ lý Mầm AI' — tra cứu trên tài liệu đã nạp (RAG)", "d3e6f5c3-4b8c-4793-934c-068b8dc09cd4": "Tạo đầu ra theo CƠ CẤU LOẠI CÂU: 4 dòng số lượng (Chọn 1 / Chọn nhiều / Điền khuyết / Tự luận), nút −/+ từng loại, tổng tự cộng, khóa nút tạo khi tổng = 0", "0c4cbbac-d5c3-4381-9407-50a7860aaee3": "Cơ cấu loại câu truyền thẳng vào prompt Gemini — loại để 0 thì không sinh câu loại đó", "cc7afd11-cf5c-4a5d-9c40-c07354c32635": "Sinh bằng Gemini (model AI-2.5-flash); khi Gemini lỗi → bản dự phòng MockAI và BÁO RÕ '(Bản dự phòng — Gemini lỗi)', không giả danh AI thật", "cd726ffe-0ea2-42e8-a5c0-8ce82a64cd28": "Bộ câu hỏi AI → BẢN NHÁP BỀN: tự lưu (đóng xưởng / chuyển màn / tải lại trang vẫn còn); thanh BẢN NHÁP báo số câu + giờ lưu", "5acf5281-f154-40f2-a882-4772ab3660a8": "Duyệt → Lưu vào Ngân hàng: chỉ lưu câu đã tích chọn; tiêu đề 'Bộ câu hỏi: <chủ đề>', thời lượng = max(7 phút, số câu), XP = số câu × 5", "bfa5b4d6-c0ed-41d0-8c87-884553c18650": "Lý thuyết AI → màn DUYỆT LÝ THUYẾT xem trước đúng dạng học sinh sẽ đọc → ưng ý mới 'Lưu lý thuyết vào học liệu'; nháp lý thuyết cũng tự lưu bền", "3aef7aff-4399-4e20-b1b8-f9e09fc12dbf": "1.6 Chấm bài", "ce504e7d-bf84-4650-b9d4-07c2f2b7da10": "Hàng đợi GOM THEO HỌC SINH — mỗi em đúng 1 dòng (khử trùng bài theo nội dung + quy về đúng 1 học sinh thật dù lệch định danh giữa các nguồn)", "49a03cf5-ad61-4940-86bc-0baca87cee81": "Bảng 6 cột theo mẫu: Học sinh | Lớp | Chủ đề đã làm (x/y) | Bài chờ chấm (0 thì làm mờ) | Chờ lâu nhất (đỏ + '(quá hẹn)' khi quá 24 giờ) | Xem chi tiết", "ffbd49e9-9c66-4257-9b74-71ba513f4909": "2 thẻ thống kê: 'Cần chấm' (chờ chấm + đã có gợi ý AI, có nút lọc riêng gợi ý AI) · 'Chờ > 24 giờ' (bấm → sắp xếp chờ lâu nhất lên đầu)", "75ebc162-b9cb-405f-bc99-1be970a2cd06": "Bộ lọc gộp 1 ô duy nhất: Trạng thái / Sắp xếp", "0dacc828-95e5-4f77-a469-01ccc947bd01": "'Chấm ngay' mở thẳng bài chờ lâu nhất chưa chấm của em", "f72ca9b1-f004-45a5-acac-5d34f7f6b98c": "Hàng đợi GỘP CẢ PHIẾU CHẤM TỪ LUỒNG BÀI TẬP/HOẠT ĐỘNG (22/10): câu tự luận nộp qua bài được giao/luồng học tạo phiếu chờ ở bảng phiếu chấm (answer_reviews, nhánh tiến độ) — nay hiện CHUNG trong hàng đợi này cạnh bài nộp tự luận thường (đúng học sinh/lớp/đề thật/nguồn bài); chốt điểm tại đây ghi ngược về đúng phiếu + câu trả lời + tổng điểm lượt làm, quy đổi thang 10 của hàng đợi ↔ điểm tối đa riêng của câu (2/3/4đ); số chờ chấm khớp vì cùng một nguồn (màn 'Tiến độ bài làm' đã XÓA hẳn 24/10, không còn màn riêng); nháp chấm của phiếu lưu bền trên máy", "640328f3-9962-4d61-967b-121d7ad9f61f": "Xem chi tiết theo học sinh", "d4f92dac-0ed7-436f-839a-33df9142fa84": "Thẻ 'Họ tên · Lớp' + thanh tổng kết: x/y bài kiểm tra đã làm, số bài chờ chấm, số bài quá hạn, ĐTB, công tắc 'Chỉ hiện bài chưa chấm'", "1708b5d0-ba2e-4348-a2e3-92ec86491fcc": "Bài gom theo CHỦ ĐỀ: dòng nhóm '… – bài chờ chấm: N' / '… – (Hoàn thành)'", "f9182f36-0538-46f1-b58a-4ac938b72e5a": "Cột Điểm hiện 'Gợi ý Xđ' cho bài AI đã gợi ý", "1e6353a5-c80f-44ca-aee7-510273fafd07": "Màn chấm bài (SplitGradingWorkspace)", "318d4f65-caa8-4aa2-83aa-6cb434c398b5": "Nội dung bài tự luận + thông tin bài / năng lực / chủ đề", "9effa567-937e-4634-a62c-6e99042323be": "'Gợi ý chấm tự động bởi AI': điểm gợi ý làm tròn 1 chữ số thập phân; chưa có gợi ý thì không bịa số", "551d8907-2be1-43ec-ae41-e019b4e44f07": "'Tiêu chí đánh giá & Chấm điểm': chấm theo Rubric từng tiêu chí; gõ số thập phân / xóa trắng bình thường; Rubric không lưu khi tổng trọng số ≠ 100", "0b57827f-7172-4213-be0d-a938354b2d2a": "Câu nhận xét mẫu nhanh — bấm để chèn", "f5e44f8b-114f-42a1-af9b-3110a6318732": "Chốt điểm → ghi đúng chủ đề / năng lực + nhật ký kiểm toán + thông báo cho học sinh (ở cả 2 kho dữ liệu)", "6ed110b1-a6a8-46f5-b8b1-3c854860da44": "Huấn luyện AI (AiTrainingStudio): rubric + bài mẫu chấm để AI học cách gợi ý điểm", "31c6eef9-0102-4cc0-9cc3-4daef1d5502e": "Bài tự luận không bao giờ bị gán nhầm cho 'học sinh đầu tiên' khi không tra được chủ nhân", "da72d848-4e37-420e-a2bb-0003ab2e25dd": "1.7 Quà tặng", "d259ea02-1831-4b70-9bab-c5bbf69fa072": "Hàng đợi yêu cầu đổi quà — số liệu thật (XP tuần / điểm danh / tên lớp tính từ state thật)", "e6e912fe-b98e-4f8c-a09a-3b6e74d6f961": "Duyệt / Từ chối / Trao / Mở — trạng thái GIVEN/OPENED không bị ghi nhầm thành REJECTED (migration_003)", "67dd8fcc-936c-4ea4-8d1c-ce6eb81a7f1f": "Từ chối → HOÀN đầy đủ XP đã trừ vào TỔNG XP của học sinh (kể cả từ chối hàng loạt)", "487aeaf8-7984-4fd9-9985-bde45bc1db03": "Duyệt / trao hàng loạt chỉ tính yêu cầu hợp lệ", "e81d8a57-6833-4048-9607-cb8d01d97b54": "Xuất CSV theo đúng bộ lọc đang xem", "195ad0f1-ef3f-4cb0-b382-9f0bd12f37ac": "Danh mục HỢP NHẤT (24/10, hướng c): mốc mặc định (REWARDS_CATALOG, chỉ xem — không sửa/xóa) + mốc GV tự tạo trong kho (thêm/sửa/xóa được); học sinh thấy hợp nhất của GV phụ trách lớp mình", "a91268db-4dfb-45a6-b2d1-699bdbb9b37d": "Mốc GV gắn teacherId khi lưu; mốc cũ chưa gắn dấu hiện cho GV đó (tương thích ngược); học sinh không bao giờ thấy mốc của GV khác; khử trùng theo id (mốc kho thắng khi trùng id)", "8fa696fe-9236-49c9-9835-ffee6d635ed0": "Mốc GV lưu trên Supabase (25/10, migration_012, bảng reward_tiers): trước đó mốc chỉ nằm trong localStorage của trình duyệt tạo nó nên học sinh máy khác không thấy; nay SupabaseRewardRepository đọc/ghi bảng thật, học sinh mọi máy đều thấy mốc của GV phụ trách lớp mình; bảng chưa tồn tại (SQL chưa chạy) hoặc lỗi đọc-ghi thì code fallback về mốc local cũ, app không vỡ; mốc local cũ KHÔNG tự bay sang Supabase — GV tạo lại 1 lần sau khi chạy SQL; RLS allow_all theo mẫu 002/005 (cần vòng khóa thật sau)", "a5b5342d-1697-4c1c-ab9e-3162ad43b8cc": "1.8 Phân tích", "6ab56912-ae5c-4b4c-b0d5-1209bcbd08d2": "metricsEngine: computeOverviewMetrics / detectStudentsNeedingAttention / generatePedagogicalInsights", "147b5f73-0ba7-484f-b799-a5480b0fca15": "Phổ điểm (Histogram): tính theo TỪNG HỌC SINH — điểm TB của mỗi em xếp vào đúng 1 dải; tổng các cột luôn khớp sĩ số thật (đã sửa lỗi đếm theo câu hỏi)", "404992ac-dec9-4414-b002-72fc0cad55b3": "Bản đồ nhiệt năng lực (masteryAnalytics) · Tương tác & chuyên cần (engagementAnalytics) · Phân tích câu hỏi (questionAnalytics) · Hồ sơ học sinh (studentProfileAnalytics)", "fbccae3e-eb4d-4176-a696-51b1119fa770": "Tên lớp tra theo danh sách thật ở cả 3 nơi — không in UUID, không bịa tên lớp", "0d42c594-77c1-4f81-945d-5897fb701460": "Toàn bộ biểu đồ tính từ dữ liệu thật (điểm danh, nhật ký XP, kết quả câu hỏi, bước đã học); tuần không có điểm thì để trống — hết số bịa (13/18, 7.5đ, 82%, chuỗi 78→91%…)", "6f86c1ee-02aa-4227-82a6-3810c8d0642f": "TRỢ LÝ PHÂN TÍCH AI (22/10, giai đoạn 1 — tab đầu tiên của Phân tích): giáo viên hỏi bằng lời thường; Gemini chọn 1 trong 6 công cụ truy vấn (tổng quan lớp / so sánh chủ đề / phổ điểm / phân tích câu hỏi / hồ sơ học sinh / hoạt động học tập), hệ thống chạy ĐÚNG các hàm tính của các tab cố định trên dữ liệu thật rồi AI mới diễn đạt + đề xuất bước tiếp theo + gợi ý câu hỏi nối tiếp; quy tắc cứng: số do code tính (AI không tự sinh số), mẫu quá ít thì nói rõ 'chưa đủ dữ liệu' thay vì kết luận; từ 24/10 cô giao toàn quyền admin: trợ lý không từ chối vì lý do quyền hạn khi yêu cầu nằm trong dữ liệu của giáo viên — việc có công cụ thì làm thẳng, việc chưa có công cụ ghi thì chuẩn bị sẵn để giáo viên bấm một lần là xong; phân tách theo giáo viên vẫn giữ (công cụ chỉ thấy dữ liệu của giáo viên đó); biểu đồ do AI khai báo loại/trục qua công cụ riêng nhưng số liệu lấy nguyên văn từ kết quả công cụ; chưa nhập khóa Gemini (ở Cài đặt) thì hiện hướng dẫn — không trả lời bịa; KÈM BONG BÓNG CHAT NỔI ở góc phải dưới cổng giáo viên: mở trợ lý ngay từ mọi màn hình, dùng chung bộ lọc của trang Phân tích, đóng/mở không mất hội thoại. LỊCH SỬ CHAT LÀ MỘT KHO DÙNG CHUNG (assistantChatStore): tab và bong bóng cùng một cuộc trò chuyện, lưu bền trong trình duyệt (tối đa 80 tin), có nút xóa lịch sử ở ô nhập. ĐỢT 2 (24/10): phổ điểm kèm TÊN học sinh từng khoảng (tên + điểm TB — hỏi 'điểm khá là những ai' trả tên thật, không xin lỗi vì công cụ/quyền); trợ lý có 9 công cụ đọc + 17 công cụ ghi qua ĐÚNG service UI dùng (tạo chủ đề/video/lý thuyết/quiz/câu hỏi/bài tập BI, xuất bản/gỡ xuất bản, sửa bài tập BI, chấm tự luận + phiếu chờ duyệt BI, duyệt/từ chối yêu cầu quà, xóa học liệu/bài kiểm tra/câu hỏi — mọi công cụ đối chiếu tên/id với dữ liệu của chính giáo viên, ngoài phạm vi thì báo lỗi rõ ràng, không bịa id); thông báo cho lớp qua cờ notifyStudent của luồng xuất bản (không có API thông báo độc lập). Giới hạn còn lại: quản trị giáo viên khác, cài đặt hệ thống, thông báo độc lập ngoài luồng xuất bản, sửa/xóa tài khoản học sinh. ĐỢT 3 (25/10): câu hỏi ĐẾM theo trạng thái (vd 'lớp 7A4 có bao nhiêu học sinh chưa có điểm') được trả lời TRỰC TIẾP — get_score_distribution nay trả thêm tổng số học sinh + số học sinh chưa có điểm + tên (học sinh trong phạm vi lọc mà không nằm trong khoảng điểm nào); series biểu đồ của công cụ này kèm thêm hàng 'Chưa có điểm' để vẽ breakdown đã có điểm vs chưa có điểm. Cổng vẽ biểu đồ mở rộng: trước đây chỉ vẽ khi câu trả lời xoay quanh so sánh/phân bố/xu hướng, nay vẽ cho MỌI breakdown theo nhóm có dữ liệu (kể cả đếm theo trạng thái). Cấm kiểu từ chối 'Em xin lỗi, em không thể...' với yêu cầu nằm trong phạm vi công cụ (dữ liệu lớp mình, đếm/liệt kê/tên, vẽ biểu đồ từ dữ liệu có được, việc ghi đã có công cụ) — phải làm luôn (trả lời + vẽ nếu được yêu cầu); chỉ từ chối ngắn gọn khi thực sự ngoài phạm vi, kèm việc thay thế làm được ngay. Ranh giới phạm vi KHÔNG ĐỔI (chỉ dữ liệu giáo viên đó, không mở sang giáo viên khác hay quản trị hệ thống)", "9bffcbb6-9777-4591-9846-a3457790815c": "Đã nối lại dây ngân hàng câu hỏi vào Phân tích (22/10): cổng giáo viên nay nạp và truyền ngân hàng câu hỏi thật xuống màn Phân tích — trước đó tab Phân tích câu hỏi và tra cứu trong Hồ sơ học sinh luôn nhận ngân hàng rỗng nên hiện 0 dù kho có 27 câu", "9a52afe8-be97-4232-baec-68150ecc23b4": "1.9 Cài đặt", "65b9b867-acc7-4882-82bb-4cfc0b39ce0a": "Nhãn trạng thái AI: 'AI Đang Hoạt Động' (bỏ chữ 'Thật' từ 24/10)", "e3b5029f-9855-4806-93ea-b3c4e3423283": "Cấu hình ngưỡng XP — kiểm tra thứ tự ngưỡng, chặn giá trị 0 / trống trước khi lưu", "ce64898a-fa35-467d-8d4c-f4faf3517186": "Mô hình Mầm AI: chọn model Gemini; cảnh báo API Key đang lưu trong trình duyệt", "303a2732-cab7-4868-ab6f-9d718d102169": "Đổi mật khẩu: kiểm tra mật khẩu hiện tại + lưu thật", "e3324e66-8c54-4113-970c-63bd031e5dba": "Cỡ chữ hiển thị (Chuẩn / Lớn 112% / Rất lớn 125%) — phóng toàn cục theo đúng tỉ lệ", "f83f5cd8-2c5a-4446-bb02-57d26be3d825": "Đã gỡ khu vực 'Đặt lại dữ liệu demo' khỏi bản khách thật", "147ea571-e21f-4f84-8ae2-75d2767b0c31": "2. HỌC SINH", "d2ea7df1-231a-4c74-bb79-1866590c6264": "2.1 Trang chủ", "3d57b75e-bafc-4da7-8a34-a9e3c55613a1": "Lời chào theo hồ sơ thật (đúng tên, đúng lớp) — học sinh mới bắt đầu TRẮNG, không thừa hưởng tiến độ mẫu", "a9d4727a-6207-4815-8195-3ce937702575": "Chủ đề học kỳ này: thẻ cao đều nhau, chân thẻ ghim đáy ('X bài giảng · Vào học'); từ 24/10 chỉ hiện tối đa 4 thẻ, xem toàn bộ bằng nút 'Tất cả bài học' sang mục Học bài", "9c10641f-16ca-4d4d-933e-9bf6655ce321": "Thẻ 'Nhiệm vụ tuần' (từ 25/10 trở về như trước đợt 2, theo quyết định chủ dự án): CHỈ liệt kê BTVN quiz, KHÔNG gộp bài BI; học sinh có bài BI được giao vẫn thấy thẻ này trống (đã chấp nhận) — danh sách đầy đủ ở mục Bài tập; mỗi dòng có tiêu đề/số câu/hạn nộp/trạng thái + nút Làm bài/Làm lại; tối đa 4 bài, nhiều hơn thì 'Xem tất cả' sang mục Bài tập", "ded72cac-2488-4855-8e31-4c26131fcae3": "Điểm danh mỗi ngày (nhận XP theo mức giáo viên cấu hình)", "8a8a286c-1d39-42a8-9590-22cfb81128be": "Biểu ngữ bài mới nhất chưa đọc + nút 'Vào làm ngay'", "fd7689c9-ed3e-4407-87ec-8f068967c94b": "Gợi ý bài học tiếp theo", "736eb619-0ac8-45d1-9341-57bbd45fb372": "Tiến độ năng lượng học tập hôm nay (phút học tích cực / XP hôm nay — không còn trần)", "9fe5ab99-e50e-4964-9ee0-8b86806edcf0": "Khu Bài tập về nhà – Bài kiểm tra – Bài luyện tập", "866bbeda-aa4e-4e31-851e-4839d21914b5": "Đã gỡ khỏi trang chủ (25/10, sửa hiểu sai vòng 3): mục 'Bài tập được giao' (bài tập độc lập, AssignedHomeworkSection) không còn ở Home; các bài đó chỉ còn ở mục Bài tập (tab Về nhà) — bấm vào mở MÀN LÀM BÀI thật: trả lời từng câu (trắc nghiệm chọn ký tự A–D, điền khuyết, tự luận), đồng hồ đếm ngược và tự nộp khi hết giờ nếu bài có giới hạn; nộp bài ghi attempts + attempt_answers, thấy ngay điểm phần tự chấm, câu tự luận báo 'chờ giáo viên chấm'", "e696ea6b-7970-480f-980d-e1f4e343a76d": "Cần ôn lại (các chủ đề yếu)", "aaf14980-075f-4f94-ba15-3aa2a8fb1757": "Rương quà bí mật (gợi mở sang mục Đổi quà; mốc gần đạt nhất tính theo danh mục hợp nhất từ 24/10)", "0360f136-ff77-4474-971e-f735c92d53e2": "Xem trước Cây tri thức", "6e3aec08-a2d8-4776-ad38-e3b010ed8025": "2.2 Học bài", "88396d7a-d803-4a48-89db-b6ce27422268": "Danh sách chủ đề → bấm nút 'Học bài' trên từng thẻ chủ đề để mở danh sách luồng học", "cfebd3e0-0f4b-4b97-8c40-931c3bcdb8fd": "Nút 'Học bài' thay thế 3 nút cũ (Luồng học / Xem video / Lý thuyết chung) từ 24/10: bấm thì mở danh sách các bài trong chủ đề theo ĐÚNG thứ tự cô đã đẩy (số thứ tự + icon loại + tiêu đề), bấm vào mở đúng bài — kể cả Bài tập; chỉ mục cô đã đẩy mới hiện, nháp không hiện; điều hướng từ Trang chủ/Cây/Kết quả tới chủ đề thì tự mở sẵn danh sách Học bài của chủ đề đó", "902869c7-19db-4888-9c14-5c57253aed21": "Học dở được khôi phục đúng bước đang học (khóa bước ổn định — không bắt đầu lại từ bước 0)", "98e3ea2f-2d3f-4536-b6bd-7c3d132a2eca": "2.3 Luồng Video — tổng 48 XP", "cae3e7a5-5e7e-488a-ac89-08507c52c75e": "Bước 1: Xem video đạt 80% → +5 XP nhận xét tự luận), không ghi thêm kết quả, không cộng XP; BTVN làm lại không giới hạn", "7c72872b-50f8-490b-b858-b5b61d08ed7a": "Câu tự luận → tạo bài nộp mang đúng mã học sinh → vào hàng đợi chấm của giáo viên", "69c228b7-0dec-4b14-b621-9a9908e74d39": "Bài tập về nhà / bài trong chủ đề hoàn thành → nhận XP theo đúng số XP giáo viên cấu hình trên bài (mô hình XP mới 22/10; nộp bài được giao độc lập cũng vậy)", "c7774102-0d25-4e53-bbea-3feb9f705d25": "Ôn lại phần yếu: chỉ ghi nhận tiến độ, không cộng XP lẻ (mô hình XP mới 22/10 — XP chỉ từ điểm danh, quỹ chủ đề và bài kiểm tra)", "269bd120-70a5-46c4-8f08-823f22e3f64f": "2.6 Cây tri thức — Vườn Văn Mầm Mục", "bd32d05b-8f90-401d-8b5a-a5ec91b7fea6": "6 giai đoạn theo số bước học đã hoàn thành", "f7b5399c-2142-432c-b287-fbf4ed2a30cd": "Hạt mầm (0 bước)", "0c3ad0b5-e514-4af6-bc14-3736fe62c84d": "Nảy mầm (3 bước)", "618658d8-8086-4f8a-b6c1-47fdda8b6105": "Chồi non (8 bước)", "00f4aa2b-bef5-4029-81f2-ad84008fc449": "Cây con (18 bước)", "f6166dfe-526a-4c00-a9c9-d515bcf722c2": "Cây ra hoa (32 bước)", "a1e43a7f-54b8-4759-9ce6-00197d45a759": "Cây kết trái (50 bước)", "b3b1e5ed-3ecb-4eb8-b561-91471f68caa6": "Tưới nước: mỗi bước học tạo 'Nước tưới Mầm Mực' nuôi cây lớn", "f7a92e12-01a9-4520-b74a-aeaf067ca319": "15 vị trí lá trên tán cây", "f84e68c6-000a-43fc-b78c-b0143e8c019d": "4 lá chính đầu tiên = 4 chủ đề đầu trong thứ tự khóa học (lá to, có nhãn tên)", "80f10c99-a5d5-4c1c-aa5e-1d5bf882901b": "Từ chủ đề thứ 5: hiện ở 11 'lá ẩn' còn lại (lá nhỏ hơn, rê chuột xem tên + %)", "e8123d20-723d-4528-bc28-23496f0e3718": "Màu lá: Hoàn thành ≥80% = xanh lá đậm · Đang học 50–79% = xanh biển · Cần ôn lại <50% = vàng · Chưa học = xám (có hàng chú thích)", "db5f126c-1a69-417f-aa8b-0f95e116b5cb": "Hiệu ứng NHẤP lá đã hoàn thành: lá lún xuống như bị ấn vào tán cây + vòng sáng lan tỏa", "4c03bf55-a619-4190-a72d-1627040b33ea": "Ma trận năng lực: từng chủ đề × 4 năng lực", "b743364d-a45a-4ed9-bacc-a7bf90acae41": "Huy hiệu đạt được", "987aaed6-5351-4791-9a35-87ff68d78615": "2.7 Kết quả học tập", "d52e5b4b-ee8e-4f46-a82b-88c7177972ec": "Thẻ tổng quan: Tổng XP tích lũy (+ XP hôm nay) · Huy hiệu đạt được — đã bỏ 2 thẻ 'Câu hỏi đã làm' & 'Điểm trung bình'", "1f0bf8d1-6a25-4ff4-b2b7-2871ce97572e": "Điểm theo từng chủ đề", "62b95565-8b20-4507-864a-445d548035ee": "Trắc nghiệm (đúng/tổng câu, điểm TB) + Tự luận (thang 10, đạt/chưa đạt với ngưỡng 5, đã chấm/chưa chấm) + lịch sử lần làm + nút 'Xem chi tiết' → popup toàn bộ bài đã làm (trắc nghiệm → tự luận) kèm nhận xét của cô ngay dưới bài làm; tự luận chưa chấm ghi rõ 'cô giáo chưa chấm'. 4 mức năng lực BỎ ở phía học sinh từ 24/10 (vẫn giữ phía giáo viên + AI)", "0ec543be-6ef7-4cac-9fa0-cf80d12ce369": "Khối chủ đề nhuộm nền + viền theo đúng màu của chủ đề đó (tăng đậm từ 24/10)", "d635488e-391a-4c51-b2cb-2e4091c25dc2": "Bấm tên chủ đề → tới bài học", "4a5dea09-0e1c-49e5-8924-3b7bc63897d4": "Dùng chung hàm calculateAllMastery với Cây tri thức — từ 24/10 chỉ còn dùng cho chip trạng thái tổng quát (Đã hoàn thành / Đang học / Cần ôn lại / Chưa học), hàm KHÔNG bị sửa", "0df64baf-7b38-42dd-aedc-9c8fa92b2b86": "Điểm theo từng bài kiểm tra (bài tập BI cô giao): điểm cao nhất, trạng thái chấm, số lần nộp + popup chi tiết (đáp án + nhận xét của cô theo từng lần nộp); bài kiểm tra nội dung xem lại ở mục Bài tập", "fa831d68-aa26-4411-8c6b-9f5c5f73f5ab": "Biểu đồ tiến bộ 6 tuần — dạng ĐƯỜNG MỐC TUẦN", "dbd7accc-9d95-43a1-b97e-59cfa7987047": "Mỗi mốc là vòng tròn chứa điểm trung bình của tuần; tuần này to nhất, viền cam nổi bật", "395e207e-ef27-4485-a8f6-6c96fe6a9fb4": "Tuần chưa học hiện mốc xám 'Chưa học' thay vì biến mất", "f9eff8d8-efb9-4949-b9c8-f2ad3a3698cf": "Nhãn tuần dễ hiểu ('Tuần trước', '2 tuần trước'…) + số câu đã làm dưới mỗi mốc", "4ebb54c2-6713-4575-851a-79c249163d7b": "Góc phải thẻ: tổng số câu + điểm tuần này", "df3a6346-2cdd-4997-827b-2ab0c35dc0ff": "Thành tích & huy hiệu: toàn bộ danh mục, phân biệt đã đạt / chưa đạt", "03980028-47b5-424f-b629-b665c2921410": "2.8 Đổi quà", "168a9597-7db8-469b-a123-a581677e5fb2": "Ví chi tiêu = TỔNG XP của tài khoản (vĩnh viễn — chỉ giảm khi xin quà); MỐC MỞ RƯƠNG xét theo XP TUẦN + số ngày điểm danh (quyết định chốt của chủ dự án)", "f0d7f721-f698-4b59-a575-bc8b6cfeab47": "Các rương theo cấu hình: Rương Hạt / Rương Lá / Rương Hoa / Rương Vàng", "72fdff75-34a8-41ec-b8d9-9f550e3af3b1": "Danh mục quà thật (XP / ngày điểm danh yêu cầu)", "9814a322-f7ea-4f91-a035-8f704ecf31f2": "Bookmark Mầm Mực thủ công — 280 XP · 4 ngày", "642d5815-3de0-48eb-939f-1764b6f6c944": "Quyền chọn bài đọc cho cả lớp — 320 XP · 4 ngày", "3a465d97-5de3-4ec4-bb33-e6fb4913080b": "Bút mực xanh Giấy & Mực — 450 XP · 5 ngày", "5d6e3459-d085-42aa-a667-b8f740618e88": "Sổ tay Giấy & Mực bìa cứng — 650 XP · 5 ngày", "e2b09ed9-161d-40e1-8e41-6527e225ad2b": "Rương Vàng: Bút mài nét hoa & Bộ quà lưu niệm Mầm Văn — 750 XP · 6 ngày", "4d564b83-1935-4b24-85c3-535d5bcbba24": "Danh mục hợp nhất (24/10, hướng c): 5 mốc mặc định + mốc GV phụ trách lớp mình tự tạo; giá XP theo danh mục hợp nhất; mốc gần đạt nhất ở Trang chủ cũng tính theo danh mục hợp nhất", "3993f854-5125-44d4-be29-65a89c62e360": "Nội dung quà thuộc loại 'secret' — học sinh không được biết trước bên trong có gì", "cfcf6c7f-c6ce-4b57-ba73-764bba663d34": "Gửi yêu cầu: TRỪ NGAY vào Tổng XP (ghi deductedXp); chặn khi Tổng XP không đủ; chặn gửi trùng khi đang có yêu cầu chưa bị từ chối", "2bdfc952-3c43-4dc9-aced-dd4a79fe5943": "Trạng thái: Chờ duyệt → Được duyệt → Đã trao → Đã mở", "795a6faa-ef20-4a54-b8ff-b1e704160255": "Bị từ chối → HOÀN 100% XP đã trừ vào Tổng XP", "3e518362-85a2-4dd4-90c7-23a34c4fe38b": "2.9 Hồ sơ", "a07d66d0-600a-4fdd-afd9-1c751e1d8a7c": "Thông tin tài khoản học sinh", "cd7a38ad-4e63-4d2f-b666-cabd7f13ff0b": "Thẻ dưới chân thanh điều hướng: TỔNG XP tích lũy là số chính, XP hôm nay ở dòng nhỏ bên dưới", "ce463fb2-1dc3-45b5-b6c2-5fa8b258ed2b": "Sidebar desktop (24/10): vùng nav cuộn nội bộ, khối cuối (thẻ XP + chip avatar/họ tên/lớp) luôn ghim trong khung nhìn — hết mất họ tên ở khung desktop; logo 'Mầm Văn' chống ngắt từ", "89589631-fb8a-42f7-bcf2-95401954a7dc": "Cỡ chữ hiển thị (phóng toàn cục 112% / 125%)", "e9f47a79-6227-4e46-b696-4b4cefcf9d93": "Đăng xuất — xóa sạch phiên, kể cả phiên đang đóng vai", "d2f3ff24-6f57-4181-a428-1709d435df53": "2.10 Thông báo bài mới", "2a806708-9e0e-4b36-b227-2af48ff9e808": "Chuông thông báo trên thanh điều hướng (máy tính + điện thoại) + huy hiệu đỏ đếm số chưa đọc", "047d88ea-df81-4757-9d96-cbbc393d9974": "Danh sách kiểu tin nhắn: loại bài + tiêu đề + chủ đề + thời gian; bấm vào là vào làm bài đó ngay", "274fd9bb-fc71-4b0f-abba-18051f7c59a1": "Thông báo suy ra từ mốc xuất bản thật của nội dung: trong vòng 14 ngày, đúng lớp được giao", "959841a9-8b29-4137-8f20-06c44d2ec6ac": "Trạng thái đã đọc lưu THEO TÀI KHOẢN → đồng bộ mọi thiết bị (thay cơ chế cũ chỉ lưu trên máy giáo viên)", "d264d50d-7fca-4973-b069-71b32a0833ec": "2.11 Bài tập (mục mới 24/10, nằm ngay dưới mục Học bài ở thanh điều hướng)", "8a64e755-6e70-486d-be22-2c29510dcf12": "2 tab: 'Kiểm tra' / 'Về nhà', sắp xếp theo hạn nộp (không hạn thì xếp cuối)", "92080f8b-f45a-4efe-a0eb-6e81421c63fc": "Tab Kiểm tra: quiz nội dung loại quick/mastery/final; tab Về nhà: quiz homework + bài tập BI cô giao (display_location luôn là HOMEWORK)", "629052f9-a4d4-4e0c-9795-a34a55e41700": "Bấm bài chưa làm → mở làm bài; bấm bài kiểm tra đã làm → màn xem lại, không tính điểm mới (xem 2.5)", "f4b4306b-f527-4696-b17f-bc4350b05502": "3. ADMIN", "a2716543-c376-457e-b9c0-cba0bf636fb8": "Quản lý tài khoản giáo viên: danh sách, tạo mới (họ tên, tên đăng nhập, mật khẩu, liên hệ, ghi chú), sửa thông tin", "4b04df76-fb08-45a0-a14d-d5529b4c8ed7": "Tạm khóa / Mở khóa tài khoản giáo viên", "76034f5e-90a1-4ee9-a7de-6507f212b350": "Xóa tài khoản giáo viên", "e078039b-ebc5-4593-b60e-270a9afd2caf": "'Truy cập với tư cách Giáo viên này' — đóng vai GV để hỗ trợ", "dd013278-4ac9-4601-86b7-27b45fef2f87": "Tải lại danh sách · Đăng xuất khỏi Cổng Admin", "df4a4b18-7e2a-4016-90ef-8357e05c0e39": "ĐÃ VÁ 21/10: đăng nhập Admin dùng tài khoản THẬT trong DB (bảng teachers, role='admin' — migration_006); đã gỡ thông tin cứng khỏi cả 2 đường Supabase + mock và bỏ bí danh cũ; cổng Giáo viên chỉ nhận role='teacher'", "7f6cc529-08d8-403a-9a70-f8748071e1bb": "4. HỆ THỐNG & DỮ LIỆU (dùng chung)", "4c6e164e-347f-4738-a933-dc197f6efc84": "4.1 Đăng nhập & phiên", "18a57e2f-4426-43e7-854d-1a2a9c3639f2": "3 vai trò: Học sinh / Giáo viên / Admin — đăng nhập bằng tên đăng nhập + mật khẩu thật trong DB", "756fc31a-c2fd-41fc-85b2-8a8fad040657": "ĐÃ XÓA cửa hậu mật khẩu phổ thông ở cả 2 kho dữ liệu (trước đây mọi tài khoản vào được bằng mật khẩu mặc định, kể cả sau khi chủ tài khoản đã đổi mật khẩu khác)", "8315ca5a-4b01-4d6c-ab89-41242d6ea615": "Lỗi đăng nhập báo rõ; không còn gợi ý mật khẩu trong thông báo lỗi", "b88d9e00-8ccc-4ee3-873a-94f43984a38f": "ĐÃ VÁ 22/10 — hết 'phiên ma' sai danh tính: máy chủ lỗi/thoáng chập thì đăng nhập BÁO LỖI KẾT NỐI, tuyệt đối không rơi về tài khoản mẫu (trước đây cùng mật khẩu là vào được hồ sơ mẫu khác tên/khác lớp); phiên mẫu đã lưu (id không phải UUID) bị hủy khi tên đăng nhập tồn tại trên máy chủ; nạp state học sinh tra thẳng dòng tài khoản thật để tên + lớp luôn đúng người", "14fb0bb0-76c7-44bb-a584-4a79a9a2a3eb": "'Xem góc Học sinh' cho GV/Admin: lưu phiên gốc, thanh cảnh báo cố định + nút 'Thoát xem thử' quay về đúng phiên", "fd6403da-1478-4d5c-aa1e-5a20b3745515": "Đăng xuất xóa cả phiên đóng vai — hết đường leo quyền trở lại", "cc627d1e-9f33-4693-823b-b6a273b5d323": "Bộ đếm giờ học tích cực chỉ chạy khi người dùng thật là học sinh", "f2c0768b-c93f-4437-9e0c-613089564e77": "4.2 Máy XP (xpEngine)", "b2aae73e-0c1c-45b4-ba38-bdb5debfc92a": "XP phẳng theo HOÀN THÀNH — không gắn với điểm số (quyết định chốt của chủ dự án)", "9c7133df-41b0-4ce3-a686-b837cc6b9a05": "awardXP lật ngày / tuần theo GIỜ ĐỊA PHƯƠNG: ngày mới từ 00:00 giờ VN (đã sửa lỗi ngày UTC bắt đầu 07:00 khiến điểm danh 2 lần trong một buổi sáng); khóa tuần theo thứ Hai", "f884825f-4f5d-44c3-9c9c-775f8ab72523": "MÔ HÌNH XP MỚI (22/10/2026 — chủ dự án chốt): XP chỉ còn 3 nguồn — ĐIỂM DANH NGÀY (số XP giáo viên cấu hình, là mục duy nhất còn lại ở màn Cài đặt), QUỸ XP CỦA CHỦ ĐỀ và XP CỦA TỪNG BÀI KIỂM TRA / BÀI ĐƯỢC GIAO", "b523e3d5-cb98-4b45-8938-4eb9b49c0806": "Quỹ XP chủ đề: giáo viên đặt số XP ngay trong cửa sổ Chỉnh sửa chủ đề (xpReward trong payload chủ đề); học sinh nhận ĐỦ đúng 1 lần khi hoàn thành TOÀN BỘ chủ đề — xem trọn luồng video, học xong lý thuyết, làm ĐÚNG HẾT phần chấm tự động của mọi bài trong luồng (câu tự luận không chặn điều kiện); bộ đánh giá topicCompletion chạy ở App sau mỗi thay đổi tiến độ học", "b6636df2-74da-4703-a7d6-2f4d87fd76a2": "XP bài kiểm tra / bài được giao: học sinh NỘP BÀI LÀ NHẬN (không xét đúng sai), 1 lần mỗi bài — bài độc lập lấy cột xp_reward trên chính bài (migration_010, nhập trong màn soạn bài), bài trong chủ đề lấy ô 'Điểm thưởng XP khi hoàn thành' ở Cài đặt bài của QuizBuilder", "d0fcba18-2b39-464e-b3be-2dabcabf3c41": "ĐÃ BỎ HẾT: trần XP ngày theo phút học (130/150), trần tuần 900 và toàn bộ cộng XP lẻ theo hành động (xem video 80% = 5, đọc tóm tắt = 2, luyện tập…); các bước học trong luồng Video/Lý thuyết giờ chỉ GHI NHẬN hoàn thành (recordStepCompletion) phục vụ Cây/Năng lực và điều kiện quỹ chủ đề; màn Cài đặt XP rút còn Điểm danh ngày; trang chủ học sinh bỏ hiển thị trần ngày", "59096fc7-1289-45c3-a130-bb6e1edfa087": "Tách 'tiến độ học' khỏi 'đã trả XP' (xpAwardedSteps) vẫn giữ: mỗi khóa XP (attendance:<ngày> / topic:<id>:complete / assignment:<id>:submitted / quiz:<id>:completed) chỉ trả đúng 1 lần — hết lỗi 'từ ngày thứ 2 mọi lần cộng XP đều trả về 0'", "712ee83a-d18f-422a-8149-5ab942250a86": "4.3 Kho dữ liệu 2 lớp", "9adb736a-9f03-4d6d-bab7-73f6419b9072": "Supabase (PostgreSQL) là kho chính — 22 bảng: 12 bảng vận hành (học sinh, giáo viên, lớp, chủ đề, video, lý thuyết, quiz, câu hỏi, bài nộp tự luận, state học sinh, yêu cầu quà…) + 10 bảng tiến độ/phân tích thêm ở migration_008 (luồng học, nối hoạt động–câu hỏi, bài độc lập, nối bài–câu hỏi, giao bài từng em, lượt làm bài, câu trả lời, phiếu chấm, phiên đăng nhập, bảng ngày)", "85c4bca5-de89-4f66-8c6c-0afc9a58a4da": "Tách dữ liệu RIÊNG theo giáo viên (21/10, migration_007): mọi nội dung gắn teacher_id của người tạo; đọc/ghi nội dung, ngân hàng câu hỏi, chấm bài và thống kê đều lọc theo giáo viên của phiên đăng nhập; bộ nhớ đệm trình duyệt được dọn khi đăng xuất và chỉ nhận dữ liệu mang dấu chủ của đúng tài khoản — hết cảnh các giáo viên thấy/dùng chung dữ liệu của nhau", "fde928d0-abb1-42da-8d08-5ddf7747f06a": "Kho mock (localStorage) làm dự phòng khi mất kết nối: đọc GỘP dữ liệu 2 nơi (bài nộp, học sinh, lớp) để không bao giờ thất lạc dữ liệu", "8323a07c-9639-41be-98d7-983c397a4993": "Cổng chặn ghi state: chỉ lưu sau khi state THẬT của đúng học sinh đã nạp xong — hết lỗi state mẫu (310 XP, huy hiệu sẵn) ghi đè lên DB", "22a8b7a8-a235-4026-a8d5-497be1d7bbb0": "ĐÃ XÓA SẠCH DỮ LIỆU MẪU (22/10, rà soát toàn diện theo lệnh chủ dự án): file mockData.ts (1.038 dòng) bị xóa hẳn; MỌI màn hình hết dự phòng bằng dữ liệu mẫu — Học bài/thẻ video không gộp bài mẫu, video/lý thuyết không thấy thì báo không tìm thấy (không thay bằng bài khác), làm bài/kết quả/BTVN chỉ dùng câu hỏi + bài thật; state khởi tạo là state TRỐNG (0 XP) thay cho state mẫu 310 XP; kho local hết tự gieo state mẫu; tính năng 'Đặt lại dữ liệu demo' bị gỡ; phân tích học sinh hết bịa 'đáp án đã chọn' (hệ thống không lưu lựa chọn — chỉ hiện đáp án đúng khi tra được câu thật); kho bài tự luận tra đề thật từ bảng questions. Bổ sung cùng ngày: bảng điểm nội bộ hết gán nhãn lớp bịa '7A3' (điều kiện cứng thời demo) — tên lớp tra từ danh sách lớp thật/hồ sơ học sinh; xu hướng điểm tuần bỏ chia đôi theo 2 lớp demo. Mọi con số trên màn hình đều truy được nguồn trong DB; còn cấu hình cứng duy nhất là catalog quà/huy hiệu + cấu hình XP mặc định (định nghĩa sản phẩm). ĐỢT BỔ SUNG CHIỀU 22/10 (quét lại các file đợt sáng chưa chạm): thẻ Tổng quan hết '+15%' bịa khi không có kỳ trước (không có dữ liệu so sánh thì ẩn huy hiệu), mẫu số tỉ lệ hoàn thành = tổng bước học THẬT của các chủ đề (video + lý thuyết + bài; cổng GV nay nạp thêm danh sách bài), thời gian học TB chỉ tính giây hoạt động ghi thật (bỏ 'mỗi ngày điểm danh = 30 phút' và phép chia 6 tuần); Phân tích câu hỏi bỏ hẳn 'đáp án nhiễu được chọn nhiều nhất' (hệ số 0,65 bịa — dữ liệu không lưu đáp án HS chọn) và thời gian làm bài gán cứng 140/45 giây theo mức; Xưởng chấm AI hết gieo bài mẫu chấm sẵn + rubric mẫu (thư viện mặc định RỖNG, chỉ hiện dữ liệu GV tự tạo) và xóa hẳn nhật ký kiểm toán mẫu; state khởi tạo hết mặc định lớp bịa 'Lớp 7A2' + trường cứng (không tra được lớp thật thì để trống) cùng mọi fallback tên lớp '7A2' còn sót ở kho dữ liệu/màn hình; Cài đặt gỡ hẳn các trường trần XP đã bãi bỏ (130/150/900) khỏi mặc định + kiểu dữ liệu + hằng cấu hình và trung tính hóa tên trường/lớp mặc định bịa (cài đặt vẫn lưu trong trình duyệt theo từng GV — chưa chuyển lên bảng system_settings). ĐỢT CUỐI TỐI 22/10 (2 cụm ngoài checklist, chủ dự án duyệt xử nốt): tab Tương tác & chuyên cần bỏ hẳn 'thời gian mở web' suy diễn (phút học × 1,35 + 15 — hệ thống không đo chỉ số này), phút học hết cộng 28 phút/ngày điểm danh (chỉ tính giây học ghi thật như thẻ Tổng quan), cột + thẻ 'chạm trần XP' bị gỡ (khái niệm trần đã bãi bỏ) thay bằng chuỗi ngày điểm danh liên tục dài nhất và tổng số buổi điểm danh thật, tỉ lệ chuyên cần hết mặc định 85% khi chưa có dữ liệu (hiện '— Chưa có dữ liệu điểm danh'); biểu đồ hoạt động theo ngày ở Tổng quan + trợ lý và hoạt động tuần trong hồ sơ học sinh hết nhân 32 phút/HS điểm danh (state không lưu phút học theo ngày/tuần — chỉ còn số học sinh hoạt động và ngày điểm danh thật); bảng điểm nội bộ gỡ nốt phép cộng 1800 giây/ngày điểm danh và chia 6 tuần; chỉ số độ tin cậy AI ở Xưởng chấm: chưa có bài nào vừa có gợi ý AI vừa có điểm chốt thì trả null -> giao diện báo 'Chưa đủ dữ liệu' (hết số mẫu 0,35/8,5%/36 bài cứng), xu hướng tuần gom theo tuần chốt điểm thật và chênh theo tiêu chí ghép cặp điểm rubric AI/GV theo tên tiêu chí", "d4167ed0-71cb-4cb9-b303-a3639e632401": "Học sinh mới bắt đầu TRẮNG với hồ sơ thật (đúng tên + đúng lớp) ở cả 2 nhánh đọc state", "b8cd7c5b-b7b9-4856-83ab-fae3380fa365": "useLiveQuery + eventBus: đồng bộ tức thời giữa các màn hình theo đúng khóa sự kiện (quiz / content / class…)", "efb8b548-c053-4e46-a081-8d818ac97028": "Migration chờ chủ dự án chạy trong Supabase SQL Editor: 003 (trạng thái quà GIVEN/OPENED) + 004 (cột payload giữ đủ trường câu hỏi) — app đang chạy chế độ tương thích an toàn trong lúc chờ", "8cd72471-a068-4364-8472-ffb160a67d4b": "Đã sao lưu toàn bộ 12 bảng trước khi dọn dữ liệu test: xóa 21 HS test + 15 bài nộp test; giữ lại hs001, 5 giáo viên, 4 lớp, toàn bộ nội dung thật (6 chủ đề, 97 câu hỏi, 33 quiz, 19 video, 6 lý thuyết)", "62044c88-2362-4e47-8517-136365960d53": "4.4 Giao diện & hiệu năng", "9b446a3f-45f7-4d1c-8660-7e4f79e9c782": "Mọi hộp thoại xác nhận dùng ConfirmDialog giữa màn hình (6 chỗ từng dùng hộp thoại mặc định của trình duyệt đã thay hết)", "cded40cf-e81e-4fdc-b11e-4df2a7a69150": "Nút điều hướng tự nhả focus sau khi bấm — hết vòng đen focus bám trên nút menu", "21013985-169d-4547-a0b5-1a59de356a52": "Tải lười (React.lazy): gói JS ban đầu 2,37 MB → ~0,79 MB; phần giáo viên (~1,08 MB) và thư viện biểu đồ (~0,39 MB) chỉ tải khi vào đúng khu vực", "d89918b9-8f81-468b-9a56-980303aca917": "DevPanel (cộng XP / tự duyệt quà / tự chấm 9.0 / đặt lại dữ liệu demo) CHỈ có ở bản development — đã kiểm chứng bị loại khỏi gói production", "58f6debb-4fa8-4479-bac5-a3621d52d274": "5. KHUNG ĐO NĂNG LỰC (từ sơ đồ gốc của chủ dự án — đã có dữ liệu đỡ)", "81d825e7-4c83-4589-91a5-1c65bbdc80ac": "Mỗi lần làm bài xong, đo được từ học sinh: điểm theo câu / chủ đề, năng lực, độ khó, tỉ lệ đúng, thời gian", "71cecdd1-4d46-4476-97aa-886aa13a740f": "4 năng lực × dạng đo × độ khó", "e0bbf20c-be07-4482-b5b7-8b21b3a49270": "Nhận biết → Trắc nghiệm — Dễ", "7ba81c0e-eef0-4e0b-9cec-c1e6a69d62a9": "Thông hiểu → Trắc nghiệm — Trung bình", "35e900ac-617a-4782-8481-c64aac59532f": "Phân tích → Trắc nghiệm — Khó · Tự luận chấm Rubric — Khó", "335bff53-99c3-4ea3-b337-9e8175666b5e": "Vận dụng → Tự luận / viết văn (đoạn 5–7 câu, bài 150–200 chữ) chấm Rubric — Khó", "852efcc2-81e7-43da-85f5-145b6fc4758e": "Biểu thị khách quan: % thành thạo từng năng lực theo chủ đề (calculateLevelMastery / calculateAllMastery) + trạng thái Vững / Đang tiến bộ / Cần ôn lại / Chưa học", "da1fe1e6-5efc-4113-b8f2-2317c97a5ed8": "Dữ liệu nền cho phân tích", "924fdbfd-7438-43f9-ba64-9389e861e359": "Đăng nhập & chuyên cần: có thường xuyên vào học không, ai ít đăng nhập (điểm danh + phút học tích cực theo ngày)", "554916da-18d6-4c44-bbef-3d56dbc51275": "Năng lực qua bài tập: kết quả từng câu gắn năng lực + độ khó", "d54b9b90-cd11-4694-8789-2cdfdfb5e86c": "Dữ liệu tiến độ tường minh (migration_008, nạp từ dữ liệu giả lập Power BI 21/10): phiên đăng nhập thật theo ngày/thiết bị/thời lượng, lượt làm bài + từng câu trả lời (đáp án đã chọn, thời gian làm), phiếu chấm — hiển thị ở màn giáo viên 'Tiến độ bài làm' và mục 'Bài tập được giao' ở trang chủ học sinh", "c5d03538-8631-4e93-8867-bd5d91de79f8": "Đầu ra đã nối chung 1 hàm tính: Kết quả học tập của học sinh · Ma trận năng lực ở Cây tri thức · Phân tích của giáo viên", "f6049812-aa9f-4d6f-9bfb-7462d219ae19": "6. KIỂM CHỨNG & TRẠNG THÁI DỰ ÁN", "acbb9fe9-0006-4560-9493-43a46f736cfd": "Cổng TypeScript trong lệnh build (tsc --noEmit && vite build): 18 lỗi type ban đầu → 0 lỗi", "7d71d702-a281-4a15-850d-f87369584553": "Test logic tự động scripts/test_round2_logic.ts: 35/35 đạt (XP, lật ngày/tuần, đổi quà trừ TỔNG XP + hoàn khi từ chối, sinh tên đăng nhập / mã HS)", "0528af48-2906-45c3-9d1e-14d34823fde0": "Đợt 0–6 + QA vòng 2 + các đợt tinh chỉnh ngày 18/10: đã đẩy nhánh dev (81c8bc1) và deploy production https://mamvan.vercel.app", "5bc94f0a-9392-4d74-87de-50e93de3a4d3": "Đợt bảo mật 21/10 (theo audit): vercel.json thêm header bảo mật production (CSP, X-Frame-Options SAMEORIGIN, CORS thu hẹp về mamvan.vercel.app, nosniff, Referrer-Policy, Permissions-Policy, HSTS) + gỡ email hardcode khỏi TeacherTopbar — commit 1eb682d, đã deploy và kiểm chứng header trực tiếp trên production", "5d60ef73-594d-4b5c-a7af-03f2586dfc15": "Đợt Admin thật 21/10: gỡ đăng nhập Admin ghi cứng khỏi mã nguồn (repo công khai) — Admin thành tài khoản thật trong bảng teachers role='admin' (migration_006_admin_account.sql), cả 2 đường Supabase + mock đều tra cứu tài khoản thật; ĐÃ chạy migration_006 vào DB + deploy production + kiểm chứng 3 ca đăng nhập trên production tối 21/10 (admin thật vào được Cổng Admin, bí danh cũ bị báo không tồn tại, sai mật khẩu bị từ chối)", "fc7a1748-793b-46c3-8ace-63a429e706c4": "Đợt tách dữ liệu theo giáo viên 21/10 (GĐ1 của kế hoạch xóa DB + nạp dữ liệu giả lập): migration_007 ĐÃ chạy vào DB thật (thêm teacher_id cho video/lý thuyết/quiz/câu hỏi + gán nội dung vô chủ về gv004, 0 dòng còn thiếu chủ); code đã vá 8 điểm rò (lọc đọc theo chủ, đóng dấu khi ghi, cache theo tài khoản + dọn khi đăng xuất, cài đặt riêng từng giáo viên, bỏ gộp câu mẫu dùng chung) — kiểm chứng A/B 2 tài khoản trên production ĐẠT tối 21/10 (giáo viên B không thấy bất cứ dữ liệu nào của A ở cả 3 màn, học sinh của A thấy đúng nội dung A xuất bản)", "26bfc723-8de3-4255-aca3-67cdd0ebad83": "Đợt LUỒNG HỌC TRONG CHỦ ĐỀ 22/10 (kế hoạch đã duyệt kèm 7 ảnh chụp của chủ dự án): bỏ tự sinh video nháp khi tạo chủ đề (+ xóa 2 video nháp ma ở chủ đề 'Văn 7' khỏi DB) → menu Tạo mới hợp nhất 3 loại (sau rút còn 3 vị trí — bỏ nút góc trên trang — và bài mới chèn ngay sau bài đang mở, theo phản hồi bố cục của chủ dự án) → thêm flowOrder vào bản ghi chủ đề (logic/flowOrder.ts) + DẢI LUỒNG HỌC nút tròn kéo–thả (TopicFlowStrip) ở đầu khung phải, cây chủ đề hiển thị hợp nhất theo luồng → học sinh có tab 'Luồng học' mặc định học theo đúng thứ tự → QuizBuilder tạo mới mở Cài đặt bài trước", "ffaadce9-88dd-4741-b <script>
  const svg = document.getElementById('svg');
  const world = document.getElementById('world');
  const FULL = { x: -3940.0, y: -9830.0, w: 5756.0, h: 19660.0 };
  const GVB = [-3890.0, -9780.0, 3600.0, 15896.0];
  const HSB = [290.0, -7167.0, 1476.0, 8727.0];
  let k = 1, tx = 0, ty = 0;
  function apply() { world.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`); }
  function stageSize() { const r = svg.getBoundingClientRect(); return { w: r.width, h: r.height }; }
  function fitAll() {
    const s = stageSize();
    k = Math.min(s.w / FULL.w, s.h / FULL.h);
    tx = (s.w - FULL.w * k) / 2 - FULL.x * k;
    ty = (s.h - FULL.h * k) / 2 - FULL.y * k;
    apply();
  }
  function jump(r) {
    const s = stageSize();
    k = Math.min(s.w / (r[2] + 60), s.h / (r[3] + 60));
    tx = s.w / 2 - (r[0] + r[2] / 2) * k;
    ty = s.h / 2 - (r[1] + r[3] / 2) * k;
    apply();
  }
  function zoomAt(mx, my, f) {
    const px = (mx - tx) / k, py = (my - ty) / k;
    const k2 = Math.min(4, Math.max(0.02, k * f));
    tx = mx - px * k2; ty = my - py * k2; k = k2;
    apply();
  }
  function zoomC(f) { const s = stageSize(); zoomAt(s.w / 2, s.h / 2, f); }
  function toggleRel() {
    const l = document.getElementById('rellayer');
    const off = l.style.display === 'none';
    l.style.display = off ? '' : 'none';
    document.getElementById('relbtn').textContent = off ? 'Ẩn đường quan hệ' : 'Hiện đường quan hệ';
  }
  const ptrs = new Map();
  let lastPinch = 0, lastMid = null, downMoved = 0, hitId = null, multi = false;
  svg.addEventListener('pointerdown', e => {
    if (ptrs.size >= 1) multi = true;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const g = e.target && e.target.closest ? e.target.closest('g.node') : null;
    hitId = g ? g.dataset.id : null;
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    lastPinch = 0; lastMid = null; downMoved = 0;
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) {
      downMoved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
      tx += e.clientX - prev.x; ty += e.clientY - prev.y;
      apply();
    } else if (ptrs.size === 2) {
      const p = [...ptrs.values()];
      const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const mid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
      const r = svg.getBoundingClientRect();
      if (lastPinch > 0) zoomAt(mid.x - r.left, mid.y - r.top, dist / lastPinch);
      if (lastMid) { tx += mid.x - lastMid.x; ty += mid.y - lastMid.y; apply(); }
      lastPinch = dist; lastMid = mid;
    }
  });
  const endPtr = e => { ptrs.delete(e.pointerId); lastPinch = 0; lastMid = null; };
  svg.addEventListener('pointerup', endPtr);
  svg.addEventListener('pointercancel', endPtr);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });

  // ===== Che do bam-chon: nut lien quan sang len, con lai mo di =====
  const G = JSON.parse(document.getElementById('graph').textContent);
  const edgeEls = [...document.querySelectorAll('path.edge')];
  const relEls = [...document.querySelectorAll('#rellayer .rel, #rellayer .rellbl')];
  function focusNode(id) {
    const S = new Set([id]);
    const stack = [id];
    while (stack.length) { const cur = stack.pop(); (G.children[cur] || []).forEach(c => { S.add(c); stack.push(c); }); }
    let p = G.parent[id];
    while (p) { S.add(p); p = G.parent[p]; }
    G.rels.forEach(([a, b]) => { if (a === id) S.add(b); if (b === id) S.add(a); });
    document.querySelectorAll('g.node').forEach(el => {
      el.classList.toggle('dim', !S.has(el.dataset.id));
      el.classList.toggle('lit', S.has(el.dataset.id));
    });
    edgeEls.forEach(el => el.classList.toggle('dim', !(S.has(el.dataset.a) && S.has(el.dataset.b))));
    relEls.forEach(el => {
      const on = (el.dataset.a === id && S.has(el.dataset.b)) || (el.dataset.b === id && S.has(el.dataset.a));
      el.classList.toggle('dim', !on);
      if (el.tagName === 'path') el.classList.toggle('hot', on);
    });
    document.getElementById('fname').textContent = '🎯 ' + (G.titles[id] || '');
  }
  function clearFocus() {
    document.querySelectorAll('.dim, .lit, .hot').forEach(el => el.classList.remove('dim', 'lit', 'hot'));
    document.getElementById('fname').textContent = '';
  }
  svg.addEventListener('pointerup', e => {
    const wasMulti = multi;
    if (ptrs.size === 0) multi = false;
    if (downMoved > 6 || wasMulti) return;
    let id = hitId;
    if (!id) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('g.node') : null;
      id = g ? g.dataset.id : null;
    }
    if (id) focusNode(id); else clearFocus();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') clearFocus(); });
  fitAll();
</script>
