  .meta { font-size:10.5px; text-anchor:middle; }
  .roottitle { font-size:21px; font-weight:800; fill:#FFF7E8; text-anchor:middle; }
  .rootsub { font-size:12.5px; fill:#FFF7E8; opacity:.85; text-anchor:middle; }
  .node { cursor:pointer; transition: opacity .25s; }
  path.edge, .rel, .rellbl { transition: opacity .25s; }
  .dim { opacity: .07 !important; }
  .rel.hot { opacity: 1 !important; stroke-width: 3.4; }
  .node.lit rect { stroke-width: 3.2; }
  #fname { font-size:12.5px; font-weight:700; color:#FFD166; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

 mới' mở menu 3 loại", "947e5ccb-f650-4f72-be16-538251d73254": "BÀI TẬP & ĐÁNH GIÁ LÀ MỤC RIÊNG NGANG HÀNG CHỦ ĐỀ (nâng cấp 22/10 theo yêu cầu chủ dự án — thay form bật lên AssignmentBuilderModal đã gỡ): nút 'Thêm bài tập & đánh giá' đứng NGANG HÀNG nút 'Thêm chủ đề' ở đầu cây → bấm là tạo ngay một mục NHÁP mới trong cây (thẻ riêng màu hổ phách — cột cây TÁCH 2 TAB riêng (tab Chủ đề / tab Bài tập & đánh giá, chủ dự án không muốn 2 loại chung một danh sách), thẻ ghi 'Bản nháp/Đã giao' + số câu/số học sinh/đã nộp) → mở MÀN SOẠN BÀI KIỂM TRA (AssignmentEditor) ở khung phải: tiêu đề, hạn nộp, giới hạn thời gian, chọn lớp + từng học sinh, chọn câu hỏi từ Ngân hàng vào đề (thêm/bớt/đổi thứ tự); 'Lưu nháp' chưa cho học sinh thấy (chưa published_at), 'Giao bài' mới chốt published_at + đồng bộ assignment_targets (học sinh đã có lượt làm thì không bị gỡ); xóa mục qua dialog xác nhận, xóa sạch cả attempts/answers/reviews con; tiến độ nộp và chấm ở màn 'Tiến độ bài làm' (chỉ tính bài đã giao)", "d4a7ef9c-914d-4e5e-8b0e-6e384f638ec2": "Menu tạo bài HỢP NHẤT 3 loại (Bài giảng Video / Lý thuyết / Bài tập — loại bài tập cụ thể chọn trong Cài đặt bài của QuizBuilder) ở 3 vị trí cùng một theme gọn (mỗi loại 1 dòng icon + tên; tạo thủ công bấm vào dòng, Tạo với AI bấm icon ✦ cuối dòng): 'Thêm vào chủ đề' ở trang chi tiết chủ đề, dòng '+ Tạo mới' cuối cây, nút '+ Thêm bài' cuối dải luồng. Nút '+ Tạo mới' ở góc trên trang đã BỎ (chủ dự án yêu cầu 22/10). QUY TẮC VỊ TRÍ: bài mới tạo CHÈN NGAY SAU bài đang mở (đang ở vị trí nào, bài mới nằm ngay sau vị trí đó — kể cả bài liên kết tạo từ trình soạn video/lý thuyết); không mở bài nào thì vào cuối luồng", "60fc833a-610a-44d6-8811-f44a40a0144f": "Dải luồng học (TopicFlowStrip) ở đầu khung phải: mỗi bài là một nút tròn có icon theo loại (Video ▶ / Lý thuyết 📖 / Bài tập ✎) nối nhau bằng gạch ngang, đúng thứ tự flowOrder; bấm nút tròn → mở đúng bài đó; kéo–thả trên dải để đổi thứ tự (lưu ngay); nút '+ Thêm bài' ở cuối dải mở menu 3 loại phủ lên trên nội dung bên dưới (không bị vùng cuộn của dải cắt mất). Thứ tự lưu trong video_payload.flowOrder của chủ đề (khóa 'video:<id>' / 'theory:<id>' / 'quiz:<id>'); chủ đề cũ chưa có thì suy ra tạm video → lý thuyết → bài tập", "17fdf9fb-db6b-4129-b633-fffdc478130c": "Trang chi tiết chủ đề có nút 'Cập nhật lên web học sinh' — XUẤT BẢN CHỦ ĐỀ qua PublishModal dùng chung (bổ sung 22/10; trước đó THIẾU HẲN nên chủ đề mới tạo kẹt ở Bản nháp và học sinh không bao giờ thấy; xuất bản Video/Lý thuyết con vẫn tự xuất bản chủ đề cha như cũ)", "65a45ea5-d005-49e1-9c95-c40a9a8109d3": "Lớp lưu trữ siết chặt (sửa 22/10): tạo Video/Lý thuyết/Bài tập mà đẩy lên Supabase thất bại thì thử lại 1 lần rồi BÁO LỖI rõ ràng (pushOrThrow) — hết cảnh nuốt lỗi khiến bài tạo xong 'tự biến mất' (sự cố video trong chủ đề mới khi kiểm chứng luồng học). Vận hành: app tự đồng bộ bộ đệm trình duyệt lên máy chủ nên TUYỆT ĐỐI không xóa dữ liệu nội dung thẳng trong DB — bản đệm của trình duyệt sẽ đẩy hồi sinh; luôn xóa qua giao diện", "0d29eb10-2fbe-4e9d-a8b1-3137021ee26e": "Trình soạn Video", "7f1b23ca-9aac-4b4e-bcfc-38b09f113665": "Nguồn video: tải lên / liên kết; thời lượng", "055bafde-f749-4e3a-aa41-56da05e8442e": "Các ý trọng tâm (điểm tóm tắt) + tiểu mục", "be426aee-d91f-4bf2-953d-bb4b97e28eeb": "Gắn 3 bài liên kết: Luyện tập / Kiểm tra nhanh / Mastery Check — tạo mới ngay trong trình soạn, ID được ghi ngược vào bài gốc", "c2d752b2-1e98-4718-aa7a-23376a18aec4": "Quay lại về trang chủ đề · Xem trước như học sinh · Lưu nháp · Cập nhật lên web học sinh (xuất bản)", "343c279e-3da1-45e6-a240-207f7ac106fc": "Trình soạn Lý thuyết", "14ca9d9a-bcbe-4c56-9f14-663ddeef291c": "Soạn theo khối nội dung (tiêu đề / đoạn văn…); thời gian đọc tối thiểu (giây)", "2c888b99-c857-4f1b-9647-b6fefb3105cc": "Gắn bài Luyện tập + bài Kiểm tra lý thuyết", "3316c86c-c164-42be-943b-f14971de2e2b": "Quay lại / Xem trước / Lưu nháp / Xuất bản", "64a30e87-50f2-43f4-bfef-da620f2009f1": "Trình tạo Bài tập (QuizBuilder)", "d2ee50d8-8 ng: chỉ lưu câu đã tích chọn; tiêu đề 'Bộ câu hỏi: <chủ đề>', thời lượng = max(7 phút, số câu), XP = số câu × 5", "df920d61-10b1-48ab-a3c1-bdda26537a5b": "Lý thuyết AI → màn DUYỆT LÝ THUYẾT xem trước đúng dạng học sinh sẽ đọc → ưng ý mới 'Lưu lý thuyết vào học liệu'; nháp lý thuyết cũng tự lưu bền", "51e3b02d-1bab-42a4-815b-4e317b120104": "1.6 Chấm bài", "a06cd996-bf36-41cd-989f-1dd8b4903d69": "Hàng đợi GOM THEO HỌC SINH — mỗi em đúng 1 dòng (khử trùng bài theo nội dung + quy về đúng 1 học sinh thật dù lệch định danh giữa các nguồn)", "87e3806a-3826-4b6f-b6e8-8840d9e6ad0a": "Bảng 6 cột theo mẫu: Học sinh | Lớp | Chủ đề đã làm (x/y) | Bài chờ chấm (0 thì làm mờ) | Chờ lâu nhất (đỏ + '(quá hẹn)' khi quá 24 giờ) | Xem chi tiết", "108e118f-dff4-462a-b526-8fbf6be90c8e": "2 thẻ thống kê: 'Cần chấm' (chờ chấm + đã có gợi ý AI, có nút lọc riêng gợi ý AI) · 'Chờ > 24 giờ' (bấm → sắp xếp chờ lâu nhất lên đầu)", "d136c103-f32b-467d-a5b4-f102d98152dd": "Bộ lọc gộp 1 ô duy nhất: Trạng thái / Sắp xếp", "64b22905-8558-4184-a54c-af8523549ba4": "'Chấm ngay' mở thẳng bài chờ lâu nhất chưa chấm của em", "356a47e6-7656-47ac-bc8d-6b581f877602": "Hàng đợi GỘP CẢ PHIẾU CHẤM TỪ LUỒNG BÀI TẬP/HOẠT ĐỘNG (22/10): câu tự luận nộp qua bài được giao/luồng học tạo phiếu chờ ở bảng phiếu chấm (answer_reviews, nhánh tiến độ) — nay hiện CHUNG trong hàng đợi này cạnh bài nộp tự luận thường (đúng học sinh/lớp/đề thật/nguồn bài); chốt điểm tại đây ghi ngược về đúng phiếu + câu trả lời + tổng điểm lượt làm, quy đổi thang 10 của hàng đợi ↔ điểm tối đa riêng của câu (2/3/4đ); màn Tiến độ tự khớp số chờ chấm vì cùng một nguồn; nháp chấm của phiếu lưu bền trên máy", "efec433a-d77f-4afa-b797-727bb00e6a70": "Xem chi tiết theo học sinh", "53149e5d-dd0e-47ab-90ef-af5639fd3504": "Thẻ 'Họ tên · Lớp' + thanh tổng kết: x/y bài kiểm tra đã làm, số bài chờ chấm, số bài quá hạn, ĐTB, công tắc 'Chỉ hiện bài chưa chấm'", "1c55cbd9-370f-4d12-a364-c1074d1da86a": "Bài gom theo CHỦ ĐỀ: dòng nhóm '… – bài chờ chấm: N' / '… – (Hoàn thành)'", "c3e5c86c-cad3-4f9a-8872-ff34bd1f2fbf": "Cột Điểm hiện 'Gợi ý Xđ' cho bài AI đã gợi ý", "c2b4be42-ecd6-410b-a92f-269aa8342ab4": "Màn chấm bài (SplitGradingWorkspace)", "e3b3bd9d-38e1-4a7c-b1c0-ad9afe641589": "Nội dung bài tự luận + thông tin bài / năng lực / chủ đề", "079babc0-5c88-4c90-bb8f-c9524abb4df5": "'Gợi ý chấm tự động bởi AI': điểm gợi ý làm tròn 1 chữ số thập phân; chưa có gợi ý thì không bịa số", "c0c1f766-6ccf-4d0f-9d78-aee562d08602": "'Tiêu chí đánh giá & Chấm điểm': chấm theo Rubric từng tiêu chí; gõ số thập phân / xóa trắng bình thường; Rubric không lưu khi tổng trọng số ≠ 100", "8c384ccc-9bb4-476f-a37a-2f82dc3a3543": "Câu nhận xét mẫu nhanh — bấm để chèn", "034fa8dc-686c-43f6-a141-4f1ade06e6ea": "Chốt điểm → ghi đúng chủ đề / năng lực + nhật ký kiểm toán + thông báo cho học sinh (ở cả 2 kho dữ liệu)", "3f5fb205-7517-4526-8506-92477f78b9de": "Huấn luyện AI (AiTrainingStudio): rubric + bài mẫu chấm để AI học cách gợi ý điểm", "f99b5883-3f26-40df-9ed2-9a2951b0a56e": "Bài tự luận không bao giờ bị gán nhầm cho 'học sinh đầu tiên' khi không tra được chủ nhân", "6bbc956c-66cc-4021-b33a-850bf6f27006": "1.7 Quà tặng", "5e7f4c37-3d8c-4da4-ad1f-41b4a3b9f9d2": "Hàng đợi yêu cầu đổi quà — số liệu thật (XP tuần / điểm danh / tên lớp tính từ state thật)", "e1fca63d-d69f-41eb-bf45-0627e93c9b88": "Duyệt / Từ chối / Trao / Mở — trạng thái GIVEN/OPENED không bị ghi nhầm thành REJECTED (migration_003)", "d28e3dcd-4caa-4de8-9fb3-fb47271dc355": "Từ chối → HOÀN đầy đủ XP đã trừ vào TỔNG XP của học sinh (kể cả từ chối hàng loạt)", "bf0463a7-dfc0-4d09-b59e-f44a65e84b9e": "Duyệt / trao hàng loạt chỉ tính yêu cầu hợp lệ", "dcf1d5eb-cfcd-48a8-9fa4-b2256a78e825": "Xuất CSV theo đúng bộ lọc đang xem", "3cefe6f0-19f8-4994-95bf-6cc1cb6cdc03": "Danh mục quà GV tùy biến là nguồn dự phòng; giá XP chuẩn theo danh mục học sinh nhìn thấy", "8d26db99-8277-4831-950e-3c94965f90a2": "1.8 Phân tích", "dea1b9f4-fcec-494f-a9a1-8e8b3072c66f": "metricsEngine: computeOverviewMetrics / detectStudentsNeedingAttention / generatePedagogicalInsights", "422019cb-802e-4e67-a4a1-5eb14a70c300": "Phổ điểm (Histogram): tính theo TỪNG HỌC SINH — điểm TB của mỗi em xếp vào đúng 1 dải; tổng các cột luôn khớp sĩ số thật (đã sửa lỗi đếm theo câu hỏi)", "6ac24402-79c4-4e60-85b2-9d8583e957e6": "Bản đồ nhiệt năng lực (masteryAnalytics) · Tương tác & chuyên cần (engagementAnalytics) · Phân tích câu hỏi (questionAnalytics) · Hồ sơ học sinh (studentProfileAnalytics)", "e4a68427-dc48-421a-af3e-b14f7c2061ed": "Tên lớp tra theo danh sách thật ở cả 3 nơi — không in UUID, không bịa tên lớp", "b0dfac32-efbe-4e78-92fa-ead2a4a67078": "Toàn bộ biểu đồ tính từ dữ liệu thật (điểm danh, nhật ký XP, kết quả câu hỏi, bước đã học); tuần không có điểm thì để trống — hết số bịa (13/18, 7.5đ, 82%, chuỗi 78→91%…)", "927ec46f-3442-48dc-8132-805fb828abce": "TRỢ LÝ PHÂN TÍCH AI (22/10, giai đoạn 1 — tab đầu tiên của Phân tích): giáo viên hỏi bằng lời thường; Gemini chọn 1 trong 6 công cụ truy vấn (tổng quan lớp / so sánh chủ đề / phổ điểm / phân tích câu hỏi / hồ sơ học sinh / hoạt động học tập), hệ thống chạy ĐÚNG các hàm tính của các tab cố định trên dữ liệu thật rồi AI mới diễn đạt + đề xuất bước tiếp theo + gợi ý câu hỏi nối tiếp; quy tắc cứng: số do code tính (AI không tự sinh số), mẫu quá ít thì nói rõ 'chưa đủ dữ liệu' thay vì kết luận, AI không tự giao bài/đổi điểm; biểu đồ do AI khai báo loại/trục qua công cụ riêng nhưng số liệu lấy nguyên văn từ kết quả công cụ; chưa nhập khóa Gemini (ở Cài đặt) thì hiện hướng dẫn — không trả lời bịa; KÈM BONG BÓNG CHAT NỔI ở góc phải dưới cổng giáo viên: mở trợ lý ngay từ mọi màn hình, dùng chung bộ lọc của trang Phân tích, đóng/mở không mất hội thoại. LỊCH SỬ CHAT LÀ MỘT KHO DÙNG CHUNG (assistantChatStore): tab và bong bóng cùng một cuộc trò chuyện, lưu bền trong trình duyệt (tối đa 80 tin), có nút xóa lịch sử ở ô nhập", "e7daa8e5-5c39-4fb0-b0e9-2f5a0b6c8782": "Đã nối lại dây ngân hàng câu hỏi vào Phân tích (22/10): cổng giáo viên nay nạp và truyền ngân hàng câu hỏi thật xuống màn Phân tích — trước đó tab Phân tích câu hỏi và tra cứu trong Hồ sơ học sinh luôn nhận ngân hàng rỗng nên hiện 0 dù kho có 27 câu", "fba3ca5a-5d6e-4115-b938-4fbd1052840a": "1.9 Cài đặt", "f16cbb41-b70f-4d36-9e29-72a020935eb9": "Cấu hình ngưỡng XP — kiểm tra thứ tự ngưỡng, chặn giá trị 0 / trống trước khi lưu", "9d892e6b-23e9-497a-831d-ad6c9b7cde53": "Mô hình Mầm AI: chọn model Gemini; cảnh báo API Key đang lưu trong trình duyệt", "abf6445b-2dbb-43f5-8369-93b50f2eeb92": "Đổi mật khẩu: kiểm tra mật khẩu hiện tại + lưu thật", "2b3ca365-bd31-4d36-afb1-d8cc61d92d8e": "Cỡ chữ hiển thị (Chuẩn / Lớn 112% / Rất lớn 125%) — phóng toàn cục theo đúng tỉ lệ", "0153643f-ec76-4330-90b8-885201251679": "Đã gỡ khu vực 'Đặt lại dữ liệu demo' khỏi bản khách thật", "8e4d8721-00be-4e60-a9fe-19683e9f81c5": "2. HỌC SINH", "5ed91d02-0fa4-4bce-925b-04186991c029": "2.1 Trang chủ", "fda2c4df-a1fc-4f2f-9263-235e17cfc11b": "Lời chào theo hồ sơ thật (đúng tên, đúng lớp) — học sinh mới bắt đầu TRẮNG, không thừa hưởng tiến độ mẫu", "2a29f90b-657c-4e94-aceb-c6f678227d24": "Chủ đề học kỳ này: thẻ cao đều nhau, chân thẻ ghim đáy ('X bài giảng · Vào học')", "345a8063-4a92-4926-aacf-3e8e5d795348": "Điểm danh mỗi ngày (nhận XP theo mức giáo viên cấu hình)", "689ed4d2-f132-404a-968f-299ba331bd04": "Biểu ngữ bài mới nhất chưa đọc + nút 'Vào làm ngay'", "5567443e-6447-4580-85d1-ab349606894f": "Gợi ý bài học tiếp theo", "97dae6ee-0d87-47c1-b18f-f485b603e150": "Tiến độ năng lượng học tập hôm nay (phút học tích cực / XP hôm nay — không còn trần)", "7bf8e7ec-0b95-4260-a7b1-61d92396a7dc": "Khu Bài tập về nhà – Bài kiểm tra – Bài luyện tập", "ad3f65b6-9ed5-490b-a768-4e243ac15e36": "Mục 'Bài tập được giao' (bài tập độc lập giáo viên giao riêng cho lớp/từng em): bấm vào mở MÀN LÀM BÀI thật — trả lời từng câu (trắc nghiệm chọn ký tự A–D, điền khuyết, tự luận), đồng hồ đếm ngược và tự nộp khi hết giờ nếu bài có giới hạn; nộp bài ghi attempts + attempt_answers, thấy ngay điểm phần tự chấm, câu tự luận báo 'chờ giáo viên chấm'", "fde78304-ad75-462f-bf25-e57e19185256": "Cần ôn lại (các chủ đề yếu)", "6f6d5cfd-7e20-4a80-9a71-cda8ef68c189": "Rương quà bí mật (gợi mở sang mục Đổi quà)", "899dff20-0e2a-4bf9-95ba-a509de6372e7": "Xem trước Cây tri thức", "a161a747-521d-4d16-b162-883abd526876": "2.2 Học bài", "139ff5f9-76ab-44f2-9cb0-25ea2ba4bb72": "Danh sách chủ đề → chọn bài Video hoặc Lý thuyết chi tiết", "9e3d51fd-237a-42c8-839f-ee8f237b565b": "Tab 'Luồng học' (MẶC ĐỊNH): các bài trong chủ đề hiện thành 1 danh sách theo ĐÚNG flowOrder giáo viên đã xếp trên dải nút tròn (số thứ tự + icon loại + tiêu đề), bấm vào mở đúng bài — kể cả Bài tập; 2 tab 'Xem video' / 'Lý thuyết chung' giữ nguyên để lọc theo loại", "8ae4355a-12ba-40fd-a1be-bc249044466a": "Học dở được khôi phục đúng bước đang học (khóa bước ổn định — không bắt đầu lại từ bước 0)", "b343c785-ff08-4de8-aae6-3d3f2d515630": "2.3 Luồng Video — tổng 48 XP", "99446437-b9d0-4caa-bfe2-a01418865de4": "Bước 1: Xem video đạt 80% → +5 XP", "403f228f-4ecd-4df4-9723-731af179ed66": "Bước 2: Đọc lý thuyết tóm tắt (các ý trọng tâm) → +2 XP", "b874133b-7fd6-48e6-8c68-1a43668f9ef5": "Bước 3: Bài luyện tập → +5 XP", "bf4904ef-4dcf-4a34-a26a-450436ba0668": "Bước 4: Kiểm tra nhanh → +8 XP", "80befa33-d8e9-4463-b88b-3d03574b4d18": "Bước 5: Mastery Check → +8 XP", "e3fa88d9-4843-4f81-a7c8-7ae263f5e492": "Bước 6: Hoàn thành toàn luồng → +20 XP", "1c948c78-8c06-44be-b65c-39c5954c9c7b": "2.4 Luồng Lý thuyết chi tiết — tổng 41 XP", "97c70199-e686-478b-88db-2db8f852693d": "Bước 1: Đọc hết khối nội dung (đủ thời gian đọc tối thiểu) + xác nhận đã hiểu → +10 XP", "b7eb566c-fe51-4d10-abb1-fcbc8a9a6ff4": "Bước 2: Bài luyện tập sau lý thuyết → +5 XP", "ad149816-011f-4e1f-befa-d30451198ec3": "Bước 3: Bài kiểm tra lý thuyết 1 → +8 XP", "023be389-8b0f-4dd6-ad33-8c0d2abb45f5": "Bước 4: Bài kiểm tra lý thuyết 2 → +8 XP", "1b279255-7f48-47a9-bd74-801e81f684d5": "Bước 5: Hoàn thành toàn luồng → +10 XP (trước đây bị thiếu — đã cộng đúng như cấu hình hứa)", "b7cbfc82-3b4e-4b78-a5e0-a8de0185be9d": "2.5 Làm bài (QuizRunner — dùng chung cho mọi loại bài)", "eaa77a81-f6f7-4adf-a197-7ad9b9661e47": "4 dạng câu: Chọn 1 đáp án / Chọn nhiều đáp án / Điền vào ô trống / Tự luận", "1a966361-a8df-4097-942e-7af628b4e179": "Đồng hồ đếm ngược theo thời lượng bài; HẾT GIỜ TỰ NỘP phần đã làm (đã sửa lỗi nộp bài trống)", "6f8503fa-4010-48dd-a990-56dead9150d4": "Hộp xác nhận nộp bài: báo số câu chưa trả lời; chống nộp 2 lần", "a1388e4f-8c2c-43d7-ad21-a35f6f4cb846": "Bài có câu điền khuyết không còn chết im lặng khi nộp: đáp án được chuẩn hóa về dạng danh sách; lỗi lạ thì báo rõ + mở lại nút nộp để nộp lại", "5df399ed-48b5-4a30-ae3d-1e7675f9f3c0": "Màn hình KẾT QUẢ sau mỗi quiz: điểm /10, XP THỰC NHẬN, xem lại từng câu với đúng câu hỏi đã làm (kể cả câu do GV/AI tạo)", "7c9704e5-d34a-4965-ab53-7fffbee17d50": "Câu tự luận → tạo bài nộp mang đúng mã học sinh → vào hàng đợi chấm của giáo viên", "fdbeed87-c09d-4e04-be4c-7ba9e7be2b32": "Bài tập về nhà / bài trong chủ đề hoàn thành → nhận XP theo đúng số XP giáo viên cấu hình trên bài (mô hình XP mới 22/10; nộp bài được giao độc lập cũng vậy)", "6c1f2eac-1976-4ab4-b2bf-81d9c8c2e7ce": "Ôn lại phần yếu: chỉ ghi nhận tiến độ, không cộng XP lẻ (mô hình XP mới 22/10 — XP chỉ từ điểm danh, quỹ chủ đề và bài kiểm tra)", "f8ac39f0-a08a-4049-ad73-96eb1f37fb8e": "2.6 Cây tri thức — Vườn Văn Mầm Mục", "b2aed721-e66f-4a71-a331-30494c038665": "6 giai đoạn theo số bước học đã hoàn thành", "668d80ee-ff96-4409-95dc-e0ae9036edfa": "Hạt mầm (0 bước)", "1fa6017b-5e4c-4b7c-a3f9-06ed1915a92c": "Nảy mầm (3 bước)", "95f48dfc-1c71-464b-bf2f-55160b9e4ba3": "Chồi non (8 bước)", "6f5105d8-c5e9-497b-917c-303f694ca6b4": "Cây con (18 bước)", "61ef8585-d85c-402c-8a4b-a08d72df18ec": "Cây ra hoa (32 bước)", "50d1eb2b-680a-4006-a7f1-9dbd73de0e7e": "Cây kết trái (50 bước)", "2b3a58b2-8084-483d-be0c-56deb9824a20": "Tưới nước: mỗi bước học tạo 'Nước tưới Mầm Mực' nuôi cây lớn", "19a4f8ca-b22c-48ea-a24d-2d9555826b8c": "15 vị trí lá trên tán cây", "2b6fab9f-ee3e-46e1-a89c-eea8f317dd31": "4 lá chính đầu tiên = 4 chủ đề đầu trong thứ tự khóa học (lá to, có nhãn tên)", "4897ef11-c989-41bf-98dc-bd61c6efa63b": "Từ chủ đề thứ 5: hiện ở 11 'lá ẩn' còn lại (lá nhỏ hơn, rê chuột xem tên + %)", "2a5374cf-b71c-4e44-80c0-3d6ba0009351": "Màu lá: Hoàn thành ≥80% = xanh lá đậm · Đang học 50–79% = xanh biển · Cần ôn lại <50% = vàng · Chưa học = xám (có hàng chú thích)", "64b2f35f-7793-4c8a-9d5d-390c4edd7374": "Hiệu ứng NHẤP lá đã hoàn thành: lá lún xuống như bị ấn vào tán cây + vòng sáng lan tỏa", "b61d87dd-4c6d-437d-8a10-14e09a68825b": "Ma trận năng lực: từng chủ đề × 4 năng lực", "3f03a3a9-17f6-424a-ba4f-4bfc951b7e33": "Huy hiệu đạt được", "d8726265-2310-4fa7-b62b-21173a3b115d": "2.7 Kết quả học tập", "cc4af206-9433-4cb7-811c-423483d0dfb8": "Thẻ tổng quan: Tổng XP tích lũy (+ XP hôm nay) · Huy hiệu đạt được — đã bỏ 2 thẻ 'Câu hỏi đã làm' & 'Điểm trung bình'", "453a47bf-c98c-455f-a9ee-6db01f41bf69": "Điểm theo từng chủ đề", "e4a5a44e-8150-4795-bebc-f92893348f7c": "4 thanh năng lực (%) + điểm trung bình + trạng thái: Đã hoàn thành / Đang học / Cần ôn lại / Chưa học", "0fb2a0b6-5b44-4276-af8a-3856e5b489bb": "Khối chủ đề nhuộm nền + viền theo đúng màu của chủ đề đó", "48da65a8-9119-4774-a60f-7453139a1c20": "Bấm tên chủ đề → tới bài học", "97e2a278-0c93-4968-8ae2-a02af5793d25": "Dùng chung hàm calculateAllMastery với Cây tri thức — số liệu nhất quán", "9108957f-cf32-4e28-9798-1498206fb9da": "Biểu đồ tiến bộ 6 tuần — dạng ĐƯỜNG MỐC TUẦN", "96cd6c3b-de38-4d3f-9012-0092cb5c3f9a": "Mỗi mốc là vòng tròn chứa điểm trung bình của tuần; tuần này to nhất, viền cam nổi bật", "3072ee56-a28b-4922-a078-456a863382ec": "Tuần chưa học hiện mốc xám 'Chưa học' thay vì biến mất", "b3b3d4c5-3d00-4c19-a1bf-60ee57c66c51": "Nhãn tuần dễ hiểu ('Tuần trước', '2 tuần trước'…) + số câu đã làm dưới mỗi mốc", "8b896607-714c-4842-8ace-c7707b2472ff": "Góc phải thẻ: tổng số câu + điểm tuần này", "cf41c3f7-d57b-4933-a855-fbe57964a30d": "Thành tích & huy hiệu: toàn bộ danh mục, phân biệt đã đạt / chưa đạt", "daf17e14-2303-428d-a7d5-eea550d42841": "2.8 Đổi quà", "88a70341-527c-4c8d-8ab0-4253cced069e": "Ví chi tiêu = TỔNG XP của tài khoản (vĩnh viễn — chỉ giảm khi xin quà); MỐC MỞ RƯƠNG xét theo XP TUẦN + số ngày điểm danh (quyết định chốt của chủ dự án)", "caafa86c-2e52-432b-9e85-996d5adb8495": "Các rương theo cấu hình: Rương Hạt / Rương Lá / Rương Hoa / Rương Vàng", "ac6df5ee-fa74-42e6-8c3a-342846d4481a": "Danh mục quà thật (XP / ngày điểm danh yêu cầu)", "dfc8994b-ffcd-48d6-8151-0528797ffb7c": "Bookmark Mầm Mực thủ công — 280 XP · 4 ngày", "7dd32ec4-8d37-49fe-af91-4399d6bd2f7f": "Quyền chọn bài đọc cho cả lớp — 320 XP · 4 ngày", "dd313e4c-835d-45ac-af81-5f70e23ce250": "Bút mực xanh Giấy & Mực — 450 XP · 5 ngày", "586f2072-922e-4066-abfa-02a0d9f9de82": "Sổ tay Giấy & Mực bìa cứng — 650 XP · 5 ngày", "306ec4b3-a5e0-4a8d-b555-067b5afdff56": "Rương Vàng: Bút mài nét hoa & Bộ quà lưu niệm Mầm Văn — 750 XP · 6 ngày", "39ffb00e-6a41-40b4-a004-73081e68ae5c": "Nội dung quà thuộc loại 'secret' — học sinh không được biết trước bên trong có gì", "2b94e313-98ae-4360-b26d-652bf1f3b284": "Gửi yêu cầu: TRỪ NGAY vào Tổng XP (ghi deductedXp); chặn khi Tổng XP không đủ; chặn gửi trùng khi đang có yêu cầu chưa bị từ chối", "ac9348d6-47f7-4509-a2e3-4cc0f426b7da": "Trạng thái: Chờ duyệt → Được duyệt → Đã trao → Đã mở", "0ba58fb2-f9a2-4e33-9a62-47c8200d4c89": "Bị từ chối → HOÀN 100% XP đã trừ vào Tổng XP", "6d320c2a-d61d-4bb9-9a60-81939597cfb9": "2.9 Hồ sơ", "c44239d9-0b62-415d-aaab-0cd703356fb9": "Thông tin tài khoản học sinh", "6b54ab87-b72a-4127-9310-6bdbab64cf1f": "Thẻ dưới chân thanh điều hướng: TỔNG XP tích lũy là số chính, XP hôm nay ở dòng nhỏ bên dưới", "2937c7da-638d-4322-8e50-526a54dc0db7": "Cỡ chữ hiển thị (phóng toàn cục 112% / 125%)", "01da9d22-3276-4e08-bb13-50ed1124f7b5": "Đăng xuất — xóa sạch phiên, kể cả phiên đang đóng vai", "760fe02a-f9d9-4d3e-8554-1c00a8c0717e": "2.10 Thông báo bài mới", "efde7181-00d8-48a0-a451-be970faa9d0b": "Chuông thông báo trên thanh điều hướng (máy tính + điện thoại) + huy hiệu đỏ đếm số chưa đọc", "2e5e64c9-616f-4888-b91a-c33dc9202d67": "Danh sách kiểu tin nhắn: loại bài + tiêu đề + chủ đề + thời gian; bấm vào là vào làm bài đó ngay", "7bc558b7-c6fc-47a2-88cc-771a955e84b3": "Thông báo suy ra từ mốc xuất bản thật của nội dung: trong vòng 14 ngày, đúng lớp được giao", "e5ae3c0b-b887-4c4f-bca3-4c63c49b85e6": "Trạng thái đã đọc lưu THEO TÀI KHOẢN → đồng bộ mọi thiết bị (thay cơ chế cũ chỉ lưu trên máy giáo viên)", "822b207a-a86b-4131-ad44-ede335809df2": "3. ADMIN", "f3e32e28-b444-449a-9e7b-b1bb03aa922f": "Quản lý tài khoản giáo viên: danh sách, tạo mới (họ tên, tên đăng nhập, mật khẩu, liên hệ, ghi chú), sửa thông tin", "e338ad45-4e7f-42dc-a6ca-2a876cf89606": "Tạm khóa / Mở khóa tài khoản giáo viên", "ecb7792e-a842-408d-9854-a9d5e52a79d7": "Xóa tài khoản giáo viên", "4001c42b-357b-40b8-b40d-788a528206bf": "'Truy cập với tư cách Giáo viên này' — đóng vai GV để hỗ trợ", "3be4e66d-c913-4931-9ebc-b99968963cdd": "Tải lại danh sách · Đăng xuất khỏi Cổng Admin", "1472460e-f7df-494f-9c19-9874b52fb6e2": "ĐÃ VÁ 21/10: đăng nhập Admin dùng tài khoản THẬT trong DB (bảng teachers, role='admin' — migration_006); đã gỡ thông tin cứng khỏi cả 2 đường Supabase + mock và bỏ bí danh cũ; cổng Giáo viên chỉ nhận role='teacher'", "10827bea-017d-464d-a868-cc22a4dc3c3c": "4. HỆ THỐNG & DỮ LIỆU (dùng chung)", "c44e3e0a-7f98-44c3-8f60-af4c5b6ac1a4": "4.1 Đăng nhập & phiên", "224230df-84ba-4e4a-ae7a-6b91b7851f80": "3 vai trò: Học sinh / Giáo viên / Admin — đăng nhập bằng tên đăng nhập + mật khẩu thật trong DB", "d4b18bef-9ddc-4f5a-9563-699988629000": "ĐÃ XÓA cửa hậu mật khẩu phổ thông ở cả 2 kho dữ liệu (trước đây mọi tài khoản vào được bằng mật khẩu mặc định, kể cả sau khi chủ tài khoản đã đổi mật khẩu khác)", "b61cb053-9ea7-42f5-bf68-69ec762519b2": "Lỗi đăng nhập báo rõ; không còn gợi ý mật khẩu trong thông báo lỗi", "f60d25a5-cb09-49fc-ab76-2743ca776a1d": "ĐÃ VÁ 22/10 — hết 'phiên ma' sai danh tính: máy chủ lỗi/thoáng chập thì đăng nhập BÁO LỖI KẾT NỐI, tuyệt đối không rơi về tài khoản mẫu (trước đây cùng mật khẩu là vào được hồ sơ mẫu khác tên/khác lớp); phiên mẫu đã lưu (id không phải UUID) bị hủy khi tên đăng nhập tồn tại trên máy chủ; nạp state học sinh tra thẳng dòng tài khoản thật để tên + lớp luôn đúng người", "03eb46fb-dd5e-4736-8716-c5c2d79aea0b": "'Xem góc Học sinh' cho GV/Admin: lưu phiên gốc, thanh cảnh báo cố định + nút 'Thoát xem thử' quay về đúng phiên", "0ed414f0-deec-47af-9426-ddabbfef85b5": "Đăng xuất xóa cả phiên đóng vai — hết đường leo quyền trở lại", "daa9f780-bb31-4a86-b616-44269cc24a22": "Bộ đếm giờ học tích cực chỉ chạy khi người dùng thật là học sinh", "1897dd1a-a69d-490f-a62c-befb7856c0f9": "4.2 Máy XP (xpEngine)", "611eebff-0c7a-445d-941d-cf40327975b0": "XP phẳng theo HOÀN THÀNH — không gắn với điểm số (quyết định chốt của chủ dự án)", "f0c575df-6caf-4ce0-856a-53665010741b": "awardXP lật ngày / tuần theo GIỜ ĐỊA PHƯƠNG: ngày mới từ 00:00 giờ VN (đã sửa lỗi ngày UTC bắt đầu 07:00 khiến điểm danh 2 lần trong một buổi sáng); khóa tuần theo thứ Hai", "2760ffeb-5d24-4f2f-939d-ee6b13d8f017": "MÔ HÌNH XP MỚI (22/10/2026 — chủ dự án chốt): XP chỉ còn 3 nguồn — ĐIỂM DANH NGÀY (số XP giáo viên cấu hình, là mục duy nhất còn lại ở màn Cài đặt), QUỸ XP CỦA CHỦ ĐỀ và XP CỦA TỪNG BÀI KIỂM TRA / BÀI ĐƯỢC GIAO", "7ba240a8-e5fa-4267-acd8-83795dc421a2": "Quỹ XP chủ đề: giáo viên đặt số XP ngay trong cửa sổ Chỉnh sửa chủ đề (xpReward trong payload chủ đề); học sinh nhận ĐỦ đúng 1 lần khi hoàn thành TOÀN BỘ chủ đề — xem trọn luồng video, học xong lý thuyết, làm ĐÚNG HẾT phần chấm tự động của mọi bài trong luồng (câu tự luận không chặn điều kiện); bộ đánh giá topicCompletion chạy ở App sau mỗi thay đổi tiến độ học", "312ada77-8d2c-41ad-b2e3-0ddae1c18603": "XP bài kiểm tra / bài được giao: học sinh NỘP BÀI LÀ NHẬN (không xét đúng sai), 1 lần mỗi bài — bài độc lập lấy cột xp_reward trên chính bài (migration_010, nhập trong màn soạn bài), bài trong chủ đề lấy ô 'Điểm thưởng XP khi hoàn thành' ở Cài đặt bài của QuizBuilder", "18161b4f-295d-47f2-a726-9d47bbdd5417": "ĐÃ BỎ HẾT: trần XP ngày theo phút học (130/150), trần tuần 900 và toàn bộ cộng XP lẻ theo hành động (xem video 80% = 5, đọc tóm tắt = 2, luyện tập…); các bước học trong luồng Video/Lý thuyết giờ chỉ GHI NHẬN hoàn thành (recordStepCompletion) phục vụ Cây/Năng lực và điều kiện quỹ chủ đề; màn Cài đặt XP rút còn Điểm danh ngày; trang chủ học sinh bỏ hiển thị trần ngày", "2380a66f-e8a4-43fe-ad38-8de516e96eb8": "Tách 'tiến độ học' khỏi 'đã trả XP' (xpAwardedSteps) vẫn giữ: mỗi khóa XP (attendance:<ngày> / topic:<id>:complete / assignment:<id>:submitted / quiz:<id>:completed) chỉ trả đúng 1 lần — hết lỗi 'từ ngày thứ 2 mọi lần cộng XP đều trả về 0'", "81da69de-1928-42d4-8828-f84c7abe6c9c": "4.3 Kho dữ liệu 2 lớp", "37e9bcaf-f499-4a66-b4dd-73ca416b3e2e": "Supabase (PostgreSQL) là kho chính — 22 bảng: 12 bảng vận hành (học sinh, giáo viên, lớp, chủ đề, video, lý thuyết, quiz, câu hỏi, bài nộp tự luận, state học sinh, yêu cầu quà…) + 10 bảng tiến độ/phân tích thêm ở migration_008 (luồng học, nối hoạt động–câu hỏi, bài độc lập, nối bài–câu hỏi, giao bài từng em, lượt làm bài, câu trả lời, phiếu chấm, phiên đăng nhập, bảng ngày)", "841f8805-8ae6-4dff-bffd-d902a74a6f34": "Tách dữ liệu RIÊNG theo giáo viên (21/10, migration_007): mọi nội dung gắn teacher_id của người tạo; đọc/ghi nội dung, ngân hàng câu hỏi, chấm bài và thống kê đều lọc theo giáo viên của phiên đăng nhập; bộ nhớ đệm trình duyệt được dọn khi đăng xuất và chỉ nhận dữ liệu mang dấu chủ của đúng tài khoản — hết cảnh các giáo viên thấy/dùng chung dữ liệu của nhau", "fdda024b-eefe-4758-8e5c-cd9b9404fdcf": "Kho mock (localStorage) làm dự phòng khi mất kết nối: đọc GỘP dữ liệu 2 nơi (bài nộp, học sinh, lớp) để không bao giờ thất lạc dữ liệu", "7b5c8925-ecdb-4b40-b044-5ac5ae465d12": "Cổng chặn ghi state: chỉ lưu sau khi state THẬT của đúng học sinh đã nạp xong — hết lỗi state mẫu (310 XP, huy hiệu sẵn) ghi đè lên DB", "e6cc7d07-2603-4b9a-ab43-28e83061f1a5": "ĐÃ XÓA SẠCH DỮ LIỆU MẪU (22/10, rà soát toàn diện theo lệnh chủ dự án): file mockData.ts (1.038 dòng) bị xóa hẳn; MỌI màn hình hết dự phòng bằng dữ liệu mẫu — Học bài/thẻ video không gộp bài mẫu, video/lý thuyết không thấy thì báo không tìm thấy (không thay bằng bài khác), làm bài/kết quả/BTVN chỉ dùng câu hỏi + bài thật; state khởi tạo là state TRỐNG (0 XP) thay cho state mẫu 310 XP; kho local hết tự gieo state mẫu; tính năng 'Đặt lại dữ liệu demo' bị gỡ; phân tích học sinh hết bịa 'đáp án đã chọn' (hệ thống không lưu lựa chọn — chỉ hiện đáp án đúng khi tra được câu thật); kho bài tự luận tra đề thật từ bảng questions. Bổ sung cùng ngày: bảng điểm nội bộ hết gán nhãn lớp bịa '7A3' (điều kiện cứng thời demo) — tên lớp tra từ danh sách lớp thật/hồ sơ học sinh; xu hướng điểm tuần bỏ chia đôi theo 2 lớp demo. Mọi con số trên màn hình đều truy được nguồn trong DB; còn cấu hình cứng duy nhất là catalog quà/huy hiệu + cấu hình XP mặc định (định nghĩa sản phẩm). ĐỢT BỔ SUNG CHIỀU 22/10 (quét lại các file đợt sáng chưa chạm): thẻ Tổng quan hết '+15%' bịa khi không có kỳ trước (không có dữ liệu so sánh thì ẩn huy hiệu), mẫu số tỉ lệ hoàn thành = tổng bước học THẬT của các chủ đề (video + lý thuyết + bài; cổng GV nay nạp thêm danh sách bài), thời gian học TB chỉ tính giây hoạt động ghi thật (bỏ 'mỗi ngày điểm danh = 30 phút' và phép chia 6 tuần); Phân tích câu hỏi bỏ hẳn 'đáp án nhiễu được chọn nhiều nhất' (hệ số 0,65 bịa — dữ liệu không lưu đáp án HS chọn) và thời gian làm bài gán cứng 140/45 giây theo mức; Xưởng chấm AI hết gieo bài mẫu chấm sẵn + rubric mẫu (thư viện mặc định RỖNG, chỉ hiện dữ liệu GV tự tạo) và xóa hẳn nhật ký kiểm toán mẫu; state khởi tạo hết mặc định lớp bịa 'Lớp 7A2' + trường cứng (không tra được lớp thật thì để trống) cùng mọi fallback tên lớp '7A2' còn sót ở kho dữ liệu/màn hình; Cài đặt gỡ hẳn các trường trần XP đã bãi bỏ (130/150/900) khỏi mặc định + kiểu dữ liệu + hằng cấu hình và trung tính hóa tên trường/lớp mặc định bịa (cài đặt vẫn lưu trong trình duyệt theo từng GV — chưa chuyển lên bảng system_settings)", "e6521774-e2fc-4605-8c2c-86c80f33841c": "Học sinh mới bắt đầu TRẮNG với hồ sơ thật (đúng tên + đúng lớp) ở cả 2 nhánh đọc state", "5f0ceb65-9143-40b1-a472-a673b428f456": "useLiveQuery + eventBus: đồng bộ tức thời giữa các màn hình theo đúng khóa sự kiện (quiz / content / class…)", "221e9fa5-f6d0-4743-a0ba-df4caf35851f": "Migration chờ chủ dự án chạy trong Supabase SQL Editor: 003 (trạng thái quà GIVEN/OPENED) + 004 (cột payload giữ đủ trường câu hỏi) — app đang chạy chế độ tương thích an toàn trong lúc chờ", "50a4acda-f3fa-41ab-a84c-61a0aa4bbec8": "Đã sao lưu toàn bộ 12 bảng trước khi dọn dữ liệu test: xóa 21 HS test + 15 bài nộp test; giữ lại hs001, 5 giáo viên, 4 lớp, toàn bộ nội dung thật (6 chủ đề, 97 câu hỏi, 33 quiz, 19 video, 6 lý thuyết)", "f28e6f01-e07a-4011-b855-64fb85843d9a": "4.4 Giao diện & hiệu năng", "8404d998-42e9-4bcf-806e-141246a22212": "Mọi hộp thoại xác nhận dùng ConfirmDialog giữa màn hình (6 chỗ từng dùng hộp thoại mặc định của trình duyệt đã thay hết)", "1cc4f93d-0981-4b76-9a13-7f39f76f8397": "Nút điều hướng tự nhả focus sau khi bấm — hết vòng đen focus bám trên nút menu", "3486a1e3-878f-497a-a055-42f7919dd9a4": "Tải lười (React.lazy): gói JS ban đầu 2,37 MB → ~0,79 MB; phần giáo viên (~1,08 MB) và thư viện biểu đồ (~0,39 MB) chỉ tải khi vào đúng khu vực", "7ff15df9-500d-4a07-bf9d-57e9c129b745": "DevPanel (cộng XP / tự duyệt quà / tự chấm 9.0 / đặt lại dữ liệu demo) CHỈ có ở bản development — đã kiểm chứng bị loại khỏi gói production", "1919edd4-0c20-4101-9fb9-0b863456ab87": "5. KHUNG ĐO NĂNG LỰC (từ sơ đồ gốc của chủ dự án — đã có dữ liệu đỡ)", "6fb2b745-4543-43a0-a539-ee4fb254a8fb": "Mỗi lần làm bài xong, đo được từ học sinh: điểm theo câu / chủ đề, năng lực, độ khó, tỉ lệ đúng, thời gian", "a7d7448e-c9da-4de2-8d5e-26257276b9e4": "4 năng lực × dạng đo × độ khó", "c6ac4665-43ef-4e5c-b987-712b71825c1e": "Nhận biết → Trắc nghiệm — Dễ", "56c42038-43c5-4e59-8547-151b4d83fad7": "Thông hiểu → Trắc nghiệm — Trung bình", "b0d328ab-e1a5-4c76-935a-5b9a36597984": "Phân tích → Trắc nghiệm — Khó · Tự luận chấm Rubric — Khó", "f456f0c9-55d3-4f84-b6ce-c50f414f5f18": "Vận dụng → Tự luận / viết văn (đoạn 5–7 câu, bài 150–200 chữ) chấm Rubric — Khó", "d150a706-f26b-4eb4-983f-4d8f02d7a220": "Biểu thị khách quan: % thành thạo từng năng lực theo chủ đề (calculateLevelMastery / calculateAllMastery) + trạng thái Vững / Đang tiến bộ / Cần ôn lại / Chưa học", "2dbcf315-4366-42b5-8163-0cb0f95da32c": "Dữ liệu nền cho phân tích", "06bfc0de-8041-40bc-84fd-9e3ada491fcc": "Đăng nhập & chuyên cần: có thường xuyên vào học không, ai ít đăng nhập (điểm danh + phút học tích cực theo ngày)", "89c73668-5bc4-40a0-b673-81c07b10de15": "Năng lực qua bài tập: kết quả từng câu gắn năng lực + độ khó", "796727b9-94c9-4faa-b526-f0e09b984199": "Dữ liệu tiến độ tường minh (migration_008, nạp từ dữ liệu giả lập Power BI 21/10): phiên đăng nhập thật theo ngày/thiết bị/thời lượng, lượt làm bài + từng câu trả lời (đáp án đã chọn, thời gian làm), phiếu chấm — hiển thị ở màn giáo viên 'Tiến độ bài làm' và mục 'Bài tập được giao' ở trang chủ học sinh", "cdb4afab-e60f-4c95-8489-fe549ff1c885": "Đầu ra đã nối chung 1 hàm tính: Kết quả học tập của học sinh · Ma trận năng lực ở Cây tri thức · Phân tích của giáo viên", "92c43488-05df-4d9e-bf77-4cdc17cd35b0": "6. KIỂM CHỨNG & TRẠNG THÁI DỰ ÁN", "c536f3c7-2e11-4c4d-90a5-fd94de05428a": "Cổng TypeScript trong lệnh build (tsc --noEmit && vite build): 18 lỗi type ban đầu → 0 lỗi", "68d038d3-5586-47e2-8a8e-09c896eace08": "Test logic tự động scripts/test_round2_logic.ts: 35/35 đạt (XP, lật ngày/tuần, đổi quà trừ TỔNG XP + hoàn khi từ chối, sinh tên đăng nhập / mã HS)", "2f6b3b42-e372-4ff2-80e9-86447617650c": "Đợt 0–6 + QA vòng 2 + các đợt tinh chỉnh ngày 18/10: đã đẩy nhánh dev (81c8bc1) và deploy production https://mamvan.vercel.app", "138b2bda-e148-4089-8f86-e1c3cbdd4a1e": "Đợt bảo mật 21/10 (theo audit): vercel.json thêm header bảo mật production (CSP, X-Frame-Options SAMEORIGIN, CORS thu hẹp về mamvan.vercel.app, nosniff, Referrer-Policy, Permissions-Policy, HSTS) + gỡ email hardcode khỏi TeacherTopbar — commit 1eb682d, đã deploy và kiểm chứng header trực tiếp trên production", "87735cc0-1fdf-4217-b6e0-290af90f755c": "Đợt Admin thật 21/10: gỡ đăng nhập Admin ghi cứng khỏi mã nguồn (repo công khai) — Admin thành tài khoản thật trong bảng teachers role='admin' (migration_006_admin_account.sql), cả 2 đường Supabase + mock đều tra cứu tài khoản thật; ĐÃ chạy migration_006 vào DB + deploy production + kiểm chứng 3 ca đăng nhập trên production tối 21/10 (admin thật vào được Cổng Admin, bí danh cũ bị báo không tồn tại, sai mật khẩu bị từ chối)", "f7630cb3-37f5-4080-a252-b07d27109532": "Đợt tách dữ liệu theo giáo viên 21/10 (GĐ1 của kế hoạch xóa DB + nạp dữ liệu giả lập): migration_007 ĐÃ chạy vào DB thật (thêm teacher_id cho video/lý thuyết/quiz/câu hỏi + gán nội dung vô chủ về gv004, 0 dòng còn thiếu chủ); code đã vá 8 điểm rò (lọc đọc theo chủ, đóng dấu khi ghi, cache theo tài khoản + dọn khi đăng xuất, cài đặt riêng từng giáo viên, bỏ gộp câu mẫu dùng chung) — kiểm chứng A/B 2 tài khoản trên production ĐẠT tối 21/10 (giáo viên B không thấy bất cứ dữ liệu nào của A ở cả 3 màn, học sinh của A thấy đúng nội dung A xuất bản)", "be2c29ab-1b6e-43b6-997b-3181d3c6d532": "Đợt LUỒNG HỌC TRONG CHỦ ĐỀ 22/10 (kế hoạch đã duyệt kèm 7 ảnh chụp của chủ dự án): bỏ tự sinh video nháp khi tạo chủ đề (+ xóa 2 video nháp ma ở chủ đề 'Văn 7' khỏi DB) → menu Tạo mới hợp nhất 3 loại (sau rút còn 3 vị trí — bỏ nút góc trên trang — và bài mới chèn ngay sau bài đang mở, theo phản hồi bố cục của chủ dự án) → thêm flowOrder vào bản ghi chủ đề (logic/flowOrder.ts) + DẢI LUỒNG HỌC nút tròn kéo–thả (TopicFlowStrip) ở đầu khung phải, cây chủ đề hiển thị hợp nhất theo luồng → học sinh có tab 'Luồng học' mặc định học theo đúng thứ tự → QuizBuilder tạo mới mở Cài đặt bài trước", "28cee57f-f8be-4e0f-83de-c88bdc1fc6ff": "Đợt BÀI TẬP ĐỘC LẬP DÙNG THẬT 21/10 (theo yêu cầu chủ dự án sau nghiệm thu): nút 'Thêm bài tập & đánh giá' ở cây chủ đề + form tạo bài (AssignmentBuilderModal — đã thay bằng mục riêng + màn soạn AssignmentEditor ngày 22/10) + màn học sinh làm bài (AssignmentAttemptScreen) + lớp dữ liệu createAssignment/getAssignmentDetail/submitAssignmentAttempt trong biRepository (bổ sung 22/10: getTeacherAssignments/createEmptyAssignment/getAssignmentForEdit/updateAssignment/deleteAssignmentCompletely; học sinh chỉ thấy bài có published_at) — nộp bài chấm tự động câu có đáp án (chuẩn hóa 2 hệ tên loại câu của app single/multi/fill và của DB single_choice/…), tự luận sinh phiếu chờ chấm; bài mới chảy thẳng vào màn Tiến độ bài làm và trang chủ học sinh", "bf628d46-b3f0-4aa7-b897-247a5e78feec": "Đợt XÓA SẠCH DB + NẠP DỮ LIỆU GIẢ LẬP POWER BI 21/10 (GĐ2–GĐ5 của kế hoạch đã duyệt): sao lưu đủ 12 bảng ra ngoài repo → chạy nốt migration 003+004+005 (RLS + payload câu hỏi) → xóa trắng 12 bảng, dựng lại Admin (006) + giáo viên chủ gv001 → migration_008 thêm 10 bảng + cột (điểm tối đa/cách chấm/độ khó tường minh cho câu hỏi; SHORT_ANSWER gộp vào essay theo quyết định chủ dự án) → script import_bi_mock_v3.py nạp trọn file Excel: lớp 7A4, 10 học sinh (hs001–hs010), 2 chủ đề, 16 hoạt động, 10 câu hỏi (6 câu tự chấm ĐÃ tích sẵn đáp án đúng suy ra từ chính dữ liệu file: A / A / [A,B] / 'so sánh' / A / A), 54 lượt làm, 223 câu trả lời, 44 phiếu chấm, 32 phiên, 61 dòng bảng ngày — kiểm chứng bộ số vàng ĐẠT TOÀN BỘ (mọi count khớp, XOR 28/26, chờ chấm 39=39, đối soát điểm 0 lệch) → UI mới: màn giáo viên 'Tiến độ bài làm' (KPI đăng nhập 7 ngày + biểu đồ phiên, tiến độ nộp bài độc lập theo từng em, hàng chờ chấm chấm được ngay, lượt làm bài kèm chi tiết từng câu, cây luồng học) + mục 'Bài tập được giao' ở trang chủ học sinh", "af0430e1-72a2-4a9c-8596-392f5ec788e1": "Còn treo", "b050ca0c-6946-49df-bd6c-8befcee389d6": "Bổ sung đáp án/n <script>
  const svg = document.getElementById('svg');
  const world = document.getElementById('world');
  const FULL = { x: -3940.0, y: -7862.5, w: 5756.0, h: 15725.0 };
  const GVB = [-3890.0, -7812.5, 3600.0, 11961.0];
  const HSB = [290.0, -6305.0, 1476.0, 7387.0];
  let k = 1, tx = 0, ty = 0;
  function apply() { world.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`); }
  function stageSize() { const r = svg.getBoundingClientRect(); return { w: r.width, h: r.height }; }
  function fitAll() {
    const s = stageSize();
    k = Math.min(s.w / FULL.w, s.h / FULL.h);
    tx = (s.w - FULL.w * k) / 2 - FULL.x * k;
    ty = (s.h - FULL.h * k) / 2 - FULL.y * k;
    apply();
  }
  function jump(r) {
    const s = stageSize();
    k = Math.min(s.w / (r[2] + 60), s.h / (r[3] + 60));
    tx = s.w / 2 - (r[0] + r[2] / 2) * k;
    ty = s.h / 2 - (r[1] + r[3] / 2) * k;
    apply();
  }
  function zoomAt(mx, my, f) {
    const px = (mx - tx) / k, py = (my - ty) / k;
    const k2 = Math.min(4, Math.max(0.02, k * f));
    tx = mx - px * k2; ty = my - py * k2; k = k2;
    apply();
  }
  function zoomC(f) { const s = stageSize(); zoomAt(s.w / 2, s.h / 2, f); }
  function toggleRel() {
    const l = document.getElementById('rellayer');
    const off = l.style.display === 'none';
    l.style.display = off ? '' : 'none';
    document.getElementById('relbtn').textContent = off ? 'Ẩn đường quan hệ' : 'Hiện đường quan hệ';
  }
  const ptrs = new Map();
  let lastPinch = 0, lastMid = null, downMoved = 0, hitId = null, multi = false;
  svg.addEventListener('pointerdown', e => {
    if (ptrs.size >= 1) multi = true;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const g = e.target && e.target.closest ? e.target.closest('g.node') : null;
    hitId = g ? g.dataset.id : null;
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    lastPinch = 0; lastMid = null; downMoved = 0;
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) {
      downMoved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
      tx += e.clientX - prev.x; ty += e.clientY - prev.y;
      apply();
    } else if (ptrs.size === 2) {
      const p = [...ptrs.values()];
      const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const mid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
      const r = svg.getBoundingClientRect();
      if (lastPinch > 0) zoomAt(mid.x - r.left, mid.y - r.top, dist / lastPinch);
      if (lastMid) { tx += mid.x - lastMid.x; ty += mid.y - lastMid.y; apply(); }
      lastPinch = dist; lastMid = mid;
    }
  });
  const endPtr = e => { ptrs.delete(e.pointerId); lastPinch = 0; lastMid = null; };
  svg.addEventListener('pointerup', endPtr);
  svg.addEventListener('pointercancel', endPtr);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });

  // ===== Che do bam-chon: nut lien quan sang len, con lai mo di =====
  const G = JSON.parse(document.getElementById('graph').textContent);
  const edgeEls = [...document.querySelectorAll('path.edge')];
  const relEls = [...document.querySelectorAll('#rellayer .rel, #rellayer .rellbl')];
  function focusNode(id) {
    const S = new Set([id]);
    const stack = [id];
    while (stack.length) { const cur = stack.pop(); (G.children[cur] || []).forEach(c => { S.add(c); stack.push(c); }); }
    let p = G.parent[id];
    while (p) { S.add(p); p = G.parent[p]; }
    G.rels.forEach(([a, b]) => { if (a === id) S.add(b); if (b === id) S.add(a); });
    document.querySelectorAll('g.node').forEach(el => {
      el.classList.toggle('dim', !S.has(el.dataset.id));
      el.classList.toggle('lit', S.has(el.dataset.id));
    });
    edgeEls.forEach(el => el.classList.toggle('dim', !(S.has(el.dataset.a) && S.has(el.dataset.b))));
    relEls.forEach(el => {
      const on = (el.dataset.a === id && S.has(el.dataset.b)) || (el.dataset.b === id && S.has(el.dataset.a));
      el.classList.toggle('dim', !on);
      if (el.tagName === 'path') el.classList.toggle('hot', on);
    });
    document.getElementById('fname').textContent = '🎯 ' + (G.titles[id] || '');
  }
  function clearFocus() {
    document.querySelectorAll('.dim, .lit, .hot').forEach(el => el.classList.remove('dim', 'lit', 'hot'));
    document.getElementById('fname').textContent = '';
  }
  svg.addEventListener('pointerup', e => {
    const wasMulti = multi;
    if (ptrs.size === 0) multi = false;
    if (downMoved > 6 || wasMulti) return;
    let id = hitId;
    if (!id) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('g.node') : null;
      id = g ? g.dataset.id : null;
    }
    if (id) focusNode(id); else clearFocus();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') clearFocus(); });
  fitAll();
</script>
