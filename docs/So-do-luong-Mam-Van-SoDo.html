  .roottitle { font-size:21px; font-weight:800; fill:#FFF7E8; text-anchor:middle; }
  .rootsub { font-size:12.5px; fill:#FFF7E8; opacity:.85; text-anchor:middle; }
  .node { cursor:pointer; transition: opacity .25s; }
  path.edge, .rel, .rellbl { transition: opacity .25s; }
  .dim { opacity: .07 !important; }
  .rel.hot { opacity: 1 !important; stroke-width: 3.4; }
  .node.lit rect { stroke-width: 3.2; }
  #fname { font-size:12.5px; font-weight:700; color:#FFD166; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

nh của tuần; tuần này to nhất, viền cam nổi bật", "34db5629-b711-4e7e-be78-b027adb76b47": "Tuần chưa học hiện mốc xám 'Chưa học' thay vì biến mất", "693fad7a-0f62-42c9-a177-976a9fac7e4f": "Nhãn tuần dễ hiểu ('Tuần trước', '2 tuần trước'…) + số câu đã làm dưới mỗi mốc", "90f01a61-6c78-4e67-9e52-06765d3a9866": "Góc phải thẻ: tổng số câu + điểm tuần này", "7986af84-4e1b-4d4c-9b27-a45335d82007": "Thành tích & huy hiệu: toàn bộ danh mục, phân biệt đã đạt / chưa đạt", "a3551d0a-efc4-4635-9729-3da3fd6cc94d": "2.8 Đổi quà", "f5236cca-1cc8-406f-959f-406fd4726385": "Ví chi tiêu = TỔNG XP của tài khoản (vĩnh viễn — chỉ giảm khi xin quà); MỐC MỞ RƯƠNG xét theo XP TUẦN + số ngày điểm danh (quyết định chốt của chủ dự án)", "62e13d32-b665-49fd-9d34-a54f7a210171": "Các rương theo cấu hình: Rương Hạt / Rương Lá / Rương Hoa / Rương Vàng", "a4e897ba-05ae-482d-8717-e65e3e9dcbc2": "Danh mục quà thật (XP / ngày điểm danh yêu cầu)", "760a8548-e9a8-4c0b-a441-4a0b554d0860": "Bookmark Mầm Mực thủ công — 280 XP · 4 ngày", "ae9d1612-da46-4c8c-b70d-89a37db87622": "Quyền chọn bài đọc cho cả lớp — 320 XP · 4 ngày", "0e84e951-5829-4df7-b6b5-f18562e7f94b": "Bút mực xanh Giấy & Mực — 450 XP · 5 ngày", "57a8a3ba-b9a8-4494-b5df-9a8af5c48a3d": "Sổ tay Giấy & Mực bìa cứng — 650 XP · 5 ngày", "d6c69188-91dd-40ab-841b-499aefa5542a": "Rương Vàng: Bút mài nét hoa & Bộ quà lưu niệm Mầm Văn — 750 XP · 6 ngày", "8380f802-9992-49f0-8419-77b7e24a68af": "Nội dung quà thuộc loại 'secret' — học sinh không được biết trước bên trong có gì", "009f097b-32eb-4837-b84c-dab5b61596aa": "Gửi yêu cầu: TRỪ NGAY vào Tổng XP (ghi deductedXp); chặn khi Tổng XP không đủ; chặn gửi trùng khi đang có yêu cầu chưa bị từ chối", "d84c5733-3a19-4572-9aae-603418ea97a3": "Trạng thái: Chờ duyệt → Được duyệt → Đã trao → Đã mở", "48af3517-b9ab-4e1b-916d-992129eda4b0": "Bị từ chối → HOÀN 100% XP đã trừ vào Tổng XP", "e4cc305e-04e8-46b5-b8b6-8fdd9a6a1f20": "2.9 Hồ sơ", "c5aa17ec-4082-4b6f-8fbf-e76517b6fb37": "Thông tin tài khoản học sinh", "60  câu hỏi, bài nộp tự luận, state học sinh, yêu cầu quà…", "f8c8aa08-4aa4-462e-963b-c65bf0cc7b4f": "Kho mock (localStorage) làm dự phòng khi mất kết nối: đọc GỘP dữ liệu 2 nơi (bài nộp, học sinh, lớp) để không bao giờ thất lạc dữ liệu", "a55b0916-ac04-4d14-a52b-9a3a3071c60e": "Cổng chặn ghi state: chỉ lưu sau khi state THẬT của đúng học sinh đã nạp xong — hết lỗi state mẫu (310 XP, huy hiệu sẵn) ghi đè lên DB", "b1f48f33-77fd-4c6d-9f44-8837525fcd4d": "Học sinh mới bắt đầu TRẮNG với hồ sơ thật (đúng tên + đúng lớp) ở cả 2 nhánh đọc state", "58dbf5ff-7128-4e25-a946-bfb9c952a9cb": "useLiveQuery + eventBus: đồng bộ tức thời giữa các màn hình theo đúng khóa sự kiện (quiz / content / class…)", "50d1fb9a-51b7-4c5e-aeb4-47ce83f01e05": "Migration chờ chủ dự án chạy trong Supabase SQL Editor: 003 (trạng thái quà GIVEN/OPENED) + 004 (cột payload giữ đủ trường câu hỏi) — app đang chạy chế độ tương thích an toàn trong lúc chờ", "018d04ba-486e-4e8e-ac8b-8bdcc0cde479": "Đã sao lưu toàn bộ 12 bảng trước khi dọn dữ liệu test: xóa 21 HS test + 15 bài nộp test; giữ lại hs001, 5 giáo viên, 4 lớp, toàn bộ nội dung thật (6 chủ đề, 97 câu hỏi, 33 quiz, 19 video, 6 lý thuyết)", "2748623f-bd92-4e07-9d9d-f316d0d95138": "4.4 Giao diện & hiệu năng", "bcf1f680-1054-4249-b28b-87d2242a6b52": "Mọi hộp thoại xác nhận dùng ConfirmDialog giữa màn hình (6 chỗ từng dùng hộp thoại mặc định của trình duyệt đã thay hết)", "a4614788-9c12-422b-a76a-fe4cda364c1e": "Nút điều hướng tự nhả focus sau khi bấm — hết vòng đen focus bám trên nút menu", "edba1322-0190-40e1-a540-2e81ab8fb1bc": "Tải lười (React.lazy): gói JS ban đầu 2,37 MB → ~0,79 MB; phần giáo viên (~1,08 MB) và thư viện biểu đồ (~0,39 MB) chỉ tải khi vào đúng khu vực", "02aa1c06-6478-496c-989e-fa2039623f36": "DevPanel (cộng XP / tự duyệt quà / tự chấm 9.0 / đặt lại dữ liệu demo) CHỈ có ở bản development — đã kiểm chứng bị loại khỏi gói production", "4db9a822-7bdc-4b5f-841f-63dba297cab4": "5. KHUNG ĐO NĂNG LỰC (từ sơ đồ gốc của chủ dự án — đã có dữ li d4726385"], ["d54bba92-9e2e-44aa-a127-f5b1c7943716", "ebebd422-2e6c-4129-a991-1dd08f989511"], ["d54bba92-9e2e-44aa-a127-f5b1c7943716", "c9f1cfbf-d95e-4da6-a98d-cd9eae3bee07"], ["fe54cf56-004a-4e38-ae07-69351f04fc8c", "26dba7dc-06f3-4a13-8865-70f54fe118a3"], ["4db9a822-7bdc-4b5f-841f-63dba297cab4", "6a3f648b-7985-4641-945e-61dbffec73c6"], ["d947836b-1784-42dd-a108-6df7a12894b8", "a4ce86d8-8860-4cf0-ace8-0e93d9e7fc92"], ["79d83558-f67e-4da3-a790-47863a2716bf", "8b71d956-4794-45ab-b671-81ed18ce63a9"], ["5e050c63-4802-499e-8a29-7c44f7ad9d5f", "72c86673-574a-4f7a-882f-1311498096d6"], ["5ee96a80-373b-46fd-9b3d-4550a31e44c1", "f5236cca-1cc8-406f-959f-406fd4726385"], ["1e03c139-846d-41bd-9e92-dbde36312b4f", "ce550221-f6ba-4eec-a9bf-acd39df3b581"], ["2378ec3e-b6d2-4e54-92ae-92c9a54c0482", "a03ee5d6-4323-4769-b275-95c7858a4e1a"], ["af610ae6-b27a-4fff-bd1a-fd03a34bfecc", "cc2f2bb0-c661-4265-b4da-845190bec00c"], ["37b3d461-3e26-4b74-a4c6-76366618c7bc", "85169bff-dd28-45e9-a5cc-48edd7fce165"]]}</script>
<script>
  const svg = document.getElementById('svg');
  const world = document.getElementById('world');
  const FULL = { x: -3940.0, y: -5862.5, w: 5756.0, h: 11725.0 };
  const GVB = [-3890.0, -5812.5, 3600.0, 9510.0];
  const HSB = [290.0, -5234.0, 1476.0, 7012.0];
  let k = 1, tx = 0, ty = 0;
  function apply() { world.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`); }
  function stageSize() { const r = svg.getBoundingClientRect(); return { w: r.width, h: r.height }; }
  function fitAll() {
    const s = stageSize();
    k = Math.min(s.w / FULL.w, s.h / FULL.h);
    tx = (s.w - FULL.w * k) / 2 - FULL.x * k;
    ty = (s.h - FULL.h * k) / 2 - FULL.y * k;
    apply();
  }
  function jump(r) {
    const s = stageSize();
    k = Math.min(s.w / (r[2] + 60), s.h / (r[3] + 60));
    tx = s.w / 2 - (r[0] + r[2] / 2) * k;
    ty = s.h / 2 - (r[1] + r[3] / 2) * k;
    apply();
  }
  function zoomAt(mx, my, f) {
    const px = (mx - tx) / k, py = (my - ty) / k;
    const k2 = Math.min(4, Math.max(0.02, k * f));
    tx = mx - px * k2; ty = my - py * k2; k = k2;
    apply();
  }
  function zoomC(f) { const s = stageSize(); zoomAt(s.w / 2, s.h / 2, f); }
  function toggleRel() {
    const l = document.getElementById('rellayer');
    const off = l.style.display === 'none';
    l.style.display = off ? '' : 'none';
    document.getElementById('relbtn').textContent = off ? 'Ẩn đường quan hệ' : 'Hiện đường quan hệ';
  }
  const ptrs = new Map();
  let lastPinch = 0, lastMid = null, downMoved = 0, hitId = null, multi = false;
  svg.addEventListener('pointerdown', e => {
    if (ptrs.size >= 1) multi = true;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const g = e.target && e.target.closest ? e.target.closest('g.node') : null;
    hitId = g ? g.dataset.id : null;
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    lastPinch = 0; lastMid = null; downMoved = 0;
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) {
      downMoved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
      tx += e.clientX - prev.x; ty += e.clientY - prev.y;
      apply();
    } else if (ptrs.size === 2) {
      const p = [...ptrs.values()];
      const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const mid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
      const r = svg.getBoundingClientRect();
      if (lastPinch > 0) zoomAt(mid.x - r.left, mid.y - r.top, dist / lastPinch);
      if (lastMid) { tx += mid.x - lastMid.x; ty += mid.y - lastMid.y; apply(); }
      lastPinch = dist; lastMid = mid;
    }
  });
  const endPtr = e => { ptrs.delete(e.pointerId); lastPinch = 0; lastMid = null; };
  svg.addEventListener('pointerup', endPtr);
  svg.addEventListener('pointercancel', endPtr);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });

  // ===== Che do bam-chon: nut lien quan sang len, con lai mo di =====
  const G = JSON.parse(document.getElementById('graph').textContent);
  const edgeEls = [...document.querySelectorAll('path.edge')];
  const relEls = [...document.querySelectorAll('#rellayer .rel, #rellayer .rellbl')];
  function focusNode(id) {
    const S = new Set([id]);
    const stack = [id];
    while (stack.length) { const cur = stack.pop(); (G.children[cur] || []).forEach(c => { S.add(c); stack.push(c); }); }
    let p = G.parent[id];
    while (p) { S.add(p); p = G.parent[p]; }
    G.rels.forEach(([a, b]) => { if (a === id) S.add(b); if (b === id) S.add(a); });
    document.querySelectorAll('g.node').forEach(el => {
      el.classList.toggle('dim', !S.has(el.dataset.id));
      el.classList.toggle('lit', S.has(el.dataset.id));
    });
    edgeEls.forEach(el => el.classList.toggle('dim', !(S.has(el.dataset.a) && S.has(el.dataset.b))));
    relEls.forEach(el => {
      const on = (el.dataset.a === id && S.has(el.dataset.b)) || (el.dataset.b === id && S.has(el.dataset.a));
      el.classList.toggle('dim', !on);
      if (el.tagName === 'path') el.classList.toggle('hot', on);
    });
    document.getElementById('fname').textContent = '🎯 ' + (G.titles[id] || '');
  }
  function clearFocus() {
    document.querySelectorAll('.dim, .lit, .hot').forEach(el => el.classList.remove('dim', 'lit', 'hot'));
    document.getElementById('fname').textContent = '';
  }
  svg.addEventListener('pointerup', e => {
    const wasMulti = multi;
    if (ptrs.size === 0) multi = false;
    if (downMoved > 6 || wasMulti) return;
    let id = hitId;
    if (!id) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('g.node') : null;
      id = g ? g.dataset.id : null;
    }
    if (id) focusNode(id); else clearFocus();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') clearFocus(); });
  fitAll();
</script>
