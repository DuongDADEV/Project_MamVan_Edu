<style>

  .ttl { font-size:12.5px; text-anchor:middle; }
  .meta { font-size:10.5px; text-anchor:middle; }
  .roottitle { font-size:21px; font-weight:800; fill:#FFF7E8; text-anchor:middle; }
  .rootsub { font-size:12.5px; fill:#FFF7E8; opacity:.85; text-anchor:middle; }
  .node { cursor:pointer; transition: opacity .25s; }
  path.edge, .rel, .rellbl { transition: opacity .25s; }
  .dim { opacity: .07 !important; }
  .rel.hot { opacity: 1 !important; stroke-width: 3.4; }
  .node.lit rect { stroke-width: 3.2; }
  #fname { font-size:12.5px; font-weight:700; color:#FFD166; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

10, chủ dự án khoanh đen): chip 'Tổng quan toàn trường' + 'Chào thầy…!' + mascot + nút 'Thêm học sinh mới'", "eb51b462-dc39-4d93-a975-86b0bb8f6d24": "Dashboard dựng lại 100% theo file Power BI 'Tổng quan' (25/10): 2 slicer + 4 KPI + 3 bảng + 2 biểu đồ, mọi số tính từ Supabase bằng đúng công thức DAX (pbixDashboard.ts); bảng chủ đề thay biểu đồ luồng (25/10)", "1cccf33c-46f9-46c8-a1b9-6c22b0ef3408": "Bộ lọc pbix: Khoảng thời gian (dim_date) + Lớp học (students.class_id); lớp áp cho mọi visual, ngày không áp KPI Hoạt động 7 ngày (REMOVEFILTERS) và Câu trả lời chờ chấm (NoFilter). Nút lọc Theo luồng (learning_activities.Flow_Name) đã XÓA HẲN khỏi giao diện từ 25/10 theo lệnh chủ dự án — trước đó từ khi panel luồng cũ thay bằng bảng chủ đề thì nút này đã inert (không áp cho visual nào), code tính flowChart/flowOptions cũng dọn cùng đợt", "ac44087d-bbc4-4009-a2ac-9e9fc4aa58e7": "4 KPI đúng DAX: Hoạt động 7 ngày (DISTINCTCOUNT phiên, neo MAX(login_date)); Tỷ lệ nộp bài (SUBMITTED/targets); Câu trả lời chờ chấm (PENDING); Tỷ lệ điểm đạt (tổng điểm/tổng điểm tối đa của câu đã chấm); ghi chú Tỷ lệ điểm đạt làm tròn 1 thập phân (25/10, sửa lỗi hiển thị 180.20000000000002/247)", "bba6075c-e583-489f-95b1-866c600ee24f": "Bảng Học sinh cần quan tâm: Họ tên + Hoạt động gần nhất (MAX login_at) + Số bài chưa nộp + Tỷ lệ đạt điểm cá nhân + Gợi ý theo dõi (SWITCH theo ngày vắng + bài chưa nộp); sắp xếp theo gợi ý giảm dần", "f958999a-3511-458b-82cf-324d125e7bc3": "Bảng Học sinh cần quan tâm (25/10): 3 thẻ hàng bảng (học sinh + bài giao + chủ đề) stretch cùng chiều cao theo lưới — đã gỡ self-start khỏi thẻ học sinh và thẻ chủ đề (25/10, lệnh chủ dự án 'cho nó cân nhau đi đừng có cái cao cái thấp'); thẻ bài giao vốn không có self-start nên đã stretch sẵn; chiều cao hàng = thẻ học sinh cao nhất (7 dòng + footer), phần thừa ở 2 thẻ ngắn là khoảng trống đáy thẻ, vùng cuộn không phình quá 7 dòng — vùng cuộn đo chiều cao từ render thực tế (chiều cao thead + 7 dòng đầu, hook useSevenRowMaxHeight đo bằng offsetHeight + ResizeObserver) nên lúc chưa cuộn thấy đúng 7 dòng học sinh (bỏ max-h 316px cũ — đã sai vì chiều cao header thay đổi theo số dòng xuống dòng của tiêu đề cột theo độ rộng thẻ; tên + gợi ý truncate 1 dòng kèm title); header sticky top thật (bảng dùng border-separate + border-spacing-0 vì preflight đặt border-collapse: collapse làm sticky của th không tác dụng trên Chrome; viền dòng chuyển từ tr sang td để giữ nguyên đường kẻ); từ dòng thứ 8 trở đi cuộn trong bảng mới thấy; hàng Tổng cộng là footer ở đáy thẻ luôn thấy", "9e39244a-0c23-48d6-8134-72861c66d7ac": "Cross-filter theo học sinh (25/10): bấm dòng trong bảng học sinh → mọi panel còn lại (KPI nộp bài / điểm đạt / chờ chấm, bảng bài giao, bảng chủ đề, 2 biểu đồ) chỉ hiện em đó; chip 'Đang xem: <tên> ✕', bấm lại dòng hoặc ✕ để bỏ chọn; KPI Hoạt động 7 ngày giữ toàn lớp (công thức pbix đếm DISTINCT học sinh)", "e06d9d1c-39cc-42bc-aa76-ae5d4edfa76b": "Bảng Tiến độ bài được giao: Được giao / Đã nộp / Chưa nộp / Tỷ lệ nộp theo từng bài; sắp xếp theo tỷ lệ nộp giảm dần; chỉ hiện bài có lượt giao trong phạm vi", "1a5e458a-ba1b-41e9-9ffb-454efde8d1cd": "Bảng Tiến độ hoàn thành luồng theo chủ đề (25/10, thay biểu đồ luồng): Chủ đề | Học sinh hoàn thành | Tổng số học sinh | % hoàn thành; % tính từ states qua isTopicFullyComplete (định nghĩa hoàn thành chủ đề của app); sắp xếp % giảm dần; chỉ chịu lọc lớp, không chịu lọc ngày/luồng; bảng có thanh cuộn dọc giống bảng học sinh (chỉ hiện 7 chủ đề + cuộn trong bảng, header dính đầu khi cuộn, cùng cơ chế đo chiều cao + border-separate); cột dùng table-fixed + colgroup 34%/24%/24%/18% (=100%) + tiêu đề truncate 1 dòng kèm title nên vừa chiều rộng thẻ, không còn thanh cuộn ngang ở desktop; không có hàng Tổng cộng; thẻ stretch cùng chiều cao với 2 thẻ còn lại trong hàng (đã gỡ self-start 25/10), phần thừa là khoảng trống đáy thẻ", "4958cda1-6bfa-4e23-9dab-a01828953afa": "Biểu đồ cột Tỷ lệ điểm đạt theo mức tư duy (1 Nhận biết / 2 Thông hiểu / 3 Phân tích / chiếu khi không đổi giá trị nên không nhấp nháy lặp); nhãn 0/1 vẽ bằng dot custom (bỏ LabelList — nhãn mặc định chỉ vẽ khi hết animation nên con số nhấp nháy, đợt trước còn kẹt mất hẳn sau khi lọc): dot vẽ cả chấm lẫn số, chạy theo điểm suốt chuyển động và đứng yên sau đó, con số hiển thị suốt, lề trên 28px giữ nhãn không bị cắt; 25/10 sửa tiêu đề trục dưới bị cắt nửa dưới ở mép dưới thẻ: BarChart + LineChart thêm bottom margin 28px (trước đây không có bottom, mặc định 5px) và tiêu đề trục X ('Tỷ lệ điểm đạt' insideBottom, 'Ngày' insideBottomRight) đặt fontSize 12px (trước đây kế thừa cỡ chữ app 16–20px nên tràn mép dưới SVG); giữ nguyên right 72 (bar), Y 150, top 28 (line), nhãn custom 0/1, đường 0-fill, tooltip, nhãn vạch)", "93fb1063-4891-45af-8646-54c4cedcb455": "Bảng student_activity_progress đã có (migration_013, 25/10) + backfill hàng hoàn thành hoạt động quiz từ attempt_answers; bảng chủ đề KHÔNG đọc bảng này (chưa có writer trực tiếp nên dữ liệu sẽ cũ ngay); hàng video/lý thuyết chưa có vì Supabase không có tín hiệu hoàn thành bước đó", "77f3536f-965f-4e56-9bd4-be7990a981f8": "Đã gỡ (25/10 theo lệnh chủ dự án): thanh lọc cũ, 6 thẻ KPI cũ, mục Học sinh cần quan tâm cũ, Nhận xét sư phạm tự động, 3 biểu đồ cũ; các tab khác của Phân tích không đổi", "855dda10-1bf1-4a92-94ec-1c1ee5a7a3b1": "Mọi số liệu tính từ dữ liệu thật — đã gỡ toàn bộ số bịa thời demo", "793141e3-7a47-4b57-9563-f24d34424ac0": "1.2 Lớp & học sinh", "8df9757c-35c2-4c9f-b187-923a145e9a18": "Tạo lớp mới (cảnh báo trùng tên + năm học)", "8011fffc-356f-4794-b4fe-b2843c1b6563": "Thẻ lớp: sĩ số, hoạt động 7 ngày, nút Vào lớp", "b2350627-53b5-4c2d-8245-88948de105b3": "Lưu trữ lớp — lớp đã lưu trữ không còn xuất hiện trong các ô chọn", "079b0ba4-d652-46e8-9f32-bd611a5f0476": "Tìm lớp theo tên", "50d7664d-b79c-4efc-8ca3-37fa46307490": "Vào lớp → bảng học sinh của lớp", "24370dc1-450c-4c3c-a48d-e61a7c45f6a4": "Thêm học sinh thủ công: họ tên + lớp", "b4246dda-f9fa-42a1-baf3-b041f994a5cc": "Tên đăng nhập ền thẻ + viền dùng độ đậm cao hơn; 2 màu nhạt nhất trong bảng chọn (Xanh tre, Hổ phách) đổi sang tông đậm hơn", "1353296f-f2b0-4435-a98c-db8f5250e9f6": "Tạo chủ đề mới xong: chỉ tự chọn chủ đề — chủ đề TRỐNG, KHÔNG còn tự sinh nháp 'Bài giảng Video mới' (bỏ từ 22/10 theo yêu cầu chủ dự án)", "33e3f521-11fa-4ec8-acee-a6feecce8b45": "Mỗi chủ đề chứa: Video / Lý thuyết / Bài luyện tập / Bài kiểm tra / Bài tập về nhà", "9ba7b9bf-1c72-4e3f-9efe-99dc913c1c46": "Bài con trong cây hiển thị HỢP NHẤT theo thứ tự luồng học của chủ đề (không nhóm theo loại nữa); cuối danh sách bài luôn có dòng '+ Tạo mới' mở menu 3 loại", "eae2d1e6-128f-4f47-a765-5119442fa9f7": "BÀI TẬP & ĐÁNH GIÁ LÀ MỤC RIÊNG NGANG HÀNG CHỦ ĐỀ (nâng cấp 22/10 theo yêu cầu chủ dự án — thay form bật lên AssignmentBuilderModal đã gỡ): nút 'Thêm bài tập & đánh giá' đứng NGANG HÀNG nút 'Thêm chủ đề' ở đầu cây → bấm là tạo ngay một mục NHÁP mới trong cây (thẻ riêng màu hổ phách — cột cây TÁCH 2 TAB riêng (tab Chủ đề / tab Bài tập & đánh giá, chủ dự án không muốn 2 loại chung một danh sách), thẻ ghi 'Bản nháp/Đã giao' + số câu/số học sinh/đã nộp) → mở MÀN SOẠN BÀI KIỂM TRA (AssignmentEditor) ở khung phải: tiêu đề, hạn nộp, giới hạn thời gian, chọn lớp + từng học sinh, chọn câu hỏi từ Ngân hàng vào đề (thêm/bớt/đổi thứ tự); 'Lưu nháp' chưa cho học sinh thấy (chưa published_at), 'Giao bài' mới chốt published_at + đồng bộ assignment_targets (học sinh đã có lượt làm thì không bị gỡ); xóa mục qua dialog xác nhận, xóa sạch cả attempts/answers/reviews con; tiến độ nộp và chấm theo dõi ở mục Phân tích + hàng đợi chấm (màn 'Tiến độ bài làm' đã XÓA hẳn 24/10 — file, nav, tab và nhánh render đều gỡ). Từ 24/10, màn soạn còn cho tạo câu hỏi mới THỦ CÔNG ngay trong màn (TN 1 đáp án / TN nhiều đáp án / Điền khuyết / Tự luận) — câu mới lưu vào ngân hàng riêng của giáo viên và đưa thẳng vào đề", "f930c996-2d75-4708-8c34-30f490cdcba8": "Menu tạo bài HỢP NHẤT 3 loại (Bài giảng Video / Lý thuyết / Bài tập — loại bài tập cụ thể chọn trong Cài đặt bài của QuizBuilder) ở 3 vị trí cùng một theme gọn (mỗi loại 1 dòng icon + tên; tạo thủ công bấm vào dòng, Tạo với AI bấm icon ✦ cuối dòng): 'Thêm vào chủ đề' ở trang chi tiết chủ đề, dòng '+ Tạo mới' cuối cây, nút '+ Thêm bài' cuối dải luồng. Nút '+ Tạo mới' ở góc trên trang đã BỎ (chủ dự án yêu cầu 22/10). QUY TẮC VỊ TRÍ: bài mới tạo CHÈN NGAY SAU bài đang mở (đang ở vị trí nào, bài mới nằm ngay sau vị trí đó — kể cả bài liên kết tạo từ trình soạn video/lý thuyết); không mở bài nào thì vào cuối luồng", "e5b630b8-baa4-4ddd-8773-17d2f9371b58": "Dải luồng học (TopicFlowStrip) — từ 25/10 nằm TRÊN CÙNG khung phải, TRÊN CẢ hàng công cụ của trình soạn (theo vạch đen chủ dự án vẽ ở mép trên; 24/10 dải nằm dưới trình soạn; đổi vị trí duy nhất, mọi chức năng dải không đổi): mỗi bài là một nút tròn có icon theo loại (Video ▶ / Lý thuyết 📖 / Bài tập ✎) nối nhau bằng gạch ngang, đúng thứ tự flowOrder; bấm nút tròn → mở đúng bài đó; kéo–thả trên dải để đổi thứ tự (lưu ngay); nút '+ Thêm bài' ở cuối dải mở menu 3 loại phủ lên trên nội dung bên dưới (menu z-50 phủ lên thanh công cụ sticky z-20; không bị vùng cuộn của dải cắt mất). Dải render một lần ở shell chung (TeacherContentScreen) nên mọi trình soạn (video/lý thuyết/quiz/bài tập) đều thấy cùng vị trí. Thứ tự lưu trong video_payload.flowOrder của chủ đề (khóa 'video:<id>' / 'theory:<id>' / 'quiz:<id>'); chủ đề cũ chưa có thì suy ra tạm video → lý thuyết → bài tập", "318b63e6-8c9b-40b5-a373-7cb58d465a3a": "Trang chi tiết chủ đề có nút 'Cập nhật lên web học sinh' — XUẤT BẢN CHỦ ĐỀ qua PublishModal dùng chung (bổ sung 22/10; trước đó THIẾU HẲN nên chủ đề mới tạo kẹt ở Bản nháp và học sinh không bao giờ thấy; xuất bản Video/Lý thuyết con vẫn tự xuất bản chủ đề cha như cũ)", "e6b9945e-5290-4007-a057-a32af75aa916": "Lớp lưu trữ siết chặt (sửa 22/10): tạo Video/Lý thuyết/Bài tập mà đẩy lên Supabase thất bại thì thử lại 1 lần rồi BÁO LỖI rõ ràng (pushOrThrow) — hết cảnh nuốt lỗi khiến bài tạo xong 'tự biến mất' (sự cố video trong chủ đề mới khi kiểm chứng luồng học). Vận hành: app tự đồng bộ bộ đệm trình duyệt lên máy chủ nên TUYỆT ĐỐI không xóa dữ liệu nội dung thẳng trong DB — bản đệm của trình duyệt sẽ đẩy hồi sinh; luôn xóa qua giao diện", "436384cc-00fb-48de-a11c-d3d5bc3bba2d": "Trình soạn Video", "66228f8a-0750-40e1-b461-1e8b487e1d1b": "Nguồn video: tải lên / liên kết; thời lượng", "9e8c4bef-676a-4030-95b6-15cc369caa66": "Đã bỏ hẳn ảnh bìa thumbnail (24/10): không còn ô tải lên/dán link ảnh trong trình soạn, xem trước không còn poster, danh sách không còn đọc thumbnailUrl; dữ liệu cũ trong DB giữ nguyên, không xóa", "04068023-ead6-499d-988d-90f06f9b61be": "Các ý trọng tâm (điểm tóm tắt) + tiểu mục", "486af866-2881-4f62-9f7a-24457d1bb251": "Gắn 3 bài liên kết: Luyện tập / Kiểm tra nhanh / Mastery Check — tạo mới ngay trong trình soạn, ID được ghi ngược vào bài gốc", "9aabaa3d-8f41-4813-9d5d-bc3b7cf40127": "Quay lại về trang chủ đề · Xem trước · Lưu nháp · Cập nhật lên web (xuất bản)", "69f8715b-7a65-48be-a2d9-1f1fc3fdaa56": "Trình soạn Lý thuyết", "0b6e3d98-e86b-479b-bde0-f4136df655c1": "Soạn theo khối nội dung (tiêu đề / đoạn văn…); thời gian đọc tối thiểu (giây)", "b3ffb75b-6fb3-4996-a55d-65322082e3a0": "Gắn bài Luyện tập + bài Kiểm tra lý thuyết", "292858e7-a030-4f9c-9e67-2a6efe60cb8d": "Quay lại / Xem trước / Lưu nháp / Xuất bản", "d3cfb1a8-a667-4cf0-a5ce-02c31befb460": "Trình tạo Bài tập (QuizBuilder)", "00e50c0e-807f-478e-b585-aa2de70586a1": "Tạo Bài tập MỚI: mở thẳng tab 'Cài đặt bài tập & Chế độ kiểm tra' TRƯỚC (tên bài, loại bài, chủ đề, thời gian, XP), nút 'Tiếp tục: Soạn câu hỏi →' mới chuyển sang tab Câu hỏi; mở bài cũ để sửa giữ nguyên tab Câu hỏi", "9140478f-8ed9-4e90-94b4-a9f9799323f5": "Loại bài: Luyện tập / Kiểm tra nhanh (7 phút) / Mastery Check (15 phút) / BTVN (+20 XP) / Đọc hiểu / Cuối kỳ", "fdc29cca-50d6-4725-8d48-a1788681d0e5": "Soạn câu hỏi: lấy từ Ngân hàng hoặc tạo mới", "f2ee557f-1473-406a-8dd5-b89e55964570": "Dọn đáp án khi xóa lựa chọn; từ 24/10 KHÔNG còn chặn xuất bản vì thiếu đáp án/thiếu câu hỏi/sai số câu tiêu chuẩn — 2 hộp cảnh báo chất lượng ('Lưu ý chất lượng bài kiểm tra' / 'Có lỗi cần sửa trước khi xuất bản') + cổng chặn xuất bản đã gỡ hẳn, nút xuất bản luôn lưu rồi mở hộp thoại xuất bản", "44e7105a-a215-44dc-aa95-decb16a3b252": "Nút Quay lại trở về ĐÚNG bài gốc (video/lý thuyết) đã tạo liên kết — không văng về trang chủ đề", "3a30a67b-5fee-4d32-8f70-97adda57a202": "Xuất bản (PublishModal)", "ee64d38f-669c-4c3b-a957-ae53fcc97c85": "Chọn lớp áp dụng; tùy chọn thông báo học sinh", "3ceae353-a283-4abe-8f96-95726575c0de": "Cảnh báo: video chưa gắn bài luyện tập · bài kiểm tra dưới 3 câu · bài đã có học sinh làm", "aa232c5b-bf8c-41f1-99f0-ddad531a9507": "Xuất bản xong: học sinh đúng lớp nhận thông báo bài mới (xem 2.10)", "e3dad888-5bae-411a-9b24-7c3af9386df3": "Trạng thái nội dung: Nháp / Đã xuất bản / Có sửa chưa đăng", "f4686f66-d155-49a6-9c47-cdb466053652": "1.4 Ngân hàng câu hỏi", "8ae2bd77-b738-42bd-9a2b-aaeee4f26b8a": "Kho ngân hàng: câu hỏi + video + lý thuyết tham chiếu", "68191c19-a564-4b2d-9056-1c8197d5bd86": "4 dạng câu: Trắc nghiệm 1 đáp án / Chọn nhiều đáp án / Điền vào ô trống / Tự luận (Rubric)", "13752f2a-a11a-4011-8abe-a7ef192d3cc3": "Tô sáng đáp án đúng — nhận cả 2 dạng lưu (chữ cái & toàn văn)", "5c13f948-e29e-4ed5-a87b-ba8f2f6ff5b7": "Đáp án điền khuyết được chuẩn hóa về dạng danh sách (gốc của lỗi không nộp được bài — đã vá)", "34be0f07-3add-423e-bd93-bec47137cdf6": "Bộ lọc dạng DANH SÁCH 3 nhóm, gập/mở được, tiêu đề hiện lựa chọn đang áp dụng", "4acbf11e-9b06-4dc0-a82c-6a7913debee4": "1) Dạng học liệu", "c398266c-618b-4b76-a2fc-be12847b3b33": "2) Năng lực: Nhận biết / Thông hiểu / Phân tích / Vận dụng", "5b14aa04-95c2-4f81-8144-f3e946a32e82": "3) Độ khó: Dễ / Trung bình / Khó", "8d799520-c234-4673-88d8-5398ebf309f3": "Thêm câu hỏi thủ công; xóa câu hỏi bằng hộp thoại xác nhận của app", "c253b526-a898-46ff-9a0d-f04d3e3baf91": "Tab Bản nháp (huy hiệu đếm số chờ duyệt)", "5add7a2f-7923-46d1-a9cd-75ef4302e9b9": "Bộ câu hỏi & lý thuyết do AI tạo mà chưa duyệt đều nằm ở đây", "dd808fb7-9e92-4d55-a676-e3961efc4ed2": "Mở xem từng câu → tích chọn câu đạt → 'Đưa vào Ngân hàng'; câu chưa chọn ở lại nháp; CHUYỂN HẲN (24/10): câu đã đẩy bị xóa khỏi nháp, hết nháp thì xóa luôn khóa nháp", "5ecd572b-bcb7-48df-9124-1c01b47ae4d4": "Nháp LÝ THUYẾT — nút 'Đưa vào học liệu' (24/10, chỉ người tạo được đẩy, theo đúng mẫu luồng câu hỏi): lý thuyết thành bài lý thuyết trong cây nội dung của chủ đề đó (lý thuyết là học liệu, KHÔNG vào ngân hàng câu hỏi); đẩy xong XÓA nháp. Đường duyệt từ Studio cũng xóa khóa nháp tường minh khi áp dụng (hết rớt nháp do hiệu ứng tự lưu chạy không kịp)", "ab64ecc7-f45d-492f-bad6-098049709888": "Ngân hàng riêng từng giáo viên (24/10): nháp do AI tạo được đóng dấu người tạo — chỉ chính giáo viên tạo ra nháp mới thấy và mới được chuyển; nháp cũ chưa đóng dấu vẫn hiện cho người dùng trình duyệt đó (tương thích ngược); ngân hàng câu hỏi đã tách theo giáo viên ở tầng kho (chỉ lấy câu của chủ sở hữu theo phiên)", "1e7fbf54-079c-4121-a71f-462915dcf666": "Xóa nháp có hỏi xác nhận", "c07a5b92-e34a-4341-b383-53a66f65645f": "Nguyên tắc xuyên suốt: chưa duyệt thì chưa vào Ngân hàng", "28cf403c-06a0-42c4-9291-03413b83ec8a": "1.5 Mầm AI Studio", "fe78c5ed-ce81-4e45-91eb-38080a9dcae6": "3 panel kéo chỉnh độ rộng / thu thành thanh dọc 46px (lưu theo máy)", "39e311e0-d6db-4577-8ea8-526d76587113": "Panel 1: Nguồn tài liệu", "b717ad66-976b-466a-999e-db7bfcecf091": "Panel 2: Trò chuyện & tra cứu tài liệu", "91ffae0e-6cf9-4eb4-ae85-429c9a7fd8fc": "Panel 3: Xưởng tạo đầu ra", "dbe650bb-f519-4e6a-86b9-20e9d80072bb": "Trợ lý trò chuyện 'Tôi là trợ lý Mầm AI' — tra cứu trên tài liệu đã nạp (RAG); từ 25/10 gọi qua proxy admin /api/ai/chat, giáo viên không nhập key nữa", "2e922cbf-f4c0-4ba0-979d-a97a22d5473a": "Tạo đầu ra theo CƠ CẤU LOẠI CÂU: 4 dòng số lượng (Chọn 1 / Chọn nhiều / Điền khuyết / Tự luận), nút −/+ từng loại, tổng tự cộng, khóa nút tạo khi tổng = 0", "ed51dfeb-395e-4f45-bf47-0b89d27fe76c": "Cơ cấu loại câu truyền thẳng vào prompt Gemini — loại để 0 thì không sinh câu loại đó", "d96c9398-1d0d-4c63-ade2-c832cc72d7d2": "Sinh qua proxy admin /api/ai/chat (25/10: giáo viên không nhập key nữa — hộp nhập key + nút test key trong Studio đã gỡ, thay bằng chip tĩnh 'Mầm AI'); chuỗi failover Gemini → Groq → OpenRouter, mỗi nấc 1 lần thử, timeout 25s/nấc; model + thứ tự chuỗi + bật/tắt từng nấc do admin cấu hình ở AdminPortal (bảng ai_settings); bộ dịch Gemini ↔ OpenAI nằm ở api/_lib/ai.ts (geminiToOpenAI / openAiToGeminiParts / tryChain / testLeg); khi mọi nấc lỗi → bản dự phòng MockAI và BÁO RÕ '(Bản dự phòng — Mầm AI lỗi)', không giả danh AI thật; vòng tool giữ nguyên, functionResponse giữ role 'function'", "22a045fc-3eb3-4343-9a2b-f48b0ab6c929": "Bộ câu hỏi AI → BẢN NHÁP BỀN: tự lưu (đóng xưởng / chuyển màn / tải lại trang vẫn còn); thanh BẢN NHÁP báo số câu + giờ lưu", "9b856a37-96ac-40d5-a362-c14198939ff2": "Duyệt → Lưu vào Ngân hàng: chỉ lưu câu đã tích chọn; tiêu đề 'Bộ câu hỏi: <chủ đề>', thời lượng = max(7 phút, số câu), XP = số câu × 5", "7538f7da-cb22-4324-aa07-2772e10d4778": "Lý thuyết AI → màn DUYỆT LÝ THUYẾT xem trước đúng dạng học sinh sẽ đọc → ưng ý mới 'Lưu lý thuyết vào học liệu'; nháp lý thuyết cũng tự lưu bền", "87ac1033-2fa6-4c93-aae6-e0b9f2bb716e": "1.6 Chấm bài", "c5a76ea1-0aaf-49ec-96c1-eb7386a72ace": "Hàng đợi GOM THEO HỌC SINH — mỗi em đúng 1 dòng (khử trùng bài theo nội dung + quy về đúng 1 học sinh thật dù lệch định danh giữa các nguồn)", "142c2d70-25c4-4490-b8dc-55cf7ef46c15": "Bảng 6 cột theo mẫu: Học sinh | Lớp | Chủ đề đã làm (x/y) | Bài chờ chấm (0 thì làm mờ) | Chờ lâu nhất (đỏ + '(quá hẹn)' khi quá 24 giờ) | Xem chi tiết", "3f53908e-6127-44f2-8bf4-b320a5f6883a": "2 thẻ thống kê: 'Cần chấm' (chờ chấm + đã có gợi ý AI, có nút lọc riêng gợi ý AI) · 'Chờ > 24 giờ' (bấm → sắp xếp chờ lâu nhất lên đầu)", "39985bfa-cb95-404b-8b66-0f36f26eaab4": "Bộ lọc gộp 1 ô duy nhất: Trạng thái / Sắp xếp", "fb27b3f1-158d-45fa-8211-17bc6a15da18": "'Chấm ngay' mở thẳng bài chờ lâu nhất chưa chấm của em", "84448530-8141-46cb-953e-be1c538b4f53": "Hàng đợi GỘP CẢ PHIẾU CHẤM TỪ LUỒNG BÀI TẬP/HOẠT ĐỘNG (22/10): câu tự luận nộp qua bài được giao/luồng học tạo phiếu chờ ở bảng phiếu chấm (answer_reviews, nhánh tiến độ) — nay hiện CHUNG trong hàng đợi này cạnh bài nộp tự luận thường (đúng học sinh/lớp/đề thật/nguồn bài); chốt điểm tại đây ghi ngược về đúng phiếu + câu trả lời + tổng điểm lượt làm, quy đổi thang 10 của hàng đợi ↔ điểm tối đa riêng của câu (2/3/4đ); số chờ chấm khớp vì cùng một nguồn (màn 'Tiến độ bài làm' đã XÓA hẳn 24/10, không còn màn riêng); nháp chấm của phiếu lưu bền trên máy", "25e8e606-02e8-4396-a9b7-640f7c359940": "Xem chi tiết theo học sinh", "b70ee4cc-a5c9-43c1-b675-6bd1cd091361": "Thẻ 'Họ tên · Lớp' + thanh tổng kết: x/y bài kiểm tra đã làm, số bài chờ chấm, số bài quá hạn, ĐTB, công tắc 'Chỉ hiện bài chưa chấm'", "54785adc-010e-4d17-acd4-db0fcf7c1c8e": "Bài gom theo CHỦ ĐỀ: dòng nhóm '… – bài chờ chấm: N' / '… – (Hoàn thành)'", "719f46dd-1ece-4443-920b-d5aef6a95ee9": "Cột Điểm hiện 'Gợi ý Xđ' cho bài AI đã gợi ý", "7efb97c7-590b-4526-85e6-03220fd52958": "Màn chấm bài (SplitGradingWorkspace)", "8b49120e-71b0-4189-9850-f2441fcac930": "Nội dung bài tự luận + thông tin bài / năng lực / chủ đề", "a8956589-763a-48f7-a19b-155e9e077b38": "'Gợi ý chấm tự động bởi AI': điểm gợi ý làm tròn 1 chữ số thập phân; chưa có gợi ý thì không bịa số", "c93c2e33-d694-4fa9-a56e-a05cdf9a0350": "'Tiêu chí đánh giá & Chấm điểm': chấm theo Rubric từng tiêu chí; gõ số thập phân / xóa trắng bình thường; Rubric không lưu khi tổng trọng số ≠ 100", "b35e8999-0755-4e71-8a12-696613e71c3b": "Câu nhận xét mẫu nhanh — bấm để chèn", "aeab126e-ec0f-4c44-9bc5-7ec8be1be712": "Chốt điểm → ghi đúng chủ đề / năng lực + nhật ký kiểm toán + thông báo cho học sinh (ở cả 2 kho dữ liệu)", "4e444fc9-f043-4946-8f12-829ddc231b57": "Huấn luyện AI (AiTrainingStudio): rubric + bài mẫu chấm để AI học cách gợi ý điểm", "f52d88e0-11de-49a5-957d-e8c514c4035f": "Bài tự luận không bao giờ bị gán nhầm cho 'học sinh đầu tiên' khi không tra được chủ nhân", "d80e0c2a-3c7a-45be-9107-987be8791e4c": "1.7 Quà tặng", "67f27a24-5f08-488f-8c8d-47eadb6d6916": "Hàng đợi yêu cầu đổi quà — số liệu thật (XP tuần / điểm danh / tên lớp tính từ state thật)", "ce647ec0-481b-48cf-a59a-4ee8f3ec18fd": "Duyệt / Từ chối / Trao / Mở — trạng thái GIVEN/OPENED không bị ghi nhầm thành REJECTED (migration_003)", "dddd0958-57d2-4648-8017-b05161bf5806": "Từ chối → HOÀN đầy đủ XP đã trừ vào TỔNG XP của học sinh (kể cả từ chối hàng loạt)", "b848f924-1033-40ad-b709-d596a44b87dd": "Duyệt / trao hàng loạt chỉ tính yêu cầu hợp lệ", "66b6f65a-1965-470a-a432-8c2052393f4c": "Xuất CSV theo đúng bộ lọc đang xem", "2fabd7e2-a2f8-469d-aa67-bce8739f9538": "Danh mục HỢP NHẤT (24/10, hướng c): mốc mặc định (REWARDS_CATALOG, chỉ xem — không sửa/xóa) + mốc GV tự tạo trong kho (thêm/sửa/xóa được); học sinh thấy hợp nhất của GV phụ trách lớp mình", "77ae5d00-a65f-4cfe-a287-6073162d9654": "Mốc GV gắn teacherId khi lưu; mốc cũ chưa gắn dấu hiện cho GV đó (tương thích ngược); học sinh không bao giờ thấy mốc của GV khác; khử trùng theo id (mốc kho thắng khi trùng id)", "8f04c998-d94f-45ee-9951-1d474a6a2f58": "Mốc GV lưu trên Supabase (25/10, migration_012, bảng reward_tiers): trước đó mốc chỉ nằm trong localStorage của trình duyệt tạo nó nên học sinh máy khác không thấy; nay SupabaseRewardRepository đọc/ghi bảng thật, học sinh mọi máy đều thấy mốc của GV phụ trách lớp mình; bảng chưa tồn tại (SQL chưa chạy) hoặc lỗi đọc-ghi thì code fallback về mốc local cũ, app không vỡ; mốc local cũ KHÔNG tự bay sang Supabase — GV tạo lại 1 lần sau khi chạy SQL; RLS allow_all theo mẫu 002/005 (cần vòng khóa thật sau)", "22f0de47-cf3c-45b7-9848-9d144f6754a4": "1.8 Phân tích", "907fc69f-2908-49fa-80ed-92329349042e": "metricsEngine: computeOverviewMetrics / detectStudentsNeedingAttention / generatePedagogicalInsights", "1fb7eec3-ee39-4dd8-9556-afa7a734d56a": "Phổ điểm (Histogram): tính theo TỪNG HỌC SINH — điểm TB của mỗi em xếp vào đúng 1 dải; tổng các cột luôn khớp sĩ số thật (đã sửa lỗi đếm theo câu hỏi)", "f88e8f91-bbb6-490d-8474-b4ac7d214125": "Bản đồ nhiệt năng lực (masteryAnalytics) · Tương tác & chuyên cần (engagementAnalytics) · Phân tích câu hỏi (questionAnalytics) · Hồ sơ học sinh (studentProfileAnalytics)", "ed6802da-dd37-4909-bdb6-14b90afcf1e9": "Tên lớp tra theo danh sách thật ở cả 3 nơi — không in UUID, không bịa tên lớp", "701ed853-177d-4e4a-9943-155b5d60d110": "Toàn bộ biểu đồ tính từ dữ liệu thật (điểm danh, nhật ký XP, kết quả câu hỏi, bước đã học); tuần không có điểm thì để trống — hết số bịa (13/18, 7.5đ, 82%, chuỗi 78→91%…)", "1bd881b5-a712-4559-8d14-19195cac2ac1": "TRỢ LÝ PHÂN TÍCH AI (22/10, giai đoạn 1 — tab đầu tiên của Phân tích): giáo viên hỏi bằng lời thường; Mầm AI (qua proxy admin, chuỗi Gemini → Groq → OpenRouter) chọn 1 trong 6 công cụ truy vấn (tổng quan lớp / so sánh chủ đề / phổ điểm / phân tích câu hỏi / hồ sơ học sinh / hoạt động học tập), hệ thống chạy ĐÚNG các hàm tính của các tab cố định trên dữ liệu thật rồi AI mới diễn đạt + đề xuất bước tiếp theo + gợi ý câu hỏi nối tiếp; quy tắc cứng: số do code tính (AI không tự sinh số), mẫu quá ít thì nói rõ 'chưa đủ dữ liệu' thay vì kết luận; từ 24/10 cô giao toàn quyền admin: trợ lý không từ chối vì lý do quyền hạn khi yêu cầu nằm trong dữ liệu của giáo viên — việc có công cụ thì làm thẳng, việc chưa có công cụ ghi thì chuẩn bị sẵn để giáo viên bấm một lần là xong; phân tách theo giáo viên vẫn giữ (công cụ chỉ thấy dữ liệu của giáo viên đó); biểu đồ do AI khai báo loại/trục qua công cụ riêng nhưng số liệu lấy nguyên văn từ kết quả công cụ; không còn cổng khóa Gemini (25/10: trợ lý gọi thẳng proxy /api/ai/chat, lỗi thì báo lỗi trong khung chat — không trả lời bịa); KÈM BONG BÓNG CHAT NỔI ở góc phải dưới cổng giáo viên: mở trợ lý ngay từ mọi màn hình, dùng chung bộ lọc của trang Phân tích, đóng/mở không mất hội thoại. LỊCH SỬ CHAT LÀ MỘT KHO DÙNG CHUNG (assistantChatStore): tab và bong bóng cùng một cuộc trò chuyện, lưu bền trong trình duyệt (tối đa 80 tin), có nút xóa lịch sử ở ô nhập. ĐỢT 2 (24/10): phổ điểm kèm TÊN học sinh từng khoảng (tên + điểm TB — hỏi 'điểm khá là những ai' trả tên thật, không xin lỗi vì công cụ/quyền); trợ lý có 9 công cụ đọc + 17 công cụ ghi qua ĐÚNG service UI dùng (tạo chủ đề/video/lý thuyết/quiz/câu hỏi/bài tập BI, xuất bản/gỡ xuất bản, sửa bài tập BI, chấm tự luận + phiếu chờ duyệt BI, duyệt/từ chối yêu cầu quà, xóa học liệu/bài kiểm tra/câu hỏi — mọi công cụ đối chiếu tên/id với dữ liệu của chính giáo viên, ngoài phạm vi thì báo lỗi rõ ràng, không bịa id); thông báo cho lớp qua cờ notifyStudent của luồng xuất bản (không có API thông báo độc lập). Giới hạn còn lại: quản trị giáo viên khác, cài đặt hệ thống, thông báo độc lập ngoài luồng xuất bản, sửa/xóa tài khoản học sinh. ĐỢT 3 (25/10): câu hỏi ĐẾM theo trạng thái (vd 'lớp 7A4 có bao nhiêu học sinh chưa có điểm') được trả lời TRỰC TIẾP — get_score_distribution nay trả thêm tổng số học sinh + số học sinh chưa có điểm + tên (học sinh trong phạm vi lọc mà không nằm trong khoảng điểm nào); series biểu đồ của công cụ này kèm thêm hàng 'Chưa có điểm' để vẽ breakdown đã có điểm vs chưa có điểm. Cổng vẽ biểu đồ mở rộng: trước đây chỉ vẽ khi câu trả lời xoay quanh so sánh/phân bố/xu hướng, nay vẽ cho MỌI breakdown theo nhóm có dữ liệu (kể cả đếm theo trạng thái). Cấm kiểu từ chối 'Em xin lỗi, em không thể...' với yêu cầu nằm trong phạm vi công cụ (dữ liệu lớp mình, đếm/liệt kê/tên, vẽ biểu đồ từ dữ liệu có được, việc ghi đã có công cụ) — phải làm luôn (trả lời + vẽ nếu được yêu cầu); chỉ từ chối ngắn gọn khi thực sự ngoài phạm vi, kèm việc thay thế làm được ngay. Ranh giới phạm vi KHÔNG ĐỔI (chỉ dữ liệu giáo viên đó, không mở sang giáo viên khác hay quản trị hệ thống). THOÁT KẸT (25/10): mỗi lượt hỏi có timeout 180 giây — quá mốc tự thoát busy + báo lỗi trong khung chat để hỏi lại (chống kẹt bong bóng 'Đang truy vấn dữ liệu thật của lớp…'); kết quả về muộn sau mốc bị bỏ qua; không đổi prompt/tools/cách truy vấn. ĐỢT 4 (25/10): get_student_profile nay có series tiến độ theo chủ đề (chuDe × phanTramHoanThanh) nên render_chart vẽ được sơ đồ tổng quan học sinh — trước đây thiếu series nên model bịa lý do 'thiếu trường'; quy tắc 5g (vẽ tổng quan HS luôn vẽ được) + 5h (tham chiếu mơ hồ không tên thì hỏi lại, không gọi công cụ với tên đoán/rỗng); lỗi 400/INVALID_ARGUMENT dừng chuỗi model ngay, trả câu hỏi làm rõ thay vì retry cùng contents.", "5e84045a-2e2f-4c15-bbf8-aa4e4359e4c3": "Đã nối lại dây ngân hàng câu hỏi vào Phân tích (22/10): cổng giáo viên nay nạp và truyền ngân hàng câu hỏi thật xuống màn Phân tích — trước đó tab Phân tích câu hỏi và tra cứu trong Hồ sơ học sinh luôn nhận ngân hàng rỗng nên hiện 0 dù kho có 27 câu", "2f73bc81-fdc4-4223-9270-a84f1acaa2cf": "1.9 Cài đặt", "90e929bd-6564-4180-a421-0d56fd909b5e": "Cấu hình ngưỡng XP — kiểm tra thứ tự ngưỡng, chặn giá trị 0 / trống trước khi lưu", "fd37bdc8-b363-4fba-a415-676ef8903db9": "ĐÃ XÓA TOÀN BỘ box AI (25/10, theo lệnh chủ dự án 'xóa luôn chứ gỡ gì'): hộp nhập key + chọn model + nút test + nhãn 'AI Đang Hoạt Động' đều mất, KHÔNG dòng thay thế; giáo viên không nhập key nữa, AI chạy qua proxy admin", "df8a9a2c-87a4-4a3e-af54-34797693cf62": "Đổi mật khẩu: kiểm tra mật khẩu hiện tại + lưu thật (25/10: mật khẩu lưu trong Supabase Auth, không còn cột password_hash; tự đổi qua supabase.auth.updateUser, đổi cho học sinh qua route /api/admin/users)", "81f56b8b-efa3-40c1-8577-7b624d9ffc1c": "Cỡ chữ hiển thị (Chuẩn / Lớn 112% / Rất lớn 125%) — phóng toàn cục theo đúng tỉ lệ", "3e1ed2e0-4c2c-423c-95a4-05bf429c0661": "Đã gỡ khu vực 'Đặt lại dữ liệu demo' khỏi bản khách thật", "df9bb9aa-32a0-41f5-9169-3970c3ec338f": "2. HỌC SINH", "e9727b02-158e-4625-a3c9-f18a451c9ec4": "2.1 Trang chủ", "a408f0f7-9605-4c2b-8641-ab4c6eac3116": "Lời chào theo hồ sơ thật (đúng tên, đúng lớp) — học sinh mới bắt đầu TRẮNG, không thừa hưởng tiến độ mẫu", "7bf53f0c-701e-451d-a77c-d22d51449c9d": "Chủ đề học kỳ này: thẻ cao đều nhau, chân thẻ ghim đáy ('X bài giảng · Vào học'); từ 24/10 chỉ hiện tối đa 4 thẻ, xem toàn bộ bằng nút 'Tất cả bài học' sang mục Học bài", "82f322b8-fd70-40dc-9df5-dfb3c667e813": "Thẻ 'Nhiệm vụ tuần' (từ 25/10 trở về như trước đợt 2, theo quyết định chủ dự án): CHỈ liệt kê BTVN quiz, KHÔNG gộp bài BI; học sinh có bài BI được giao vẫn thấy thẻ này trống (đã chấp nhận) — danh sách đầy đủ ở mục Bài tập; mỗi dòng có tiêu đề/số câu/hạn nộp/trạng thái + nút Làm bài/Làm lại; tối đa 4 bài, nhiều hơn thì 'Xem tất cả' sang mục Bài tập", "c645889d-8800-4670-a8e3-a5e19360f51c": "Điểm danh mỗi ngày (nhận XP theo mức giáo viên cấu hình)", "6786ca6d-65eb-45a3-8ebc-e198d76606fe": "Biểu ngữ bài mới nhất chưa đọc + nút 'Vào làm ngay'", "acee672a-f935-4d4a-845b-41590314e67d": "Gợi ý bài học tiếp theo", "6ca6f4d9-6f25-4668-a0f4-fa1fbddc53ac": "Tiến độ năng lượng học tập hôm nay (phút học tích cực / XP hôm nay — không còn trần)", "5108d8e3-aaba-4ba8-b7f3-993a582270de": "Khu Bài tập về nhà – Bài kiểm tra – Bài luyện tập", "ea0558da-282e-4f6c-ba65-95b8c4866bd8": "Đã gỡ khỏi trang chủ (25/10, sửa hiểu sai vòng 3): mục 'Bài tập được giao' (bài tập độc lập, AssignedHomeworkSection) không còn ở Home; các bài đó chỉ còn ở mục Bài tập (tab Về nhà) — bấm vào mở MÀN LÀM BÀI thật: trả lời từng câu (trắc nghiệm chọn ký tự A–D, điền khuyết, tự luận), đồng hồ đếm ngược và tự nộp khi hết giờ nếu bài có giới hạn; nộp bài ghi attempts + attempt_answers, thấy ngay điểm phần tự chấm, câu tự luận báo 'chờ giáo viên chấm'", "91b3a544-76c7-4265-9ddc-f3c2d36ddd3e": "Cần ôn lại (các chủ đề yếu)", "0305ede3-b36a-443d-81fc-b0965843879d": "Rương quà bí mật (gợi mở sang mục Đổi quà; mốc gần đạt nhất tính theo danh mục hợp nhất từ 24/10)", "2f794247-1b5b-463d-bdf2-296d971a518c": "Xem trước Cây tri thức", "0d5a52be-8374-497a-b98f-1f993456dd46": "2.2 Học bài", "2319cc3a-5c40-4133-9927-1020fe95907c": "Danh sách chủ đề → bấm nút 'Học bài' trên từng thẻ chủ đề để mở danh sách luồng học", "22b1aed6-b5d6-4371-9387-6a15925b2f69": "Nút 'Học bài' thay thế 3 nút cũ (Luồng học / Xem video / Lý thuyết chung) từ 24/10: bấm thì mở danh sách các bài trong chủ đề theo ĐÚNG thứ tự cô đã đẩy (số thứ tự + icon loại + tiêu đề), bấm vào mở đúng bài — kể cả Bài tập; chỉ mục cô đã đẩy mới hiện, nháp không hiện; điều hướng từ Trang chủ/Cây/Kết quả tới chủ đề thì tự mở sẵn danh sách Học bài của chủ đề đó", "a2992810-d82e-49f1-b80c-9760f4a35303": "Học dở được khôi phục đúng bước đang học (khóa bước ổn định — không bắt đầu lại từ bước 0)", "736c60ac-5122-4d40-a133-ffccb0239d7c": "2.3 Luồng Video — tổng 48 XP", "0ee8a676-ed70-443c-b5c4-55a5e8f68549": "Bước 1: Xem video đạt 80% → +5 XP", "499268a3-74ae-4139-9fc6-676d45f7915d": "Bước 2: Đọc lý thuyết tóm tắt (các ý trọng tâm) → +2 XP", "0c56d6c7-b6e9-4791-a936-7e8328875f59": "Bước 3: Bài luyện tập → +5 XP", "8118a5d9-4048-4b30-92be-2c81f9eb3afe": "Bước 4: Kiểm tra nhanh → +8 XP", "cc12b699-b84c-40cc-bad9-04ea45a83dd6": "Bước 5: Mastery Check → +8 XP", "33b8a323-89e8-40d9-b598-34dcc5eec66e": "Bước 6: Hoàn thành toàn luồng → +20 XP", "66925450-2fba-4e71-8497-0fd4fda299c7": "2.4 Luồng Lý thuyết chi tiết — tổng 41 XP", "856ed9a8-3fa1-4f07-bd94-61822d4838c4": "Bước 1: Đọc hết khối nội dung (đủ thời gian đọc tối thiểu) + xác nhận đã hiểu → +10 XP", "e35e4c13-51f2-4e62-a434-7187f2f4907f": "Bước 2: Bài luyện tập sau lý thuyết → +5 XP", "9b0b92b7-ee3d-4d55-bcd7-97ea7a471545": "Bước 3: Bài kiểm tra lý thuyết 1 → +8 XP", "ef05d4cd-45ee-47e4-8cb4-6364fc9a390f": "Bước 4: Bài kiểm tra lý thuyết 2 → +8 XP", "3275301a-6ec4-48d4-a8e4-f197c21b2d94": "Bước 5: Hoàn thành toàn luồng → +10 XP (trước đây bị thiếu — đã cộng đúng như cấu hình hứa)", "f543f840-ddb5-4e07-8347-3bc37de2377a": "2.5 Làm bài (QuizRunner — dùng chung cho mọi loại bài)", "48811b10-32a5-40cf-b527-c4d1942e789d": "4 dạng câu: Chọn 1 đáp án / Chọn nhiều đáp án / Điền vào ô trống / Tự luận", "bd7e140f-dd40-4ea6-88c0-b2dcf919304e": "Đồng hồ đếm ngược theo thời lượng bài; HẾT GIỜ TỰ NỘP phần đã làm (đã sửa lỗi nộp bài trống)", "7be4f996-2283-4a1b-ad3b-1a338569a462": "Hộp xác nhận nộp bài: báo số câu chưa trả lời; chống nộp 2 lần", "cc04d03e-00b0-4d7c-854b-cca7612031ca": "Bài có câu điền khuyết không còn chết im lặng khi nộp: đáp án được chuẩn hóa về dạng danh sách; lỗi lạ thì báo rõ + mở lại nút nộp để nộp lại", "f6bbeab6-a71b-45e2-a004-33e45416fa63": "Màn hình KẾT QUẢ sau mỗi quiz: điểm /10, XP THỰC NHẬN, xem lại từng câu với đúng câu hỏi đã làm (kể cả câu do GV/AI tạo)", "0ed36f20-ae9d-4e29-946e-7931db24ca5e": "Bài kiểm tra (quick/mastery/final) chỉ làm 1 lần từ 24/10: đã hoàn thành thì mở màn xem lại (đúng/sai mới nhất theo từng câu + trạng thái/điểm/nhận xét tự luận), không ghi thêm kết quả, không cộng XP; BTVN làm lại không giới hạn", "13696b2d-5842-46a2-9562-e628eba9835c": "Câu tự luận → tạo bài nộp mang đúng mã học sinh → vào hàng đợi chấm của giáo viên", "c0f5bac4-e612-4eaa-8c13-56256d3fc98f": "Bài tập về nhà / bài trong chủ đề hoàn thành → nhận XP theo đúng số XP giáo viên cấu hình trên bài (mô hình XP mới 22/10; nộp bài được giao độc lập cũng vậy)", "2906961e-91f1-41b3-bd9a-2e9b7cef97b4": "Ôn lại phần yếu: chỉ ghi nhận tiến độ, không cộng XP lẻ (mô hình XP mới 22/10 — XP chỉ từ điểm danh, quỹ chủ đề và bài kiểm tra)", "b7b70f94-ddb1-4873-ac9a-f525232843f1": "2.6 Cây tri thức — Vườn Văn Mầm Mục", "9fab1763-2433-4a6c-9070-d936f53aee65": "6 giai đoạn theo số bước học đã hoàn thành", "c7f2e354-f9eb-4efc-b4e8-1c74a86e4fc2": "Hạt mầm (0 bước)", "a81c1f0a-f79d-454a-ab18-ac2ff748c431": "Nảy mầm (3 bước)", "d17ba3e6-6922-4729-a813-9f99a3a14238": "Chồi non (8 bước)", "eda43fa3-fe9f-4d58-9819-3732ac8204b8": "Cây con (18 bước)", "11bee748-91c3-4646-8c68-1cf36133a83d": "Cây ra hoa (32 bước)", "3600ccee-6a12-423b-a23c-4a2f3e662dea": "Cây kết trái (50 bước)", "9d0474ad-e49b-4b7b-b243-2c4568186465": "Tưới nước: mỗi bước học tạo 'Nước tưới Mầm Mực' nuôi cây lớn", "e2bda043-fb2c-41cd-b0dd-068ddd550446": "15 vị trí lá trên tán cây", "f5c5e1a4-3373-4e53-a36e-fdee5cec3c20": "4 lá chính đầu tiên = 4 chủ đề đầu trong thứ tự khóa học (lá to, có nhãn tên)", "4be6fff8-07cf-4e2e-8cd3-cc5bd6a9bf27": "Từ chủ đề thứ 5: hiện ở 11 'lá ẩn' còn lại (lá nhỏ hơn, rê chuột xem tên + %)", "d8e4695f-cf9a-4e8c-a96c-1cb220c02d93": "Màu lá: Hoàn thành ≥80% = xanh lá đậm · Đang học 50–79% = xanh biển · Cần ôn lại <50% = vàng · Chưa học = xám (có hàng chú thích)", "892edfac-5fa5-406a-870a-f8a64440e1df": "Hiệu ứng NHẤP lá đã hoàn thành: lá lún xuống như bị ấn vào tán cây + vòng sáng lan tỏa", "4ee60d65-6372-450a-bb0b-6cd66f03bea1": "Ma trận năng lực: từng chủ đề × 4 năng lực", "53ebe74b-49b3-4ff0-b3ad-b732633e049a": "Huy hiệu đạt được", "082138ff-b7a8-4da1-be29-568c9cf8158a": "2.7 Kết quả học tập", "dfd0b937-7505-422b-87c8-d8ada6a46ea6": "Thẻ tổng quan: Tổng XP tích lũy (+ XP hôm nay) · Huy hiệu đạt được — đã bỏ 2 thẻ 'Câu hỏi đã làm' & 'Điểm trung bình'", "4990675c-cab1-40ff-80b7-d9ca3ca6ce89": "Điểm theo từng chủ đề", "84743776-0a10-4d10-ac0f-a6f6d0eae6d8": "Trắc nghiệm (đúng/tổng câu, điểm TB) + Tự luận (thang 10, đạt/chưa đạt với ngưỡng 5, đã chấm/chưa chấm) + lịch sử lần làm + nút 'Xem chi tiết' → popup toàn bộ bài đã làm (trắc nghiệm → tự luận) kèm nhận xét của cô ngay dưới bài làm; tự luận chưa chấm ghi rõ 'cô giáo chưa chấm'. 4 mức năng lực BỎ ở phía học sinh từ 24/10 (vẫn giữ phía giáo viên + AI)", "f354b9df-19d6-46be-99db-83b857335168": "Khối chủ đề nhuộm nền + viền theo đúng màu của chủ đề đó (tăng đậm từ 24/10)", "7ff1d670-1d78-4372-898f-6ce36304af05": "Bấm tên chủ đề → tới bài học", "1950bfce-fd7a-47ca-8acb-5cd5a5f8d19f": "Dùng chung hàm calculateAllMastery với Cây tri thức — từ 24/10 chỉ còn dùng cho chip trạng thái tổng quát (Đã hoàn thành / Đang học / Cần ôn lại / Chưa học), hàm KHÔNG bị sửa", "f94dcd78-8014-4437-8274-c66a8768d20d": "Điểm theo từng bài kiểm tra (bài tập BI cô giao): điểm cao nhất, trạng thái chấm, số lần nộp + popup chi tiết (đáp án + nhận xét của cô theo từng lần nộp); bài kiểm tra nội dung xem lại ở mục Bài tập", "e0c6eb14-346e-43bb-a5a7-0477c5e885e2": "Biểu đồ tiến bộ 6 tuần — dạng ĐƯỜNG MỐC TUẦN", "fd02e929-2394-462f-9f88-4a8a720d68ae": "Mỗi mốc là vòng tròn chứa điểm trung bình của tuần; tuần này to nhất, viền cam nổi bật", "d4213aee-bf16-4e1c-8fce-6825844abd4d": "Tuần chưa học hiện mốc xám 'Chưa học' thay vì biến mất", "675a293d-d4b5-4d86-9494-b89fb2c4d925": "Nhãn tuần dễ hiểu ('Tuần trước', '2 tuần trước'…) + số câu đã làm dưới mỗi mốc", "d825bf27-57a3-4944-9c47-fac5c5dc1e13": "Góc phải thẻ: tổng số câu + điểm tuần này", "7ec3d7e7-520e-4b6f-9ee5-46e41ec2b43e": "Thành tích & huy hiệu: toàn bộ danh mục, phân biệt đã đạt / chưa đạt", "f3a78f16-b698-4f59-b041-4f6e565b4ae9": "2.8 Đổi quà", "5cb08177-71d3-429a-941d-c04431cb4ed2": "Ví chi tiêu = TỔNG XP của tài khoản (vĩnh viễn — chỉ giảm khi xin quà); MỐC MỞ RƯƠNG xét theo XP TUẦN + số ngày điểm danh (quyết định chốt của chủ dự án)", "170ea10b-70d9-4363-812f-8c044e70d18c": "Các rương theo cấu hình: Rương Hạt / Rương Lá / Rương Hoa / Rương Vàng", "ba6550ce-ba56-4880-a422-5fd4b5ebc5fc": "Danh mục quà thật (XP / ngày điểm danh yêu cầu)", "1fcdd197-27a4-46d0-af80-cb798dfb755f": "Bookmark Mầm Mực thủ công — 280 XP · 4 ngày", "0de9fec0-0a7f-4c8c-9312-7adbb6b1d07d": "Quyền chọn bài đọc cho cả lớp — 320 XP · 4 ngày", "df07566e-3fe8-424b-9faf-f269b39e31e6": "Bút mực xanh Giấy & Mực — 450 XP · 5 ngày", "57c5bd37-26af-49ce-8e1c-d6ded337bf06": "Sổ tay Giấy & Mực bìa cứng — 650 XP · 5 ngày", "d34fc529-e6a0-462a-82f6-b35a9f28bfcb": "Rương Vàng: Bút mài nét hoa & Bộ quà lưu niệm Mầm Văn — 750 XP · 6 ngày", "a7be2568-3b6a-4c5e-a7b0-a6a5414be1be": "Danh mục hợp nhất (24/10, hướng c): 5 mốc mặc định + mốc GV phụ trách lớp mình tự tạo; giá XP theo danh mục hợp nhất; mốc gần đạt nhất ở Trang chủ cũng tính theo danh mục hợp nhất", "9141d452-793c-45f5-ba88-5790d3ee730a": "Nội dung quà thuộc loại 'secret' — học sinh không được biết trước bên trong có gì", "4f047ad8-b0e2-4641-9ce5-fdf452117678" obile header không bị ancestor nào cắt nên không sửa)", "5b9d1fa8-78dc-4d43-aef5-008425570da8": "Danh sách kiểu tin nhắn: loại bài + tiêu đề + chủ đề + thời gian; bấm vào là vào làm bài đó ngay", "52ebc18c-9b0a-4ca1-a3c1-2760f6211547": "Thông báo suy ra từ mốc xuất bản thật của nội dung: trong vòng 14 ngày, đúng lớp được giao", "681130a8-ca94-4755-8ca6-5712e4694abb": "Trạng thái đã đọc lưu THEO TÀI KHOẢN → đồng bộ mọi thiết bị (thay cơ chế cũ chỉ lưu trên máy giáo viên)", "19815cb7-748c-4dde-8eeb-7f29ef3f6ee1": "2.11 Bài tập (mục mới 24/10, nằm ngay dưới mục Học bài ở thanh điều hướng)", "3e23dff8-4c23-4216-9994-0138c8034636": "2 tab: 'Kiểm tra' / 'Về nhà', sắp xếp theo hạn nộp (không hạn thì xếp cuối)", "57bed4b9-5289-49e0-896e-54655e7041c1": "Tab Kiểm tra: quiz nội dung loại quick/mastery/final; tab Về nhà: quiz homework + bài tập BI cô giao (display_location luôn là HOMEWORK)", "70982c32-678f-494a-923c-457848c4aaf0": "Bấm bài chưa làm → mở làm bài; bấm bài kiểm tra đã làm → màn xem lại, không tính điểm mới (xem 2.5)", "11bb26c4-53c3-41d0-8d9f-e12345972b76": "3. ADMIN", "d5062db4-7d2a-470f-8ef6-551b3446c347": "Quản lý tài khoản giáo viên: danh sách, tạo mới (họ tên, tên đăng nhập, mật khẩu, liên hệ, ghi chú), sửa thông tin", "e28d8a74-dd95-4b11-8368-975c024eaae9": "Tạm khóa / Mở khóa tài khoản giáo viên", "cb12ba4e-6ae2-4cd9-a5bc-5cbbb404e725": "Xóa tài khoản giáo viên", "ce82828f-2131-4b29-9b33-91d479cfed3c": "'Truy cập với tư cách Giáo viên này' — đóng vai GV để hỗ trợ", "71bd04b0-d2fe-47e9-b07f-ee953047e47f": "Tải lại danh sách · Đăng xuất khỏi Cổng Admin", "6c68865c-837a-47bf-8ed9-cde8050cd785": "ĐÃ VÁ 21/10: đăng nhập Admin dùng tài khoản THẬT trong DB (bảng teachers, role='admin' — migration_006); đã gỡ thông tin cứng khỏi cả 2 đường Supabase + mock và bỏ bí danh cũ; cổng Giáo viên chỉ nhận role='teacher'", "a96edefa-3869-4486-adad-70afdf08c45d": "Cấu hình Mầm AI (25/10, AdminAiSettings trong AdminPortal): đổi model từng nấc (Gemini / Groq / OpenRouter), đổi thứ tự chuỗi failover bằng nút lên/xuống, bật/tắt từng nấc; lưu qua /api/admin/ai-settings, test từng nấc qua /api/admin/ai-test; test đọc cấu hình ĐÃ LƯU nên nút test lưu trước rồi test; key KHÔNG nhập ở UI — key nằm trong biến môi trường Vercel (GEMINI_API_KEY / GROQ_API_KEY / OPENROUTER_API_KEY)", "055a355d-e1a0-4f8c-a8ee-83b42d8d945d": "4. HỆ THỐNG & DỮ LIỆU (dùng chung)", "0cb20ccc-5b9a-4157-aab6-a079293874a0": "4.1 Đăng nhập & phiên", "23c91a3a-27fc-4daf-b630-e82ba6b2b8ad": "3 vai trò: Học sinh / Giáo viên / Admin — đăng nhập bằng tên đăng nhập + mật khẩu (25/10: mật khẩu nằm trong Supabase Auth, không còn trong bảng public; tên đăng nhập + mật khẩu giữ nguyên qua migrate)", "1a3f3a7b-f762-4263-bbdb-d40c3579ef9a": "ĐÃ XÓA cửa hậu mật khẩu phổ thông ở cả 2 kho dữ liệu (trước đây mọi tài khoản vào được bằng mật khẩu mặc định, kể cả sau khi chủ tài khoản đã đổi mật khẩu khác)", "8bb02398-9cce-4f03-9eab-786fbc56c74d": "Lỗi đăng nhập báo rõ; không còn gợi ý mật khẩu trong thông báo lỗi", "3e65b090-8e0b-4cea-8a03-7bb8151dc086": "ĐÃ VÁ 22/10 — hết 'phiên ma' sai danh tính: máy chủ lỗi/thoáng chập thì đăng nhập BÁO LỖI KẾT NỐI, tuyệt đối không rơi về tài khoản mẫu (trước đây cùng mật khẩu là vào được hồ sơ mẫu khác tên/khác lớp); phiên mẫu đã lưu (id không phải UUID) bị hủy khi tên đăng nhập tồn tại trên máy chủ; nạp state học sinh tra thẳng dòng tài khoản thật để tên + lớp luôn đúng người", "ff546f7b-a5f6-43c7-9d19-585ed2984475": "'Xem góc Học sinh' cho GV/Admin: lưu phiên gốc, thanh cảnh báo cố định + nút 'Thoát xem thử' quay về đúng phiên", "74d297aa-248d-4e9a-afcc-5e71a4dc762e": "Supabase Auth (25/10): đăng nhập bằng supabase.auth.signInWithPassword với email tổng hợp ${role}_${username}@mamvan.internal (tiền tố role chống đụng email GV/HS trùng tên); hồ sơ tra theo cột auth_user_id (không tra username); sai vai trò / thiếu hồ sơ / tài khoản khóa → signOut + báo lỗi chung, không liệt kê user; phiên kiểm tra lại bằng supabase.auth.getSession (không JWT thì hủy phiên local); chỉ khi Supabase chưa sẵn sàng mới dùng kho mock — hết fallback khi đăng nhập sai/thiếu user", "998b780e-0301-4dd4-ab41-9712b6f39b65": "Migration 015 — Supabase Auth + RLS (25/10, file database/migration_015_supabase_auth_rls.sql, CHƯA CHẠY — chạy cùng đợt deploy vì khóa app cũ ngay): thêm cột auth_user_id (UNIQUE, FK auth.users) cho teachers + students; helper SECURITY DEFINER is_admin (JWT app_metadata role='admin') / my_teacher_id / my_student_id / my_class_id / teacher_of_class; xóa TOÀN BỘ policy allow-all cũ (migration_005, từng là stopgap cho cảnh báo CRITICAL 20/10) rồi tạo policy theo vai trò: admin_all mọi bảng, GV chỉ scope của mình (hồ sơ + lớp + nội dung teacher_id + học sinh/attempts/reviews/essays/reward_requests của lớp mình + reward_tiers/system_settings của mình, WITH CHECK role='teacher' chống tự nâng quyền), HS chỉ scope của mình (dòng mình với WITH CHECK giữ nguyên id+class, lớp mình, nội dung của GV lớp mình, attempts/answers/essays/states/progress/sessions/reward_requests của mình, reward_tiers + system_settings của GV lớp mình), dim_date SELECT cho authenticated, ai_settings KHÔNG policy (chỉ service role), anon KHÔNG policy nào; thứ tự deploy: code mới → migrate-auth ngay → test 3 vai trò; rollback = redeploy prod cũ", "4418a320-57ec-4e16-8202-8baf707cf25a": "Route 1 lần /api/admin/migrate-auth (25/10, gated bằng env MIGRATION_TOKEN so sánh hằng thời gian, 500 nếu chưa đặt): với mỗi GV/HS chưa gắn auth_user_id, đọc mật khẩu plaintext hiện tại chỉ trong bộ nhớ server (không in/log/trả), mật khẩu <6 ký tự thì báo failed để admin reset sau; tạo auth user (email tổng hợp, mật khẩu GIỮ NGUYÊN, email_confirm, app_metadata role, user_metadata username), trùng email thì tra listUsers rồi gắn; ghi auth_user_id rồi NULL password_hash (+ teachers.gemini_api_key); chỉ đặt cờ auth_migrated.done khi 0 lỗi; chạy lại idempotent, bỏ qua dòng đã gắn", "2a8704c6-3da0-485d-b229-8dcdd0e5140f": "Proxy AI /api/ai/chat (25/10): bắt buộc Bearer JWT, verify qua Auth API getUser (401 nếu thiếu/sai — đây là cổng chống lạm dụng v1, chưa có rate limit cứng); body giữ nguyên dialect Gemini (contents / systemInstruction / tools) để vòng tool ở trình duyệt không đổi; chuỗi failover theo thứ tự admin cấu hình (mặc định Gemini → Groq → OpenRouter), mỗi nấc 1 lần thử, timeout 25s/nấc, maxDuration 60s (Vercel); trả đúng shape Gemini (candidates/content/parts, finishReason STOP) kèm servedBy/legModel; mọi nấc 400 → 400 BAD_REQUEST, còn lại → 502 PROVIDER_ERROR với thông báo đã lược chuỗi giống key, cắt 200 ký tự; /api/health không secret, trả configured/model từng nấc (dùng kiểm tra routing /api qua SPA rewrite)", "39e7dbf2-41f7-493c-8585-7f668abeccfe": "Mật khẩu qua /api/admin/users (25/10, JWT admin hoặc GV trong scope): create (admin tạo GV; admin tạo HS mọi lớp / GV tạo HS lớp mình; thiếu tên thì báo NAME_REQUIRED; lỗi insert hồ sơ thì xóa auth user mồ côi), reset-password (GV chỉ được tự đổi mình hoặc HS lớp mình), rename-student (đổi cả email auth + username hồ sơ, lỗi hồ sơ thì rollback email auth); lỗi route KHÔNG fallback về mock (tránh lệch tài khoản local/prod); tự đổi mật khẩu qua supabase.auth.updateUser; grep xác nhận frontend không còn ghi password_hash nào", "22a5729e-84d1-448b-8f37-13552f2045db": "Xem góc Học sinh KHÔNG đổi JWT (25/10): xem trước hs001 giữ nguyên JWT giáo viên — hồ sơ hs001 đọc bằng quyền GV (hs001 thuộc lớp của gv001); xem trước chỉ xem, không ghi bài (ghi cần JWT học sinh nên RLS chặn); giáo viên khác lớp hs001 bị chặn rõ ràng thay vì hiện dữ liệu mẫu đội lốt thật (repo fallback về mock khi RLS chặn → bắt bằng kiểm tra id UUID); thoát xem thử không còn kẹt JWT học sinh (lỗi cũ: thoát chỉ khôi phục object phiên mà JWT vẫn là của HS nên màn GV bị RLS chặn tới khi đăng nhập lại); localStorage giữ nguyên phiên GV suốt lúc xem trước", "0e4157c5-cc31-4a5f-a5e5-26635e526555": "Đăng xuất xóa cả phiên đóng vai — hết đường leo quyền trở lại", "45364195-cc2c-4647-a2a8-545b054c4afb": "Bộ đếm giờ học tích cực chỉ chạy khi người dùng thật là học sinh", "e7a4347b-c4a7-4e9e-a02c-1fb62c70708e": "4.2 Máy XP (xpEngine)", "6f205578-a768-4fdb-9daa-3e12dd53f2f7": "XP phẳng theo HOÀN THÀNH — không gắn với điểm số (quyết định chốt của chủ dự án)", "bc2d702b-e567-4c49-b524-2b3e61e15a2e": "awardXP lật ngày / tuần theo GIỜ ĐỊA PHƯƠNG: ngày mới từ 00:00 giờ VN (đã sửa lỗi ngày UTC bắt đầu 07:00 khiến điểm danh 2 lần trong một buổi sáng); khóa tuần theo thứ Hai", "9fa73906-1428-4729-825b-1dfa56b87944": "MÔ HÌNH XP MỚI (22/10/2026 — chủ dự án chốt): XP chỉ còn 3 nguồn — ĐIỂM DANH NGÀY (số XP giáo viên cấu hình, là mục duy nhất còn lại ở màn Cài đặt), QUỸ XP CỦA CHỦ ĐỀ và XP CỦA TỪNG BÀI KIỂM TRA / BÀI ĐƯỢC GIAO", "97bb47eb-d2c1-4265-8290-3aa82ca38c96": "Quỹ XP chủ đề: giáo viên đặt số XP ngay trong cửa sổ Chỉnh sửa chủ đề (xpReward trong payload chủ đề); học sinh nhận ĐỦ đúng 1 lần khi hoàn thành TOÀN BỘ chủ đề — xem trọn luồng video, học xong lý thuyết, làm ĐÚNG HẾT phần chấm tự động của mọi bài trong luồng (câu tự luận không chặn điều kiện); bộ đánh giá topicCompletion chạy ở App sau mỗi thay đổi tiến độ học", "bd6c9010-384d-4bbe-8d6f-072d682aefd3": "XP bài kiểm tra / bài được giao: học sinh NỘP BÀI LÀ NHẬN (không xét đúng sai), 1 lần mỗi bài — bài độc lập lấy cột xp_reward trên chính bài (migration_010, nhập trong màn soạn bài), bài trong chủ đề lấy ô 'Điểm thưởng XP khi hoàn thành' ở Cài đặt bài của QuizBuilder", "427cb297-39ba-4f7a-9620-caaed43bde83": "ĐÃ BỎ HẾT: trần XP ngày theo phút học (130/150), trần tuần 900 và toàn bộ cộng XP lẻ theo hành động (xem video 80% = 5, đọc tóm tắt = 2, luyện tập…); các bước học trong luồng Video/Lý thuyết giờ chỉ GHI NHẬN hoàn thành (recordStepCompletion) phục vụ Cây/Năng lực và điều kiện quỹ chủ đề; màn Cài đặt XP rút còn Điểm danh ngày; trang chủ học sinh bỏ hiển thị trần ngày", "01a2247b-0957-4906-93c4-25d9665c87a9": "Tách 'tiến độ học' khỏi 'đã trả XP' (xpAwardedSteps) vẫn giữ: mỗi khóa XP (attendance:<ngày> / topic:<id>:complete / assignment:<id>:submitted / quiz:<id>:completed) chỉ trả đúng 1 lần — hết lỗi 'từ ngày thứ 2 mọi lần cộng XP đều trả về 0'", "536f9a41-05df-4034-a857-83d6e5d3d9af": "4.3 Kho dữ liệu 2 lớp", "d6968c79-656b-4af5-9135-e62be372f2a7": "Supabase (PostgreSQL) là kho chính — 22 bảng: 12 bảng vận hành (học sinh, giáo viên, lớp, chủ đề, video, lý thuyết, quiz, câu hỏi, bài nộp tự luận, state học sinh, yêu cầu quà…) + 10 bảng tiến độ/phân tích thêm ở migration_008 (luồng học, nối hoạt động–câu hỏi, bài độc lập, nối bài–câu hỏi, giao bài từng em, lượt làm bài, câu trả lời, phiếu chấm, phiên đăng nhập, bảng ngày)", "52b915ab-2794-4493-9d3f-1e7845ccbe83": "Tách dữ liệu RIÊNG theo giáo viên (21/10, migration_007): mọi nội dung gắn teacher_id của người tạo; đọc/ghi nội dung, ngân hàng câu hỏi, chấm bài và thống kê đều lọc theo giáo viên của phiên đăng nhập; bộ nhớ đệm trình duyệt được dọn khi đăng xuất và chỉ nhận dữ liệu mang dấu chủ của đúng tài khoản — hết cảnh các giáo viên thấy/dùng chung dữ liệu của nhau", "72e3abb1-4169-48b5-b362-442e920b2008": "Kho mock (localStorage) làm dự phòng khi mất kết nối: đọc GỘP dữ liệu 2 nơi (bài nộp, học sinh, lớp) để không bao giờ thất lạc dữ liệu", "544952a0-7923-4444-abe2-92b8d0dce565": "Cổng chặn ghi state: chỉ lưu sau khi state THẬT của đúng học sinh đã nạp xong — hết lỗi state mẫu (310 XP, huy hiệu sẵn) ghi đè lên DB", "2bb5de26-23ae-4559-887b-ab5aa8a3e6fe": "ĐÃ XÓA SẠCH DỮ LIỆU MẪU (22/10, rà soát toàn diện theo lệnh chủ dự án): file mockData.ts (1.038 dòng) bị xóa hẳn; MỌI màn hình hết dự phòng bằng dữ liệu mẫu — Học bài/thẻ video không gộp bài mẫu, video/lý thuyết không thấy thì báo không tìm thấy (không thay bằng bài khác), làm bài/kết quả/BTVN chỉ dùng câu hỏi + bài thật; state khởi tạo là state TRỐNG (0 XP) thay cho state mẫu 310 XP; kho local hết tự gieo state mẫu; tính năng 'Đặt lại dữ liệu demo' bị gỡ; phân tích học sinh hết bịa 'đáp án đã chọn' (hệ thống không lưu lựa chọn — chỉ hiện đáp án đúng khi tra được câu thật); kho bài tự luận tra đề thật từ bảng questions. Bổ sung cùng ngày: bảng điểm nội bộ hết gán nhãn lớp bịa '7A3' (điều kiện cứng thời demo) — tên lớp tra từ danh sách lớp thật/hồ sơ học sinh; xu hướng điểm tuần bỏ chia đôi theo 2 lớp demo. Mọi con số trên màn hình đều truy được nguồn trong DB; còn cấu hình cứng duy nhất là catalog quà/huy hiệu + cấu hình XP mặc định (định nghĩa sản phẩm). ĐỢT BỔ SUNG CHIỀU 22/10 (quét lại các file đợt sáng chưa chạm): thẻ Tổng quan hết '+15%' bịa khi không có kỳ trước (không có dữ liệu so sánh thì ẩn huy hiệu), mẫu số tỉ lệ hoàn thành = tổng bước học THẬT của các chủ đề (video + lý thuyết + bài; cổng GV nay nạp thêm danh sách bài), thời gian học TB chỉ tính giây hoạt động ghi thật (bỏ 'mỗi ngày điểm danh = 30 phút' và phép chia 6 tuần); Phân tích câu hỏi bỏ hẳn 'đáp án nhiễu được chọn nhiều nhất' (hệ số 0,65 bịa — dữ liệu không lưu đáp án HS chọn) và thời gian làm bài gán cứng 140/45 giây theo mức; Xưởng chấm AI hết gieo bài mẫu chấm sẵn + rubric mẫu (thư viện mặc định RỖNG, chỉ hiện dữ liệu GV tự tạo) và xóa hẳn nhật ký kiểm toán mẫu; state khởi tạo hết mặc định lớp bịa 'Lớp 7A2' + trường cứng (không tra được lớp thật thì để trống) cùng mọi fallback tên lớp '7A2' còn sót ở kho dữ liệu/màn hình; Cài đặt gỡ hẳn các trường trần XP đã bãi bỏ (130/150/900) khỏi mặc định + kiểu dữ liệu + hằng cấu hình và trung tính hóa tên trường/lớp mặc định bịa (cài đặt vẫn lưu trong trình duyệt theo từng GV — chưa chuyển lên bảng system_settings). ĐỢT CUỐI TỐI 22/10 (2 cụm ngoài checklist, chủ dự án duyệt xử nốt): tab Tương tác & chuyên cần bỏ hẳn 'thời gian mở web' suy diễn (phút học × 1,35 + 15 — hệ thống không đo chỉ số này), phút học hết cộng 28 phút/ngày điểm danh (chỉ tính giây học ghi thật như thẻ Tổng quan), cột + thẻ 'chạm trần XP' bị gỡ (khái niệm trần đã bãi bỏ) thay bằng chuỗi ngày điểm danh liên tục dài nhất và tổng số buổi điểm danh thật, tỉ lệ chuyên cần hết mặc định 85% khi chưa có dữ liệu (hiện '— Chưa có dữ liệu điểm danh'); biểu đồ hoạt động theo ngày ở Tổng quan + trợ lý và hoạt động tuần trong hồ sơ học sinh hết nhân 32 phút/HS điểm danh (state không lưu phút học theo ngày/tuần — chỉ còn số học sinh hoạt động và ngày điểm danh thật); bảng điểm nội bộ gỡ nốt phép cộng 1800 giây/ngày điểm danh và chia 6 tuần; chỉ số độ tin cậy AI ở Xưởng chấm: chưa có bài nào vừa có gợi ý AI vừa có điểm chốt thì trả null -> giao diện báo 'Chưa đủ dữ liệu' (hết số mẫu 0,35/8,5%/36 bài cứng), xu hướng tuần gom theo tuần chốt điểm thật và chênh theo tiêu chí ghép cặp điểm rubric AI/GV theo tên tiêu chí", "75081487-aedd-46d6-9b07-cbc97f577fbf": "Học sinh mới bắt đầu TRẮNG với hồ sơ thật (đúng tên + đúng lớp) ở cả 2 nhánh đọc state", "f7eee752-abf6-468a-b39d-326b16395f2d": "useLiveQuery + eventBus: đồng bộ tức thời giữa các màn hình theo đúng khóa sự kiện (quiz / content / class…)", "493b69b1-df4b-4359-bde1-682a0679e2d0": "Migration chờ chủ dự án chạy trong Supabase SQL Editor: 003 (trạng thái quà GIVEN/OPENED) + 004 (cột payload giữ đủ trường câu hỏi) — app đang chạy chế độ tương thích an toàn trong lúc chờ", "b033c0dd-d74a-438f-a980-6429aabba727": "Đã sao lưu toàn bộ 12 bảng trước khi dọn dữ liệu test: xóa 21 HS test + 15 bài nộp test; giữ lại hs001, 5 giáo viên, 4 lớp, toàn bộ nội dung thật (6 chủ đề, 97 câu hỏi, 33 quiz, 19 video, 6 lý thuyết)", "1c5fc783-17cf-43b3-b3f4-9c054f196a5d": "4.4 Giao diện & hiệu năng", "2299cdba-848b-4bc7-aac4-d63e79bb1568": "Mọi hộp thoại xác nhận dùng ConfirmDialog giữa màn hình (6 chỗ từng dùng hộp thoại mặc định của trình duyệt đã thay hết)", "767c4e1f-c356-4693-bee7-a7b8ce6b3c53": "Nút điều hướng tự nhả focus sau khi bấm — hết vòng đen focus bám trên nút menu", "62fd0cf3-3ee9-4067-bbbc-38b6e2448fd5": "Tải lười (React.lazy): gói JS ban đầu 2,37 MB → ~0,79 MB; phần giáo viên (~1,08 MB) và thư viện biểu đồ (~0,39 MB) chỉ tải khi vào đúng khu vực", "9c77ca4a-11e6-4401-805e-6ef9687c026f": "DevPanel (cộng XP / tự duyệt quà / tự chấm 9.0 / đặt lại dữ liệu demo) CHỈ có ở bản development — đã kiểm chứng bị loại khỏi gói production", "5ebea996-e899-487a-bf71-daa4fa10e46c": "5. KHUNG ĐO NĂNG LỰC (từ sơ đồ gốc của chủ dự án — đã có dữ liệu đỡ)", "baed71a5-b5a6-4593-a27a-214f0fb1ccaf": "Mỗi lần làm bài xong, đo được từ học sinh: điểm theo câu / chủ đề, năng lực, độ khó, tỉ lệ đúng, thời gian", "836b53ed-b8f4-4d3b-ae5f-0a04b1ecc65e": "4 năng lực × dạng đo × độ khó", "be7a31a8-4e93-4078-b6a6-721e0f57233f": "Nhận biết → Trắc nghiệm — Dễ", "d9dc5440-f50e-482b-a625-d77983009d20": "Thông hiểu → Trắc nghiệm — Trung bình", "16391fe9-a28b-471b-92e3-989c354deefe": "Phân tích → Trắc nghiệm — Khó · Tự luận chấm Rubric — Khó", "e062c389-6434-4d61-abbe-add3a0f63ef3": "Vận dụng → Tự luận / viết văn (đoạn 5–7 câu, bài 150–200 chữ) chấm Rubric — Khó", "bc1981b9-c354-4113-b49a-e44c3d0c0b26": "Biểu thị khách quan: % thành thạo từng năng lực theo chủ đề (calculateLevelMastery / calculateAllMastery) + trạng thái Vững / Đang tiến bộ / Cần ôn lại / Chưa học", "279e986f-6eb4-4b58-bc04-eb6adac11d9a": "Dữ liệu nền cho phân tích", "9b7fbea9-84ee-4319-9bf3-b0c8fcebbb57": "Đăng nhập & chuyên cần: có thường xuyên vào học không, ai ít đăng nhập (điểm danh + phút học tích cực theo ngày)", "c0a2e6ed-5927-4936-a659-6f12965e617a": "Năng lực qua bài tập: kết quả từng câu gắn năng lực + độ khó", "aadd085c-3ae4-48ae-bd74-9e444b68d107": "Dữ liệu tiến độ tường minh (migration_008, nạp từ dữ liệu giả lập Power BI 21/10): phiên đăng nhập thật theo ngày/thiết bị/thời lượng, lượt làm bài + từng câu trả lời (đáp án đã chọn, thời gian làm), phiếu chấm — hiển thị ở màn giáo viên 'Tiến độ bài làm' và mục 'Bài tập được giao' ở trang chủ học sinh", "c2983111-32ce-4448-a0ec-30f220fd45d7": "Đầu ra đã nối chung 1 hàm tính: Kết quả học tập của học sinh · Ma trận năng lực ở Cây tri thức · Phân tích của giáo viên", "ad39f5f4-e6ec-4eec-83fe-5100ca09129a": "6. KIỂM CHỨNG & TRẠNG THÁI DỰ ÁN", "d735fdf3-fd39-4954-9666-021df97f3d55": "Cổng TypeScript trong lệnh build (tsc --noEmit && vite build): 18 lỗi type ban đầu → 0 lỗi", "6e17aba1-c1e7-438b-bfd1-ec4e11aee594": "Test logic tự động scripts/test_round2_logic.ts: 34/34 đạt (XP, lật ngày/tuần, đổi quà trừ TỔNG XP + hoàn khi từ chối, sinh tên đăng nhập / mã HS)", "ded0243c-d7d7-4e6f-9c1a-5c7aa5d624e9": "Đợt 0–6 + QA vòng 2 + các đợt tinh chỉnh ngày 18/10: đã đẩy nhánh dev (81c8bc1) và deploy production https://mamvan.vercel.app", "df5c571e-4dae-4440-8853-2ee46cd624f9": "Đợt bảo mật 21/10 (theo audit): vercel.json thêm header bảo mật production (CSP, X-Frame-Options SAMEORIGIN, CORS thu hẹp về mamvan.vercel.app, nosniff, Referrer-Policy, Permissions-Policy, HSTS) + gỡ email hardcode khỏi TeacherTopbar — commit 1eb682d, đã deploy và kiểm chứng header trực tiếp trên production", "2894ddda-b20c-446b-a654-e54eb6bfbfda": "Đợt Admin thật 21/10: gỡ đăng nhập Admin ghi cứng khỏi mã nguồn (repo công khai) — Admin thành tài khoản thật trong bảng teachers role='admin' (migration_006_admin_account.sql), cả 2 đường Supabase + mock đều tra cứu tài khoản thật; ĐÃ chạy migration_006 vào DB + deploy production + kiểm chứng 3 ca đăng nhập trên production tối 21/10 (admin thật vào được Cổng Admin, bí danh cũ bị báo không tồn tại, sai mật khẩu bị từ chối)", "731f3dab-0d8a-4856-8f24-aeb65f09158f": "Đợt tách dữ liệu theo giáo viên 21/10 (GĐ1 của kế hoạch xóa DB + nạp dữ liệu giả lập): migration_007 ĐÃ chạy vào DB thật (thêm teacher_id cho video/lý thuyết/quiz/câu hỏi + gán nội dung vô chủ về gv004, 0 dòng còn thiếu chủ); code đã vá 8 điểm rò (lọc đọc theo chủ, đóng dấu khi ghi, cache theo tài khoản + dọn khi đăng xuất, cài đặt riêng từng giáo viên, bỏ gộp câu mẫu dùng chung) — kiểm chứng A/B 2 tài khoản trên production ĐẠT tối 21/10 (giáo viên B không thấy bất cứ dữ liệu nào của A ở cả 3 màn, học sinh của A thấy đúng nội dung A xuất bản)", "c6be9b74-9b1b-409e-a883-6188b00976d4": "Đợt LUỒNG HỌC TRONG CHỦ ĐỀ 22/10 (kế hoạch đã duyệt kèm 7 ảnh chụp của chủ dự án): bỏ tự sinh video nháp khi tạo chủ đề (+ xóa 2 video nháp ma ở chủ đề 'Văn 7' khỏi DB) → menu Tạo mới hợp nh ], ["c253b526-a898-46ff-9a0d-f04d3e3baf91", "8ae2bd77-b738-42bd-9a2b-aaeee4f26b8a"], ["d3cfb1a8-a667-4cf0-a5ce-02c31befb460", "8ae2bd77-b738-42bd-9a2b-aaeee4f26b8a"], ["4e444fc9-f043-4946-8f12-829ddc231b57", "a8956589-763a-48f7-a19b-155e9e077b38"], ["1bd881b5-a712-4559-8d14-19195cac2ac1", "22f0de47-cf3c-45b7-9848-9d144f6754a4"], ["aeab126e-ec0f-4c44-9bc5-7ec8be1be712", "082138ff-b7a8-4da1-be29-568c9cf8158a"], ["f3a78f16-b698-4f59-b041-4f6e565b4ae9", "d80e0c2a-3c7a-45be-9107-987be8791e4c"], ["d80e0c2a-3c7a-45be-9107-987be8791e4c", "f3a78f16-b698-4f59-b041-4f6e565b4ae9"], ["8f04c998-d94f-45ee-9951-1d474a6a2f58", "f3a78f16-b698-4f59-b041-4f6e565b4ae9"], ["dddd0958-57d2-4648-8017-b05161bf5806", "5cb08177-71d3-429a-941d-c04431cb4ed2"], ["e7a4347b-c4a7-4e9e-a02c-1fb62c70708e", "736c60ac-5122-4d40-a133-ffccb0239d7c"], ["e7a4347b-c4a7-4e9e-a02c-1fb62c70708e", "66925450-2fba-4e71-8497-0fd4fda299c7"], ["1950bfce-fd7a-47ca-8acb-5cd5a5f8d19f", "b7b70f94-ddb1-4873-ac9a-f525232843f1"], ["5ebea996-e899-487a-bf71-daa4fa10e46c", "22f0de47-cf3c-45b7-9848-9d144f6754a4"], ["ff546f7b-a5f6-43c7-9d19-585ed2984475", "df9bb9aa-32a0-41f5-9169-3970c3ec338f"], ["ce82828f-2131-4b29-9b33-91d479cfed3c", "545fe58c-a46f-4dd9-8d6b-03c44ab2e6a2"], ["486af866-2881-4f62-9f7a-24457d1bb251", "d3cfb1a8-a667-4cf0-a5ce-02c31befb460"], ["c645889d-8800-4670-a8e3-a5e19360f51c", "5cb08177-71d3-429a-941d-c04431cb4ed2"], ["f4686f66-d155-49a6-9c47-cdb466053652", "28cf403c-06a0-42c4-9291-03413b83ec8a"], ["2906961e-91f1-41b3-bd9a-2e9b7cef97b4", "91b3a544-76c7-4265-9ddc-f3c2d36ddd3e"], ["19815cb7-748c-4dde-8eeb-7f29ef3f6ee1", "f543f840-ddb5-4e07-8347-3bc37de2377a"], ["c253b526-a898-46ff-9a0d-f04d3e3baf91", "5c5e5518-67a3-4939-b42c-499fcef31516"], ["1bd881b5-a712-4559-8d14-19195cac2ac1", "5c5e5518-67a3-4939-b42c-499fcef31516"], ["1bd881b5-a712-4559-8d14-19195cac2ac1", "87ac1033-2fa6-4c93-aae6-e0b9f2bb716e"], ["82f322b8-fd70-40dc-9df5-dfb3c667e813", "19815cb7-748c-4dde-8eeb-7f29ef3f6ee1"], ["0d5a52be-8374-497a-b98f-1f9 <script>
  const svg = document.getElementById('svg');
  const world = document.getElementById('world');
  const FULL = { x: -3940.0, y: -10948.5, w: 5756.0, h: 21897.0 };
  const GVB = [-3890.0, -10898.5, 3600.0, 17873.0];
  const HSB = [290.0, -8408.0, 1476.0, 9034.0];
  let k = 1, tx = 0, ty = 0;
  function apply() { world.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`); }
  function stageSize() { const r = svg.getBoundingClientRect(); return { w: r.width, h: r.height }; }
  function fitAll() {
    const s = stageSize();
    k = Math.min(s.w / FULL.w, s.h / FULL.h);
    tx = (s.w - FULL.w * k) / 2 - FULL.x * k;
    ty = (s.h - FULL.h * k) / 2 - FULL.y * k;
    apply();
  }
  function jump(r) {
    const s = stageSize();
    k = Math.min(s.w / (r[2] + 60), s.h / (r[3] + 60));
    tx = s.w / 2 - (r[0] + r[2] / 2) * k;
    ty = s.h / 2 - (r[1] + r[3] / 2) * k;
    apply();
  }
  function zoomAt(mx, my, f) {
    const px = (mx - tx) / k, py = (my - ty) / k;
    const k2 = Math.min(4, Math.max(0.02, k * f));
    tx = mx - px * k2; ty = my - py * k2; k = k2;
    apply();
  }
  function zoomC(f) { const s = stageSize(); zoomAt(s.w / 2, s.h / 2, f); }
  function toggleRel() {
    const l = document.getElementById('rellayer');
    const off = l.style.display === 'none';
    l.style.display = off ? '' : 'none';
    document.getElementById('relbtn').textContent = off ? 'Ẩn đường quan hệ' : 'Hiện đường quan hệ';
  }
  const ptrs = new Map();
  let lastPinch = 0, lastMid = null, downMoved = 0, hitId = null, multi = false;
  svg.addEventListener('pointerdown', e => {
    if (ptrs.size >= 1) multi = true;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const g = e.target && e.target.closest ? e.target.closest('g.node') : null;
    hitId = g ? g.dataset.id : null;
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    lastPinch = 0; lastMid = null; downMoved = 0;
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) {
      downMoved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
      tx += e.clientX - prev.x; ty += e.clientY - prev.y;
      apply();
    } else if (ptrs.size === 2) {
      const p = [...ptrs.values()];
      const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const mid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
      const r = svg.getBoundingClientRect();
      if (lastPinch > 0) zoomAt(mid.x - r.left, mid.y - r.top, dist / lastPinch);
      if (lastMid) { tx += mid.x - lastMid.x; ty += mid.y - lastMid.y; apply(); }
      lastPinch = dist; lastMid = mid;
    }
  });
  const endPtr = e => { ptrs.delete(e.pointerId); lastPinch = 0; lastMid = null; };
  svg.addEventListener('pointerup', endPtr);
  svg.addEventListener('pointercancel', endPtr);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });

  // ===== Che do bam-chon: nut lien quan sang len, con lai mo di =====
  const G = JSON.parse(document.getElementById('graph').textContent);
  const edgeEls = [...document.querySelectorAll('path.edge')];
  const relEls = [...document.querySelectorAll('#rellayer .rel, #rellayer .rellbl')];
  function focusNode(id) {
    const S = new Set([id]);
    const stack = [id];
    while (stack.length) { const cur = stack.pop(); (G.children[cur] || []).forEach(c => { S.add(c); stack.push(c); }); }
    let p = G.parent[id];
    while (p) { S.add(p); p = G.parent[p]; }
    G.rels.forEach(([a, b]) => { if (a === id) S.add(b); if (b === id) S.add(a); });
    document.querySelectorAll('g.node').forEach(el => {
      el.classList.toggle('dim', !S.has(el.dataset.id));
      el.classList.toggle('lit', S.has(el.dataset.id));
    });
    edgeEls.forEach(el => el.classList.toggle('dim', !(S.has(el.dataset.a) && S.has(el.dataset.b))));
    relEls.forEach(el => {
      const on = (el.dataset.a === id && S.has(el.dataset.b)) || (el.dataset.b === id && S.has(el.dataset.a));
      el.classList.toggle('dim', !on);
      if (el.tagName === 'path') el.classList.toggle('hot', on);
    });
    document.getElementById('fname').textContent = '🎯 ' + (G.titles[id] || '');
  }
  function clearFocus() {
    document.querySelectorAll('.dim, .lit, .hot').forEach(el => el.classList.remove('dim', 'lit', 'hot'));
    document.getElementById('fname').textContent = '';
  }
  svg.addEventListener('pointerup', e => {
    const wasMulti = multi;
    if (ptrs.size === 0) multi = false;
    if (downMoved > 6 || wasMulti) return;
    let id = hitId;
    if (!id) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('g.node') : null;
      id = g ? g.dataset.id : null;
    }
    if (id) focusNode(id); else clearFocus();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') clearFocus(); });
  fitAll();
</script>
</body>
</html>
